        // ----- add / edit a truck (number, driver name, city, 4-digit PIN) -----
        let editing = null;
        function resetForm() {
            editing = null;
            ['new-num', 'new-name', 'new-city', 'new-pin'].forEach(k => { $(k).value = ''; });
            $('new-num').disabled = false;
            $('new-title').textContent = 'Add a truck';
            $('new-btn').textContent = 'Add Truck';
            $('new-cancel').style.display = 'none';
        }
        function startEdit(id) {
            editing = id;
            $('new-num').value = id.slice(5); $('new-num').disabled = true;
            $('new-name').value = trucks[id].driverName || '';
            $('new-city').value = trucks[id].city || '';
            $('new-pin').value = (pins[id] && pins[id].pin) || '';
            $('new-title').textContent = 'Edit ' + truckName(id);
            $('new-btn').textContent = 'Save Changes';
            $('new-cancel').style.display = '';
            $('manage-msg').textContent = '';
            $('new-name').focus();
        }
        $('new-cancel').onclick = resetForm;
        $('new-pin').addEventListener('input', () => { $('new-pin').value = $('new-pin').value.replace(/\D/g, '').slice(0, 4); });

        $('new-btn').onclick = async () => {
            const msg = $('manage-msg');
            msg.style.color = '#dc2626'; msg.textContent = '';
            const num = parseInt($('new-num').value, 10);
            const driverName = $('new-name').value.trim().slice(0, 30);
            const city = $('new-city').value.trim().slice(0, 40);
            const pin = $('new-pin').value.trim();
            if (!(num >= 1 && num <= 99)) { msg.textContent = 'Enter a truck number from 1 to 99.'; return; }
            if (!driverName) { msg.textContent = 'Enter the driver\'s name (it shows in the sign-in list).'; return; }
            if (!city) { msg.textContent = 'Enter the truck\'s city.'; return; }
            if (!/^\d{4}$/.test(pin)) { msg.textContent = 'The PIN must be exactly 4 digits.'; return; }
            const id = 'truck' + num;
            if (!editing && trucks[id]) { msg.textContent = truckName(id) + ' already exists. Use Edit next to it to change it.'; return; }
            const clash = Object.keys(pins).find(k => k !== id && pins[k] && pins[k].pin === pin);
            if (clash && !confirm(`${truckName(clash)} already uses PIN ${pin}. Use it anyway? (Each driver still picks their own name, so it works, but different PINs are safer.)`)) return;

            $('new-btn').disabled = true;
            try {
                const email = id + '@' + DOMAIN, newPw = pinPassword(pin, id);
                const secAuth = getAuth(initializeApp(firebaseConfig, 'new-' + id + '-' + Date.now()));
                let created = false;
                try {
                    await createUserWithEmailAndPassword(secAuth, email, newPw);
                    created = true;
                    try { await signOut(secAuth); } catch (e) {}
                } catch (e) {
                    if (e.code !== 'auth/email-already-in-use') throw e;
                }
                if (!created) {
                    // The login already exists: switch it to the new PIN using the PIN we have on file
                    // (or ask for the old one, e.g. trucks added before 4-digit PINs).
                    const known = [pin, pins[id] && pins[id].pin];
                    try {
                        await withTruckLogin(id, known, (u) => updatePassword(u, newPw));
                    } catch (e) {
                        if (e.code !== 'pin-unknown' && e.code !== 'auth/invalid-credential' && e.code !== 'auth/wrong-password' && e.code !== 'auth/invalid-login-credentials') throw e;
                        const old = prompt(`${truckName(id)} already has a login from before. Type its OLD PIN once so it can be replaced with ${pin}:`);
                        if (!old) { msg.textContent = 'Not saved. You need the old PIN, or delete "' + email + '" in Firebase console → Authentication → Users and try again.'; return; }
                        await withTruckLogin(id, [old.trim()], (u) => updatePassword(u, newPw));
                    }
                }
                await setDoc(doc(db, 'pins', id), { pin });
                await setDoc(doc(db, 'trucks', id), editing ? { city, driverName } : { city, driverName, createdAt: serverTimestamp() }, { merge: true });
                msg.style.color = '#16a34a';
                msg.textContent = `${truckName(id)} (${driverName}) ${editing ? 'saved' : 'added'}. PIN: ${pin}` + (pinRequests[id] ? ' — tell the driver their new PIN.' : '');
                if (pinRequests[id]) await deleteDoc(doc(db, 'pin_requests', id)).catch(() => {});
                resetForm();
            } catch (e) {
                msg.textContent = e.code === 'permission-denied'
                    ? 'The database rules blocked this. Publish the latest firestore.rules (Firestore Database → Rules → Publish) and try again.'
                    : (e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/invalid-login-credentials')
                        ? 'That old PIN didn\'t work. Delete "' + id + '@' + DOMAIN + '" in Firebase console → Authentication → Users, then add the truck again.'
                        : explainAuthError(e, 'that truck');
            } finally { $('new-btn').disabled = false; }
        };

                const info = document.createElement('div');
                info.innerHTML = `<strong>🔑 ${esc(a.name)}</strong><br><span class="muted">Admin · can use this console</span>`;
                const rm = document.createElement('button');
                rm.className = 'link-btn stop-link'; rm.textContent = 'Remove';
                rm.onclick = async () => {
                    if (!confirm(`Remove ${a.name} as an admin? They lose access to this console right away. (To change their password, remove them and add them again.)`)) return;
                    try { await deleteDoc(doc(db, 'admins', uid)); }
                    catch (e) { $('admins-msg').textContent = 'Could not remove ' + a.name + '.'; }
                };
                row.append(info, rm);
                el.appendChild(row);
            });
        }
        $('new-admin-btn').onclick = async () => {
            const msg = $('admins-msg');
            msg.style.color = '#dc2626'; msg.textContent = '';
            const name = $('new-admin-name').value.trim().replace(/\s+/g, ' ');
            if (!/^[A-Za-z][A-Za-z0-9 .'-]{0,19}$/.test(name)) { msg.textContent = 'Enter a name (letters first, up to 20 characters).'; return; }
            if (Object.values(admins).some(a => a.name.toLowerCase() === name.toLowerCase())) { msg.textContent = name + ' is already an admin.'; return; }
            const pass = $('new-admin-pass').value;
            if (pass.length < 6) { msg.textContent = 'The password needs at least 6 characters.'; return; }
            const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, '').slice(0, 12) || 'admin';
            const rand = () => Math.random().toString(36).slice(2, 6);
            $('new-admin-btn').disabled = true;
            try {
                // Create their login on a separate connection so you stay signed in. The random part of the
                // account name means nobody can guess it and create it first.
                const secAuth = getAuth(initializeApp(firebaseConfig, 'adm-' + Date.now()));
                let cred, email;
                for (let i = 0; i < 3 && !cred; i++) {
                    email = `admin-${slug}-${rand()}@${DOMAIN}`;
                    try { cred = await createUserWithEmailAndPassword(secAuth, email, pass); }
                    catch (e) { if (e.code !== 'auth/email-already-in-use') throw e; }
                }
                try { await signOut(secAuth); } catch (e) {}
                await setDoc(doc(db, 'admins', cred.user.uid), { name, email, pending: false });
                msg.style.color = '#16a34a';
                msg.innerHTML = `${esc(name)} is now an admin. Their password: <strong>${esc(pass)}</strong><br>`
                    + `<span style="color:#334155; font-weight:400;">They open Staff login, pick "🔑 ${esc(name)} (admin)" under "Who are you?", type that password and tap Sign In.</span>`;
                $('new-admin-name').value = ''; $('new-admin-pass').value = '';
            } catch (e) {
                msg.textContent = e.code === 'permission-denied'
                    ? 'The database rules blocked this. Publish the latest firestore.rules and try again.'
                    : explainAuthError(e, 'admin');
            } finally { $('new-admin-btn').disabled = false; }
        };

        // ----- clear customer requests -----
        $('clear-requests-btn').onclick = async () => {
            if (!confirm('Clear ALL customer requests? This can\'t be undone.')) return;
            try {
                const all = await getDocs(collection(db, 'customer_requests')); // includes older ones not shown on screen
                await Promise.all(all.docs.map(d => deleteDoc(doc(db, 'customer_requests', d.id))));
                errEl.textContent = '';
            } catch (e) { errEl.textContent = 'Could not clear the requests. Check your connection.'; }
        };

        // ----- CSV export -----
        // Full detail is only downloaded when you click the button, so it costs nothing the rest of the day.
        $('csv-btn').onclick = async () => {
            const q = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
            let sales = [], stops = [];
            try {
                const [s1, s2] = await Promise.all([
                    getDocs(query(collection(db, 'sales'), where('day', '==', today))),
                    getDocs(query(collection(db, 'stops'), where('day', '==', today)))
                ]);
                sales = s1.docs.map(d => d.data()); stops = s2.docs.map(d => d.data());
            } catch (e) { errEl.textContent = 'Could not download today\'s data.'; return; }
            const rows = [['type', 'truck', 'city', 'start', 'end', 'minutes', 'amount', 'items', 'lat', 'lng']];
            sales.forEach(s => {
                const t = s.createdAt && s.createdAt.toMillis ? s.createdAt.toMillis() : '';
                rows.push(['sale', truckName(s.truckId), trucks[s.truckId]?.city || '', t ? new Date(t).toLocaleString() : '', '', '', s.amount, s.items, '', '']);
            });
            stops.forEach(s => rows.push(['stop', truckName(s.truckId), trucks[s.truckId]?.city || '', new Date(s.startedAt).toLocaleString(), new Date(s.endedAt).toLocaleString(), (s.durationSec / 60).toFixed(1), '', '', s.lat, s.lng]));
            const csv = rows.map(r => r.map(q).join(',')).join('\n');
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
            a.download = `fleet-${today}.csv`;
            a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        };

        // ----- Dispatch: send a truck to one or more stops -----
        // The stops are saved in the shared settings document every driver's phone already listens to,
        // so sending them costs almost nothing and reaches the driver within a second or two.
        let draft = [], tapMode = false, acks = {}, acksOk = false, lastTruckOpts = '';
        const dispLayers = {};
        const draftLayer = L.layerGroup().addTo(map);
        const DISPATCH_MAX = 9;
        const dErr = (msg) => { const e = $('dispatch-err'); e.style.color = '#dc2626'; e.textContent = msg || ''; };
        const dOk = (msg) => { const e = $('dispatch-err'); e.style.color = '#16a34a'; e.textContent = msg; };
        const stopIcon = (label, cls) => L.divIcon({ className: 'stop-icon', html: '<div class="stop-pin ' + (cls || '') + '">' + label + '</div>', iconSize: [28, 28], iconAnchor: [14, 14] });
        const validDispatch = (d) => !!(d && d.id && Array.isArray(d.stops) && d.stops.length);

        function renderDispatchTruckSelect() {
            const sel = $('dispatch-truck');
            const ids = Object.keys(trucks).sort(byTruckNum);
            const html = '<option value="">' + (ids.length ? '— Choose a truck —' : 'No trucks yet') + '</option>'
                + ids.map(id => '<option value="' + esc(id) + '">' + esc(truckName(id) + (nameOf(id) ? ' — ' + nameOf(id) : '') + ' · ' + statusOf(id).label) + '</option>').join('');
            if (html === lastTruckOpts) return;
            const prev = sel.value;
            sel.innerHTML = html; lastTruckOpts = html;
            if (ids.includes(prev)) sel.value = prev;
        }
        function renderDraft() {
            draftLayer.clearLayers();
            const el = $('dispatch-stops');
            el.innerHTML = draft.length ? '' : '<p class="muted" style="margin:4px 0 10px;">No stops yet. Search for an address, or tap "Tap the map" and touch the spot.</p>';
            draft.forEach((s, i) => {
                L.marker([s.lat, s.lng], { icon: stopIcon(i + 1, 'draft'), draggable: true })
                    .on('dragend', (ev) => { const p = ev.target.getLatLng(); s.lat = p.lat; s.lng = p.lng; })
                    .addTo(draftLayer);
                const row = document.createElement('div');
                row.className = 'draft-row';
                row.innerHTML = '<span class="stop-num" style="background:#7c3aed;">' + (i + 1) + '</span><div class="stop-main"><div>' + esc(s.label) + '</div></div>';
                const note = document.createElement('input');
                note.type = 'text'; note.maxLength = 80; note.autocomplete = 'off'; note.placeholder = 'Note for this stop (optional)'; note.value = s.note || '';
                note.style.cssText = 'margin:4px 0 0; padding:6px 8px; font-size:14px;';
                note.oninput = () => { s.note = note.value; };
                row.querySelector('.stop-main').appendChild(note);
                const tools = document.createElement('div');
                tools.style.cssText = 'display:flex; gap:4px;';
                const mk = (txt, title, fn, disabled) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'mini-btn'; b.textContent = txt; b.title = title; b.disabled = !!disabled; b.onclick = fn; tools.appendChild(b); };
                mk('↑', 'Move up', () => { draft.splice(i - 1, 0, draft.splice(i, 1)[0]); renderDraft(); }, i === 0);
                mk('↓', 'Move down', () => { draft.splice(i + 1, 0, draft.splice(i, 1)[0]); renderDraft(); }, i === draft.length - 1);
                mk('✕', 'Remove', () => { draft.splice(i, 1); renderDraft(); });
                row.appendChild(tools);
                el.appendChild(row);
            });
            $('dispatch-send').disabled = !draft.length;
        }
        function addDraft(lat, lng, label) {
            if (draft.length >= DISPATCH_MAX) { dErr('You can plan up to ' + DISPATCH_MAX + ' stops at a time.'); return -1; }
            draft.push({ lat, lng, label: String(label || 'Dropped pin').slice(0, 80), note: '' });
            dErr('');
            renderDraft();
            if (draft.length === 1) map.setView([lat, lng], Math.max(map.getZoom(), 14));
            return draft.length - 1;
        }
        function updateTap() {
            $('dispatch-tap').textContent = tapMode ? '✋ Tap the map to drop stops — tap here when finished' : '🗺️ Tap the map to drop a stop';
            document.body.classList.toggle('map-tap-on', tapMode);
        }
        $('dispatch-tap').onclick = () => {
            tapMode = !tapMode; updateTap();
            if (tapMode) $('admin-map').scrollIntoView({ behavior: 'smooth', block: 'center' });
        };
        map.on('click', async (e) => {
            if (!tapMode) return;
            const lat = e.latlng.lat, lng = e.latlng.lng;
            const idx = addDraft(lat, lng, 'Dropped pin (' + lat.toFixed(4) + ', ' + lng.toFixed(4) + ')');
            if (idx < 0) return;
            const s = draft[idx];
            const name = await reverseGeocode(lat, lng);
            if (name && draft.includes(s)) { s.label = name; renderDraft(); }
        });
        $('dispatch-find').onclick = async () => {
            const q = $('dispatch-addr').value.trim();
            const box = $('dispatch-results');
            if (!q) { dErr('Type an address or place first.'); return; }
            dErr('');
            $('dispatch-find').disabled = true;
            box.style.display = '';
            box.innerHTML = '<p class="muted" style="padding:8px 10px; margin:0;">Searching…</p>';
            try {
                const found = await geocode(q, map.getZoom() >= 8 ? map.getBounds() : null);
                if (!found.length) { box.innerHTML = '<p class="muted" style="padding:8px 10px; margin:0;">No match. Try adding the city and state.</p>'; return; }
                box.innerHTML = '';
                found.forEach(r => {
                    const b = document.createElement('button');
                    b.type = 'button'; b.textContent = '📍 ' + r.label;
                    b.onclick = () => { box.style.display = 'none'; box.innerHTML = ''; $('dispatch-addr').value = ''; addDraft(r.lat, r.lng, r.label); };
                    box.appendChild(b);
                });
            } catch (e) {
                box.innerHTML = '<p class="err" style="padding:8px 10px; margin:0;">Address search isn\'t answering right now. Try again, or tap the map instead.</p>';
            } finally { $('dispatch-find').disabled = false; }
        };
        $('dispatch-addr').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('dispatch-find').click(); });

        $('dispatch-send').onclick = async () => {
            const id = $('dispatch-truck').value;
            if (!id) { dErr('Choose which truck to send.'); return; }
            if (!draft.length) { dErr('Add at least one stop.'); return; }
            if (validDispatch((config.dispatch || {})[id]) && !confirm(truckName(id) + ' already has stops from dispatch. Replace them with this new list?')) return;
            $('dispatch-send').disabled = true;
            try {
                const by = await adminDisplayName(opts);
                const payload = {
                    id: 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                    stops: draft.map(s => ({ lat: Math.round(s.lat * 1e6) / 1e6, lng: Math.round(s.lng * 1e6) / 1e6, label: String(s.label || '').slice(0, 80), note: String(s.note || '').trim().slice(0, 80) })),
                    note: $('dispatch-note').value.trim().slice(0, 120),
                    by: String(by).slice(0, 40),
                    sentAt: Date.now()
                };
                await setDoc(doc(db, 'config', 'metrics'), { dispatch: { [id]: payload } }, { merge: true });
                draft = []; $('dispatch-note').value = ''; tapMode = false; updateTap(); renderDraft();
                dOk('Sent to ' + truckName(id) + '. Their phone rings and shows the route.' + (fleet[id] ? '' : ' They\'re not online right now, so they\'ll see it as soon as they open the app.'));
            } catch (e) {
                dErr(e && e.code === 'permission-denied' ? 'The database rules blocked this. Make sure you\'re signed in as an admin.' : 'Could not send. Check your connection and try again.');
            } finally { $('dispatch-send').disabled = !draft.length; }
        };
        async function cancelDispatch(id) {
            if (!confirm('Cancel the stops sent to ' + truckName(id) + '? They disappear from the driver\'s phone.')) return;
            try { await setDoc(doc(db, 'config', 'metrics'), { dispatch: { [id]: deleteField() } }, { merge: true }); }
            catch (e) { dErr('Could not cancel. Check your connection.'); }
        }
        function showDispatchOnMap(id) {
            const d = (config.dispatch || {})[id];
            if (!validDispatch(d)) return;
            const pts = d.stops.map(s => [s.lat, s.lng]);
            const f = fleet[id];
            if (f && typeof f.lat === 'number' && typeof f.lng === 'number') pts.push([f.lat, f.lng]);
            if (pts.length === 1) map.setView(pts[0], 15); else map.fitBounds(pts, { padding: [50, 50], maxZoom: 16 });
            $('admin-map').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        function startDispatchFor(id) {
            const sec = $('dispatch-section');
            sec.open = true;
            renderDispatchTruckSelect();
            $('dispatch-truck').value = id;
            sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        function renderDispatchList() {
            const all = config.dispatch || {};
            const ids = Object.keys(all).filter(id => validDispatch(all[id])).sort(byTruckNum);
            const el = $('dispatch-active');
            el.innerHTML = ids.length ? '<h4 style="margin:14px 0 4px;">Sent stops</h4>' : '';
            ids.forEach(id => {
                const d = all[id];
                const a = acks[id] && acks[id].dispatchId === d.id ? acks[id] : null;
                const doneArr = a && Array.isArray(a.done) ? a.done : [];
                let status = '';
                if (a) status = doneArr.length >= d.stops.length ? '✅ All stops done'
                    : '👀 Driver saw it' + (a.seenAt ? ' at ' + fmtTime(a.seenAt) : '') + (doneArr.length ? ' · ' + doneArr.length + ' of ' + d.stops.length + ' done' : '');
                else if (acksOk) status = '⏳ Not seen yet';
                const info = dispLayers[id] && dispLayers[id].info ? ' · ' + dispLayers[id].info : '';
                const card = document.createElement('div');
                card.className = 'disp-card';
                card.innerHTML = '<div style="display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap;"><strong>🚚 ' + esc(truckName(id)) + (nameOf(id) ? ' — ' + esc(nameOf(id)) : '') + '</strong>'
                    + '<span class="muted">' + d.stops.length + ' stop' + (d.stops.length === 1 ? '' : 's') + ' · sent ' + esc(fmtTime(d.sentAt)) + (d.by ? ' by ' + esc(d.by) : '') + esc(info) + '</span></div>'
                    + (status ? '<div style="margin-top:4px; font-weight:600;">' + esc(status) + '</div>' : '')
                    + '<ol style="margin:6px 0 0; padding-left:20px; font-size:14px;">'
                    + d.stops.map((s, i) => '<li' + (doneArr.includes(i) ? ' style="text-decoration:line-through; color:#16a34a;"' : '') + '>' + esc(s.label) + (s.note ? ' <span class="muted">— ' + esc(s.note) + '</span>' : '') + '</li>').join('')
                    + '</ol>' + (d.note ? '<div class="muted" style="margin-top:4px;">💬 ' + esc(d.note) + '</div>' : '');
                const btns = document.createElement('div');
                btns.style.cssText = 'display:flex; gap:16px; margin-top:6px;';
                const sh = document.createElement('button');
                sh.className = 'link-btn'; sh.type = 'button'; sh.textContent = 'Show on map'; sh.onclick = () => showDispatchOnMap(id);
                const cx = document.createElement('button');
                cx.className = 'link-btn stop-link'; cx.type = 'button'; cx.textContent = 'Cancel stops'; cx.onclick = () => cancelDispatch(id);
                btns.append(sh, cx);
                card.appendChild(btns);
                el.appendChild(card);
            });
        }
        function syncDispatchLayers() {
            const all = config.dispatch || {};
            Object.keys(dispLayers).forEach(id => {
                if (!validDispatch(all[id]) || all[id].id !== dispLayers[id].did) { map.removeLayer(dispLayers[id].group); delete dispLayers[id]; }
            });
            Object.keys(all).filter(id => validDispatch(all[id])).forEach(id => {
                if (!dispLayers[id]) drawDispatch(id, all[id]); else drawDispatchMarkers(id);
            });
        }
        function drawDispatch(id, d) {
            const entry = { did: d.id, group: L.layerGroup().addTo(map), markers: L.layerGroup(), doneKey: null, info: '' };
            entry.markers.addTo(entry.group);
            dispLayers[id] = entry;
            drawDispatchMarkers(id);
            const f = fleet[id];
            const pts = (f && typeof f.lat === 'number' && typeof f.lng === 'number' ? [[f.lat, f.lng]] : []).concat(d.stops.map(s => [s.lat, s.lng]));
            if (pts.length < 2) return;
            fetchRoute(pts).then(r => {
                if (dispLayers[id] !== entry) return;
                L.polyline(r ? r.coords : pts, r ? { color: '#ea580c', weight: 5, opacity: 0.7 } : { color: '#ea580c', weight: 3, opacity: 0.8, dashArray: '8 10' }).addTo(entry.group);
                entry.info = r ? fmtMiles(r.distance) + ' · ~' + fmtDur(r.duration * 1000) : '';
                renderDispatchList();
            });
        }
        function drawDispatchMarkers(id) {
            const entry = dispLayers[id], d = (config.dispatch || {})[id];
            if (!entry || !validDispatch(d)) return;
            const a = acks[id] && acks[id].dispatchId === d.id ? acks[id] : null;
            const doneArr = a && Array.isArray(a.done) ? a.done : [];
            const key = doneArr.join(',');
            if (entry.doneKey === key) return;
            entry.doneKey = key;
            entry.markers.clearLayers();
            d.stops.forEach((s, i) => {
                const isDone = doneArr.includes(i);
                L.marker([s.lat, s.lng], { icon: stopIcon(isDone ? '✓' : i + 1, isDone ? 'done' : '') })
                    .bindPopup('<b>' + esc(truckName(id)) + ' · stop ' + (i + 1) + '</b><br>' + esc(s.label) + (s.note ? '<br><small>' + esc(s.note) + '</small>' : ''))
                    .addTo(entry.markers);
            });
        }
        function renderDispatchAdmin() { renderDispatchTruckSelect(); syncDispatchLayers(); renderDispatchList(); }
        renderDraft(); updateTap();

        // ----- live data -----
        // Listeners only run while this page is on screen. Every live update costs a "read", so a
        // forgotten tab in the background would otherwise burn through the free daily allowance.
        let unsubs = [];
        let hiddenTimer = null;
        function attach() {
            if (unsubs.length) return;
            unsubs.push(onSnapshot(collection(db, 'trucks'), (snap) => {
                trucks = {}; snap.forEach(d => { trucks[d.id] = d.data(); }); renderAll();
            }, denied));
            unsubs.push(onSnapshot(collection(db, 'pins'), (snap) => {
                pins = {}; snap.forEach(d => { pins[d.id] = d.data(); }); renderManage();
            }, denied));
            unsubs.push(onSnapshot(collection(db, 'pin_requests'), (snap) => {
                pinRequests = {}; snap.forEach(d => { pinRequests[d.id] = d.data(); }); renderPinRequests();
            }, denied));
            if (opts.primary) {
                unsubs.push(onSnapshot(collection(db, 'admins'), (snap) => {
                    admins = {}; snap.forEach(d => { admins[d.id] = d.data(); }); renderAdmins();
                }, denied));
            }
            unsubs.push(onSnapshot(collection(db, 'active_fleet'), (snap) => {
                fleet = {}; snap.forEach(d => { fleet[d.id] = d.data(); }); renderAll();
            }, denied));
            unsubs.push(onSnapshot(query(collection(db, 'daily'), where('day', '==', today)), (snap) => {
                daily = {}; snap.forEach(d => { const v = d.data(); daily[v.truckId] = v; });
                renderStats(); renderTrucks();
            }, denied));
            unsubs.push(onSnapshot(query(collection(db, 'stops'), orderBy('endedAt', 'desc'), limit(12)), (snap) => {
                recentStops = snap.docs.map(d => d.data()); renderStops();
            }, denied));
            unsubs.push(onSnapshot(collection(db, 'dispatch_acks'), (snap) => {
                acksOk = true; acks = {}; snap.forEach(d => { acks[d.id] = d.data(); });
                renderDispatchList(); Object.keys(dispLayers).forEach(drawDispatchMarkers);
            }, () => { acksOk = false; }));
            unsubs.push(onSnapshot(doc(db, 'config', 'metrics'), (snap) => {
                config = { ...DEFAULT_CONFIG, ...(snap.exists() ? snap.data() : {}) }; renderAll();
            }, denied));
            unsubs.push(onSnapshot(query(collection(db, 'customer_requests'), orderBy('createdAt', 'desc'), limit(10)), (snap) => {
            const listEl = $('admin-pings-list');
            listEl.innerHTML = '';
            $('clear-requests-btn').style.display = snap.empty ? 'none' : '';
            if (snap.empty) { listEl.innerHTML = '<em>No active requests at the moment.</em>'; return; }
            snap.forEach(docSnap => {
                const d = docSnap.data();
                const sent = d.createdAt && d.createdAt.toMillis ? fmtTime(d.createdAt.toMillis()) : '';
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <strong>Party of ${esc(d.partySize)}</strong> — Target: ${esc(d.requestedTime)}${sent ? ' <span class="muted" style="font-size:12px;">(sent ' + sent + ')</span>' : ''}<br>
                        <small class="muted">Notes: ${esc(d.notes)}</small>
                    </div>`;
                const clr = document.createElement('button');
                clr.className = 'link-btn stop-link'; clr.textContent = 'Clear';
                clr.onclick = () => deleteDoc(doc(db, 'customer_requests', docSnap.id)).catch(() => { errEl.textContent = 'Could not clear that request.'; });
                card.appendChild(clr);
                listEl.appendChild(card);
            });
            }, denied));
        }
        function detach() { unsubs.forEach(u => u()); unsubs = []; }

        // Pause after 1 minute hidden (so quickly switching apps doesn't cost a full reload); resume on return.
        const onVis = () => {
            clearTimeout(hiddenTimer);
            if (document.visibilityState === 'hidden') hiddenTimer = setTimeout(detach, 60000);
            else attach();
        };
        document.addEventListener('visibilitychange', onVis);
        attach();

        // refresh "updated 40s ago" / stale labels, and roll over at midnight
        const timer = setInterval(() => {
            if (dayStr() !== today) { location.reload(); return; }
            renderStats(); renderTrucks();
        }, 30000);

        cleanup = () => {
            detach(); clearTimeout(hiddenTimer); clearInterval(timer);
            document.removeEventListener('visibilitychange', onVis);
            document.body.classList.remove('map-tap-on');
            safeRemoveMap(map);
        };
    }
</script>
</body>
</html>
