<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet & Dispatch</title>
    <style>
        :root { --primary: #0f172a; --accent: #2563eb; --bg: #f8fafc; --card: #ffffff; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: var(--bg); color: #1e293b; }
        .container { max-width: 960px; margin: 20px auto; padding: 0 15px; }
        .panel { background: var(--card); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        input, select, button.action-btn { width: 100%; padding: 12px; margin: 8px 0 16px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; background-color: #fff; }
        input[type=checkbox] { width: auto; margin: 0 8px 0 0; }
        button.action-btn { background: var(--accent); color: white; font-weight: bold; border: none; cursor: pointer; }
        button.link-btn { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 14px; padding: 0; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 10px; }
        .topbar small { color: #64748b; word-break: break-all; }
        .err { color: #dc2626; font-weight: 600; text-align: center; min-height: 1.2em; }
        h3 { margin: 22px 0 8px; }
        #admin-map { height: 400px; width: 100%; border-radius: 8px; margin-bottom: 16px; }
        .card { background: #f1f5f9; padding: 12px 16px; border-left: 4px solid var(--accent); margin-bottom: 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .badge { background: #dbeafe; color: #1e40af; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; white-space: nowrap; }
        .badge.on { background: #dcfce7; color: #166534; }
        .badge.stale { background: #fef3c7; color: #92400e; }
        .badge.off { background: #e2e8f0; color: #475569; }
        .share-box { background: #e2e8f0; padding: 12px; border-radius: 6px; margin-bottom: 16px; word-break: break-all; font-size: 13px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 12px 0; }
        .stat { background: #f1f5f9; border-radius: 10px; padding: 12px; text-align: center; }
        .stat b { display: block; font-size: 22px; }
        .stat span { font-size: 12px; color: #64748b; }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
        .chip { border: 1px solid #cbd5e1; background: #fff; border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
        .chip:hover { border-color: var(--accent); color: var(--accent); }
        .city-head { margin: 14px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: #64748b; }
        .tcard { border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; margin-bottom: 8px; cursor: pointer; background: #fff; }
        .tcard:hover { border-color: var(--accent); }
        .tcard .row { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }
        .metrics { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 6px; font-size: 13px; color: #334155; }
        .muted { color: #64748b; font-size: 13px; }
        .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
        .tbl th, .tbl td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #e2e8f0; }
        .inline-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; align-items: end; }
        .inline-form input, .inline-form select { margin: 4px 0 0; }
        .inline-form button.action-btn { margin: 4px 0 0; }
        .toggle { display: flex; align-items: center; margin: 6px 0; }
        .stopbar { background: #fef2f2; border: 1px solid #fecaca; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
        .pop-stop { margin-top: 6px; background: #dc2626; color: #fff; border: none; border-radius: 6px; padding: 6px 10px; font-weight: 600; cursor: pointer; }
        .tcard .stop-link { color: #dc2626; }
        details { border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px 14px; margin-top: 14px; }
        summary { cursor: pointer; font-weight: 700; }

        /* ---------- CUSTOMER THEME ---------- */
        body.customer-theme {
            background: linear-gradient(180deg, #ffe3ef 0%, #e0f7ff 55%, #fff6dc 100%);
            background-attachment: fixed;
            font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
            min-height: 100vh;
        }
        .c-wrap { max-width: 520px; margin: 0 auto; padding: 24px 16px 48px; position: relative; overflow: hidden; }
        .c-hero { text-align: center; position: relative; padding-top: 8px; }
        .c-hero h1 { margin: 6px 0 4px; font-size: 2rem; color: #d6336c; text-shadow: 2px 2px 0 #fff; letter-spacing: .5px; }
        .c-hero p { margin: 0 auto 8px; color: #5b6b86; max-width: 360px; }
        .c-art { display: flex; justify-content: center; align-items: flex-end; gap: 18px; height: 150px; }
        .c-art svg { height: 140px; width: auto; filter: drop-shadow(0 6px 6px rgba(0,0,0,.12)); }
        .c-art .cone { animation: bob 3.2s ease-in-out infinite; }
        .c-art .slush { animation: bob 3.2s ease-in-out infinite .8s; }
        @keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
        .sprinkle { position: absolute; width: 10px; height: 4px; border-radius: 3px; opacity: .85; animation: fall 7s linear infinite; }
        @keyframes fall { from { transform: translateY(-20px) rotate(0); } to { transform: translateY(520px) rotate(360deg); } }
        .c-card { background: rgba(255,255,255,.92); border: 3px dashed #ffb3cf; border-radius: 22px; padding: 22px 20px 18px; margin-top: 10px; box-shadow: 0 10px 24px rgba(214,51,108,.15); position: relative; }
        .c-card label { font-weight: 700; color: #7a3b57; font-size: 14px; }
        .c-card input { border: 2px solid #ffd0e1; border-radius: 14px; background: #fffafc; }
        .c-card input:focus { outline: none; border-color: #ff6fa5; box-shadow: 0 0 0 3px rgba(255,111,165,.2); }
        .c-card .action-btn { background: linear-gradient(135deg, #ff6fa5, #ff8e53); border-radius: 999px; font-size: 18px; padding: 14px; box-shadow: 0 6px 0 #d6336c; margin-bottom: 14px; transition: transform .08s, box-shadow .08s; }
        .c-card .action-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #d6336c; }
        .c-status { text-align: center; font-weight: 700; min-height: 1.4em; margin: 0; }
        .c-wave { display: block; width: 100%; height: 36px; margin-top: 26px; }
        .staff-link { display: block; text-align: center; font-size: 12px; color: #a78bab; margin-top: 4px; text-decoration: none; }
        .staff-link:hover { text-decoration: underline; }

        @media (prefers-reduced-motion: reduce) { .c-art svg, .sprinkle { animation: none; } }
    </style>
</head>
<body>

<div id="app"></div>

<!-- ============ TEMPLATES (only the one for the visitor is ever inserted) ============ -->

<template id="tpl-login">
    <div class="container">
        <div class="panel" style="max-width:420px; margin:40px auto;">
            <p class="muted" id="login-checking">Checking setup…</p>

            <!-- First-time setup: only shown until the admin login has been created -->
            <div id="setup-box" style="display:none;">
                <h2 style="margin-bottom:4px;">Create the admin login</h2>
                <p class="muted" style="margin-top:0;">First-time setup. Choose the username and password you'll use to open the Dispatch Console. You only do this once.</p>
                <label for="setup-user">Admin username</label>
                <input type="text" id="setup-user" placeholder="e.g., brandon" maxlength="30" autocapitalize="none" autocomplete="username">
                <label for="setup-pass">Password (at least 6 characters)</label>
                <input type="password" id="setup-pass" autocomplete="new-password">
                <label for="setup-pass2">Type the password again</label>
                <input type="password" id="setup-pass2" autocomplete="new-password">
                <button class="action-btn" id="setup-btn">Create Admin Login</button>
                <p class="err" id="setup-err"></p>
            </div>

            <div id="signin-box" style="display:none;">
                <h2>Staff Sign In</h2>
                <label for="login-role">Signing in as</label>
                <select id="login-role">
                    <option value="driver" selected>Driver</option>
                    <option value="admin">Admin</option>
                </select>
                <label for="login-id" id="login-id-label">Truck number</label>
                <input type="text" id="login-id" placeholder="e.g., 2" inputmode="numeric" autocapitalize="none" autocomplete="username">
                <label for="login-pass" id="login-pass-label">PIN</label>
                <input type="password" id="login-pass" placeholder="Your PIN" autocomplete="current-password">
                <button class="action-btn" id="login-btn">Sign In</button>
                <p class="err" id="login-err"></p>
            </div>
            <a class="link-btn" href="#customer" style="display:block; text-align:center; text-decoration:none;">← Back to customer page</a>
        </div>
    </div>
</template>

<template id="tpl-driver">

</template>

<template id="tpl-admin">
    <div class="container">
        <div class="panel">
            <div class="topbar">
                <small id="admin-who"></small>
                <button class="link-btn" id="admin-logout">Sign out</button>
            </div>
            <h2 style="margin:4px 0;">Dispatch Console</h2>

                <p class="muted">Choose what drivers record. Turning something off hides it from drivers and from this page.</p>
                <label class="toggle"><input type="checkbox" id="cfg-stops"> Time spent at each stop</label>
                <label class="toggle"><input type="checkbox" id="cfg-sales"> Dollars made (drivers log each sale)</label>
                <label class="toggle"><input type="checkbox" id="cfg-items"> Items sold (with each sale)</label>
                <p class="muted" style="margin-top:12px;"><strong>Location updates:</strong> every 30 seconds while a truck is moving,

            </details>

            <details>
                <summary>Manage trucks</summary>

                <div class="inline-form">
                    <div><label for="new-num">Truck number</label><input type="number" id="new-num" min="1" max="99" placeholder="e.g., 3"></div>
                    <div><label for="new-city">City</label><input type="text" id="new-city" maxlength="40" placeholder="e.g., Austin"></div>

            </div>
        </div>
    </div>
</template>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { initializeFirestore, collection, addDoc, setDoc, deleteDoc, doc, onSnapshot, getDoc, getDocs, increment, serverTimestamp, query, orderBy, limit, where }
        from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged }
        from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDYvkoarsvnosLCvjsTRSgjmxgfyF_d3Uc",
        authDomain: "dads-fleet-tracker.firebaseapp.com",
        projectId: "dads-fleet-tracker",
        storageBucket: "dads-fleet-tracker.firebasestorage.app",
        messagingSenderId: "44787930426",
        appId: "1:44787930426:web:db1b59a767e5ae71aeec03"
    };

    const app = initializeApp(firebaseConfig);
    // Long polling: plain web requests instead of a streaming connection. Some phones, in-app browsers,
    // data-saver modes and ad/DNS blockers silently stall the streaming connection; this works everywhere.
    const db = initializeFirestore(app, { experimentalForceLongPolling: true });
    const auth = getAuth(app);

    // Staff type a truck number + PIN. Behind the scenes that becomes an account like truck2@dispatch.local.
    const DOMAIN = 'dispatch.local';
    const ADMIN_EMAIL = 'admin@' + DOMAIN;
    const DEFAULT_CONFIG = { stops: true, sales: true, items: true };
    // Location ping timing (fixed): every 30s while moving, every 90s while parked at a stop.
    const MOVING_MS = 30000, PARKED_MS = 90000;
    const STALE_MS = 4 * 60000; // no update for 4 minutes -> shown as "Stale" (phone locked, no signal, etc.)

    const $app = document.getElementById('app');
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const dayStr = (ms = Date.now()) => new Date(ms).toLocaleDateString('en-CA'); // YYYY-MM-DD, local time
    const money = (n) => '$' + Number(n || 0).toFixed(2);
    // "truck2" -> "Truck 2". Anything else (e.g. "Driver 1" left over from the original app) is shown as-is.
    const truckName = (id) => /^truck\d+$/.test(String(id)) ? 'Truck ' + String(id).slice(5) : String(id) + ' (old app)';
    const byTruckNum = (a, b) => {
        const na = /^truck\d+$/.test(a) ? parseInt(a.slice(5), 10) : NaN, nb = /^truck\d+$/.test(b) ? parseInt(b.slice(5), 10) : NaN;
        if (!isNaN(na) && !isNaN(nb)) return na - nb;
        if (!isNaN(na)) return -1; if (!isNaN(nb)) return 1;
        return String(a).localeCompare(String(b));
    };
    const fmtTime = (ms) => new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    const fmtDur = (ms) => {
        const m = Math.max(0, Math.round(ms / 60000));
        return m < 60 ? m + ' min' : Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
    };
    const fmtAge = (ms) => {
        const s = Math.round(ms / 1000);
        return s < 90 ? s + 's ago' : fmtDur(ms) + ' ago';
    };
    function loginIdFrom(input) {
        const s = String(input || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
        if (s === 'admin') return 'admin';
        if (/^\d{1,2}$/.test(s)) return 'truck' + parseInt(s, 10);
        if (/^truck\d{1,2}$/.test(s)) return 'truck' + parseInt(s.slice(5), 10);
        return null;
    }
    function distMeters(aLat, aLng, bLat, bLng) {
        const R = 6371000, rad = Math.PI / 180;
        const dLat = (bLat - aLat) * rad, dLng = (bLng - aLng) * rad;
        const h = Math.sin(dLat / 2) ** 2 + Math.cos(aLat * rad) * Math.cos(bLat * rad) * Math.sin(dLng / 2) ** 2;
        return 2 * R * Math.asin(Math.sqrt(h));
    }

    function mount(id) {
        $app.innerHTML = '';
        $app.appendChild(document.getElementById(id).content.cloneNode(true));
    }

    let cleanup = () => {};
    let authUnsub = null;
    let loginNotice = '';

    // ---------- ROUTING ----------
    const params = new URLSearchParams(window.location.search);
    const role = params.get('role') || params.get('view') || 'customer';
    const baseUrl = window.location.origin + window.location.pathname;

    function route() {
        cleanup(); cleanup = () => {};
        if (authUnsub) { authUnsub(); authUnsub = null; }
        const wantsStaff = location.hash === '#staff' || role === 'driver' || role === 'admin';
        if (wantsStaff && location.hash !== '#customer') {
            document.body.classList.remove('customer-theme');
            startStaffFlow();
        } else {
            startCustomer();
        }
    }
    window.addEventListener('hashchange', () => {
        if (location.hash === '#customer') history.replaceState(null, '', location.pathname);
        route();
    });
    route();

    // ---------- STAFF ----------
    function startStaffFlow() {
        authUnsub = onAuthStateChanged(auth, (user) => {
            cleanup(); cleanup = () => {};
            if (!user) { showLogin(); return; }
            const local = (user.email || '').split('@')[0];
            if (user.email === ADMIN_EMAIL) { showAdmin(user); }
            else if (/^truck\d{1,2}$/.test(local) && user.email === local + '@' + DOMAIN) { showDriver(user, local); }
            else { loginNotice = 'That account is not set up for this app.'; signOut(auth); }
        });
    }

    // Plain-English explanations for the Firebase errors people actually hit.
    function explainAuthError(e, who) {
        const c = (e && e.code) || '';
        if (c === 'auth/operation-not-allowed' || c === 'auth/admin-restricted-operation')
            return 'Logins are switched off in Firebase. In the Firebase console go to Authentication → Sign-in method and turn on "Email/Password", then try again.';
        if (c === 'auth/invalid-credential' || c === 'auth/wrong-password' || c === 'auth/user-not-found' || c === 'auth/invalid-login-credentials')
            return who === 'admin' ? 'Wrong admin password.' : `Wrong PIN, or ${who} hasn't been added yet. The admin adds trucks in the Dispatch Console under "Manage trucks".`;
        if (c === 'auth/too-many-requests') return 'Too many tries. Wait a few minutes and try again.';
        if (c === 'auth/network-request-failed') return 'No internet connection. Check your signal and try again.';
        if (c === 'auth/weak-password') return 'Password must be at least 6 characters.';
        if (c === 'auth/unauthorized-domain' || c === 'auth/requests-from-referer-are-blocked' || c === 'auth/api-key-not-valid')
            return 'Firebase is blocking this website. In the Firebase console go to Authentication → Settings → Authorized domains and add ' + location.hostname + '.';
        if (c === 'auth/configuration-not-found')
            return 'Firebase Authentication isn\'t set up yet. In the Firebase console open Authentication, click "Get started", then turn on Email/Password.';
        return 'Something went wrong (' + (c || (e && e.message) || 'unknown') + ').';
    }

    async function showLogin() {
        mount('tpl-login');
        const $ = (id) => document.getElementById(id);
        const errEl = $('login-err');
        errEl.textContent = loginNotice; loginNotice = '';

        // Is there an admin yet? (one tiny public document holds the admin's chosen username)
        let adminName = null, rulesProblem = false, timedOut = false;
        try {
            const snap = await Promise.race([
                getDoc(doc(db, 'setup', 'admin')),
                new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), 8000))
            ]);
            adminName = snap.exists() ? String(snap.data().username || '') : null;
        } catch (e) {
            if (e && (e.code === 'timeout' || e.code === 'unavailable')) timedOut = true; else rulesProblem = true;
        }
        if (!$('login-checking')) return; // page changed while we were checking
        $('login-checking').style.display = 'none';

        if (timedOut) {
            // Never leave people stuck: let them sign in anyway, retry, or open setup by hand.
            $('signin-box').style.display = '';
            errEl.innerHTML = 'Can\'t reach the database from this device right now (weak signal, data saver, or an ad blocker). '
                + 'You can still try to sign in. <br><button class="link-btn" id="retry-btn">Try again</button> · '
                + '<button class="link-btn" id="show-setup">First-time admin setup</button>';
            $('retry-btn').onclick = () => showLogin();
            $('show-setup').onclick = () => { $('signin-box').style.display = 'none'; $('setup-box').style.display = ''; };
        } else if (rulesProblem) {
            $('signin-box').style.display = '';
            errEl.textContent = 'The database rules haven\'t been published yet. In the Firebase console go to Firestore Database → Rules, paste in firestore.rules, and click Publish.';
        } else if (!adminName) {
            $('setup-box').style.display = '';
        } else {
            $('signin-box').style.display = '';
        }

        // ----- first-time admin setup -----
        $('setup-btn').onclick = async () => {
            const sErr = $('setup-err'); sErr.textContent = '';
            const name = $('setup-user').value.trim();
            const p1 = $('setup-pass').value, p2 = $('setup-pass2').value;
            if (!/^[A-Za-z][A-Za-z0-9 ._-]{1,29}$/.test(name)) { sErr.textContent = 'Username: 2–30 characters, starting with a letter.'; return; }
            if (loginIdFrom(name)) { sErr.textContent = 'Pick a username that isn\'t a truck number.'; return; }
            if (p1.length < 6) { sErr.textContent = 'Password must be at least 6 characters.'; return; }
            if (p1 !== p2) { sErr.textContent = 'The two passwords don\'t match.'; return; }
            $('setup-btn').disabled = true;
            try {
                try {
                    await createUserWithEmailAndPassword(auth, ADMIN_EMAIL, p1);
                } catch (e) {
                    // An admin account may already exist from an earlier attempt: if the password matches, carry on.
                    if (e.code === 'auth/email-already-in-use') await signInWithEmailAndPassword(auth, ADMIN_EMAIL, p1);
                    else throw e;
                }
                await setDoc(doc(db, 'setup', 'admin'), { username: name });
                const who = document.getElementById('admin-who');
                if (who) who.textContent = 'Signed in as ' + name + ' (admin)';
            } catch (e) {
                $('setup-btn').disabled = false;
                sErr.textContent = (e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/invalid-login-credentials')
                    ? 'An admin login already exists with a different password. Delete the user "admin@dispatch.local" in Firebase console → Authentication → Users, then try again.'
                    : (e.code === 'permission-denied'
                        ? 'The database rules haven\'t been published yet (Firestore Database → Rules → paste firestore.rules → Publish).'
                        : explainAuthError(e, 'admin'));
            }
        };

        // ----- Driver / Admin switch (Driver is the default) -----
        const roleSel = $('login-role');
        const applyRole = () => {
            const admin = roleSel.value === 'admin';
            $('login-id-label').textContent = admin ? 'Admin username' : 'Truck number';
            $('login-id').placeholder = admin ? (adminName ? '' : 'Your admin username') : 'e.g., 2';
            $('login-id').inputMode = admin ? 'text' : 'numeric';
            $('login-pass-label').textContent = admin ? 'Password' : 'PIN';
            $('login-pass').placeholder = admin ? 'Your password' : 'Your PIN';
            $('login-id').value = ''; $('login-pass').value = '';
        };
        // Switching role clears old sign-in errors, but keeps the "can't reach database / Try again" notice.
        roleSel.onchange = () => { if (!$('retry-btn')) errEl.textContent = ''; applyRole(); };
        applyRole();

        // ----- normal sign in -----
        const go = async () => {
            errEl.textContent = '';
            const typed = $('login-id').value.trim();
            const pin = $('login-pass').value;
            let email, who;
            if (roleSel.value === 'admin') {
                if (!typed) { errEl.textContent = 'Enter your admin username.'; return; }
                // If we know the username, check it; if the lookup failed (bad signal), the password still protects the account.
                if (adminName && typed.toLowerCase() !== adminName.toLowerCase() && typed.toLowerCase() !== 'admin') { errEl.textContent = 'That isn\'t the admin username.'; return; }
                email = ADMIN_EMAIL; who = 'admin';
            } else {
                const truck = loginIdFrom(typed);
                if (!truck || truck === 'admin') { errEl.textContent = typed ? `"${typed}" isn't a truck number. Enter just the number, like 2. (Admin? Change "Signing in as" to Admin.)` : 'Enter your truck number, like 2.'; return; }
                email = truck + '@' + DOMAIN; who = truckName(truck);
            }
            if (!pin) { errEl.textContent = roleSel.value === 'admin' ? 'Enter your password.' : 'Enter your PIN.'; return; }
            $('login-btn').disabled = true;
            try { await signInWithEmailAndPassword(auth, email, pin); }
            catch (e) { errEl.textContent = explainAuthError(e, who); $('login-btn').disabled = false; }
        };
        $('login-btn').onclick = go;
        $('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
        $('setup-pass2').addEventListener('keydown', e => { if (e.key === 'Enter') $('setup-btn').click(); });
    }

    // ---------- DRIVER ----------
    function showDriver(user, truckId) {
        mount('tpl-driver');
        const $ = (id) => document.getElementById(id);
        $('driver-title').textContent = truckName(truckId);
        $('driver-who').textContent = 'Signed in as ' + truckName(truckId);

        const nameInput = $('driver-name');
        try { nameInput.value = localStorage.getItem('driverName_' + truckId) || ''; } catch (e) {}
        nameInput.onchange = () => { try { localStorage.setItem('driverName_' + truckId, nameInput.value.trim()); } catch (e) {} };

        const STOP_RADIUS_M = 75, STOP_MIN_MS = 120000;
        let config = { ...DEFAULT_CONFIG };
        let tracking = false, watchId = null, lastSend = 0, anchor = null, wakeLock = null;
        let lastSentParked = null, shiftToken = 0, stoppedByDispatch = false;
        const statusEl = $('driver-status'), stopLine = $('stop-line'), btn = $('gps-btn');
        const stopTokenOf = (c) => Number((c.stopRequests || {})[truckId] || 0);

        function applyConfig() {
            $('sales-card').style.display = config.sales ? '' : 'none';
            $('items-wrap').style.display = config.items ? '' : 'none';
            stopLine.style.display = config.stops ? '' : 'none';
        }
        applyConfig();
        const unsubConfig = onSnapshot(doc(db, 'config', 'metrics'), async (snap) => {
            config = { ...DEFAULT_CONFIG, ...(snap.exists() ? snap.data() : {}) };
            applyConfig();
            // Dispatch pressed "Stop" for this truck since this shift started -> stop sharing.
            if (tracking && stopTokenOf(config) !== shiftToken) {
                stoppedByDispatch = true;
                await stopTracking();
                statusEl.textContent = 'Dispatch stopped your location sharing. Tap Start Shift to share again.';
            }
        }, () => {});

        // ----- sales -----
        // Each sale is saved as its own record (for the CSV), and also added to ONE small running-total
        // document per truck per day. Screens only ever listen to the running totals, which keeps reads tiny.
        let summary = {};
        let summaryUnsub = () => {};
        let summaryDay = null;
        function watchSummary() {
            const d = dayStr();
            if (d === summaryDay) return;
            summaryUnsub();
            summaryDay = d;
            summaryUnsub = onSnapshot(doc(db, 'daily', d + '_' + truckId), (snap) => {
                summary = snap.exists() ? snap.data() : {};
                renderSales();
            }, () => {});
        }
        watchSummary();

        const recentKey = () => 'recentSales_' + truckId + '_' + dayStr();
        function loadRecent() { try { return JSON.parse(localStorage.getItem(recentKey()) || '[]'); } catch (e) { return []; } }
        function saveRecent(list) { try { localStorage.setItem(recentKey(), JSON.stringify(list.slice(0, 5))); } catch (e) {} }
        let recent = loadRecent();

        function renderSales() {
            const total = summary.sales || 0, items = summary.items || 0;
            $('sales-total').textContent = `Today: ${money(total)}` + (config.items ? ` · ${items} item${items === 1 ? '' : 's'}` : '');
            const listEl = $('sales-list');
            listEl.innerHTML = '';
            recent.forEach(s => {
                const row = document.createElement('div');
                row.className = 'card';
                row.innerHTML = `<div>${money(s.amount)}${config.items ? ' · ' + (s.items || 0) + ' item(s)' : ''}<br><small class="muted">${fmtTime(s.t)}</small></div>`;
                const rm = document.createElement('button');
                rm.className = 'link-btn'; rm.textContent = 'Remove';
                rm.onclick = async () => {
                    if (!confirm('Remove this sale?')) return;
                    try {
                        await deleteDoc(doc(db, 'sales', s.id));
                        await bumpDaily(s.day || dayStr(), { sales: -s.amount, items: -(s.items || 0), saleCount: -1 });
                        recent = recent.filter(x => x.id !== s.id); saveRecent(recent); renderSales();
                    } catch (e) { alert('Could not remove that sale. Check your connection.'); }
                };
                row.appendChild(rm);
                listEl.appendChild(row);
            });
        }

        function bumpDaily(day, delta) {
            const data = { truckId, day };
            Object.keys(delta).forEach(k => { data[k] = increment(delta[k]); });
            return setDoc(doc(db, 'daily', day + '_' + truckId), data, { merge: true });
        }

        $('sale-btn').onclick = async () => {
            const amount = Math.round(parseFloat($('sale-amount').value) * 100) / 100;
            if (!isFinite(amount) || amount < 0 || amount > 100000) { alert('Enter the sale amount.'); return; }
            const items = config.items ? Math.max(0, parseInt($('sale-items').value || '0', 10) || 0) : 0;
            const day = dayStr();
            watchSummary();
            try {
                const ref = await addDoc(collection(db, 'sales'), { truckId, amount, items, day, createdAt: serverTimestamp() });
                await bumpDaily(day, { sales: amount, items, saleCount: 1 });
                recent = loadRecent();
                recent.unshift({ id: ref.id, amount, items, day, t: Date.now() });
                saveRecent(recent); recent = recent.slice(0, 5);
                $('sale-amount').value = ''; $('sale-items').value = '';
                renderSales();
            } catch (e) { alert('Could not save that sale. Check your connection.'); }
        };

        // ----- stop detection -----
        function trackStop(lat, lng, now, acc) {
            if (acc > 100) return;
            if (!anchor) { anchor = { lat, lng, since: now }; return; }
            if (distMeters(anchor.lat, anchor.lng, lat, lng) > STOP_RADIUS_M) {
                finalizeStop(now);
                anchor = { lat, lng, since: now };
            }
        }
        async function finalizeStop(endMs) {
            if (!config.stops || !anchor || endMs - anchor.since < STOP_MIN_MS) return;
            const durationSec = Math.round((endMs - anchor.since) / 1000);
            const day = dayStr(anchor.since);
            try {
                await addDoc(collection(db, 'stops'), {
                    truckId, lat: anchor.lat, lng: anchor.lng,
                    startedAt: anchor.since, endedAt: endMs, durationSec, day
                });
                await bumpDaily(day, { stopCount: 1, stopSec: durationSec });
            } catch (e) {}
        }
        const stopSinceNow = (now) => (config.stops && anchor && now - anchor.since >= STOP_MIN_MS) ? anchor.since : null;

        // ----- keep screen awake while tracking -----
        async function lockScreen() { try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
        const onVis = () => { if (document.visibilityState === 'visible' && tracking) lockScreen(); };
        document.addEventListener('visibilitychange', onVis);

        async function stopTracking() {
            if (!tracking) return;
            tracking = false;
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            watchId = null;
            try { if (wakeLock) await wakeLock.release(); } catch (e) {}
            wakeLock = null;
            await finalizeStop(Date.now());
            anchor = null;
            btn.textContent = 'Start Shift (share location)';
            btn.style.background = '';
            statusEl.textContent = 'Status: Offline';
            stopLine.textContent = '';
            nameInput.disabled = false;
            try { await deleteDoc(doc(db, 'active_fleet', truckId)); } catch (e) {}
        }

        btn.onclick = async () => {
            if (tracking) { stopTracking(); return; }
            if (!('geolocation' in navigator)) { alert('Geolocation is not supported by your browser.'); return; }
            // A truck that dispatch deleted can't start sharing again.
            btn.disabled = true;
            try {
                const reg = await getDoc(doc(db, 'trucks', truckId));
                if (!reg.exists()) { statusEl.textContent = 'This truck has been removed by dispatch. Ask the admin to add it again.'; btn.disabled = false; return; }
            } catch (e) { /* offline: let them start; the location will sync when signal returns */ }
            btn.disabled = false;
            if (tracking) return;
            tracking = true; anchor = null; lastSend = 0; lastSentParked = null;
            shiftToken = stopTokenOf(config); stoppedByDispatch = false;
            nameInput.disabled = true;
            btn.textContent = 'End Shift (stop sharing)';
            btn.style.background = '#dc2626';
            statusEl.textContent = 'Connecting to GPS...';
            lockScreen();

            watchId = navigator.geolocation.watchPosition(async (pos) => {
                const now = Date.now();
                const { latitude: lat, longitude: lng } = pos.coords;
                const acc = Math.round(pos.coords.accuracy);
                if (acc > 150) { statusEl.textContent = `Acquiring GPS lock... (+/- ${acc}m)`; return; }

                trackStop(lat, lng, now, acc);
                const since = stopSinceNow(now);
                statusEl.textContent = `Sharing location (+/- ${acc}m)`;
                stopLine.textContent = since ? `At this stop for ${fmtDur(now - since)}` : 'Moving';

                // Ping timing: 30s while moving, 90s while parked, and right away when arriving/leaving a stop.
                const parked = !!(anchor && now - anchor.since >= STOP_MIN_MS);
                const every = parked ? PARKED_MS : MOVING_MS;
                if (tracking && !stoppedByDispatch && (now - lastSend >= every || parked !== lastSentParked)) {
                    lastSend = now; lastSentParked = parked;
                    try {
                        await setDoc(doc(db, 'active_fleet', truckId), {
                            lat, lng, accuracy: acc, truckId,
                            driverName: nameInput.value.trim().slice(0, 40),
                            stopSince: since,
                            lastUpdated: serverTimestamp()
                        });
                    } catch (e) { statusEl.textContent = 'Could not send location. Check your connection.'; }
                }
            }, (err) => {
                statusEl.textContent = 'GPS Error: ' + err.message;
            }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
        };

        $('driver-logout').onclick = async () => { await stopTracking(); await signOut(auth); };

        cleanup = () => {
            stopTracking();
            unsubConfig(); summaryUnsub();
            document.removeEventListener('visibilitychange', onVis);
        };
    }

    // ---------- ADMIN ----------
    function loadLeaflet() {
        if (window.L) return Promise.resolve();
        return new Promise((resolve, reject) => {
            const css = document.createElement('link');
            css.rel = 'stylesheet';
            css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
            document.head.appendChild(css);
            const js = document.createElement('script');
            js.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
            js.onload = resolve; js.onerror = reject;
            document.head.appendChild(js);
        });
    }

    async function showAdmin(user) {
        mount('tpl-admin');
        const $ = (id) => document.getElementById(id);
        $('admin-who').textContent = 'Signed in as admin';
        getDoc(doc(db, 'setup', 'admin')).then(s => { if (s.exists() && $('admin-who')) $('admin-who').textContent = 'Signed in as ' + s.data().username + ' (admin)'; }).catch(() => {});
        $('link-customer').textContent = baseUrl;
        $('link-staff').textContent = baseUrl + '#staff';
        $('admin-logout').onclick = () => signOut(auth);
        const errEl = $('admin-err');

        try { await loadLeaflet(); } catch (e) { errEl.textContent = 'Could not load the map library.'; return; }

        const today = dayStr();
        const map = L.map('admin-map').setView([39.5, -98.35], 4);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
        setTimeout(() => map.invalidateSize(), 300);

        let trucks = {}, fleet = {}, daily = {}, recentStops = [], config = { ...DEFAULT_CONFIG };
        const sumOf = (key) => Object.values(daily).reduce((a, d) => a + (d[key] || 0), 0);
        const markers = {};
        let fitted = false;

        function denied() {
            errEl.textContent = 'Could not read data. Make sure the Firestore rules are published and you signed in as admin.';
        }

        const sortedTruckIds = () => Object.keys(trucks).sort((a, b) => {
            const ca = (trucks[a].city || '').toLowerCase(), cb = (trucks[b].city || '').toLowerCase();
            return ca === cb ? byTruckNum(a, b) : (ca < cb ? -1 : 1);
        });
        // Live locations that don't belong to any truck in your list (e.g. left over from the original app)
        const orphanIds = () => Object.keys(fleet).filter(id => !trucks[id]).sort(byTruckNum);

        function statusOf(id) {
            const f = fleet[id];
            if (!f) return { label: 'Offline', cls: 'off', age: null };
            const age = f.lastUpdated && f.lastUpdated.toMillis ? Date.now() - f.lastUpdated.toMillis() : 0;
            return age > STALE_MS ? { label: 'Stale', cls: 'stale', age } : { label: 'Online', cls: 'on', age };
        }

        function renderStats() {
            const ids = Object.keys(trucks);
            const online = ids.filter(id => statusOf(id).cls === 'on').length;
            const total = sumOf('sales'), items = sumOf('items');
            const stopCount = sumOf('stopCount'), stopMs = sumOf('stopSec') * 1000;
            let html = `<div class="stat"><b>${online} / ${ids.length}</b><span>Trucks online</span></div>`;
            if (config.sales) html += `<div class="stat"><b>${money(total)}</b><span>Sales today</span></div>`;
            if (config.sales && config.items) html += `<div class="stat"><b>${items}</b><span>Items sold today</span></div>`;
            if (config.stops) html += `<div class="stat"><b>${stopCount}</b><span>Stops today</span></div>`
                + `<div class="stat"><b>${stopCount ? fmtDur(stopMs / stopCount) : '—'}</b><span>Avg time at stop</span></div>`;
            $('admin-stats').innerHTML = html;
        }

        function liveCoords(filterCity) {
            return Object.keys(fleet)
                .filter(id => !filterCity || (trucks[id] && (trucks[id].city || '') === filterCity))
                .filter(id => typeof fleet[id].lat === 'number' && typeof fleet[id].lng === 'number')
                .map(id => [fleet[id].lat, fleet[id].lng]);
        }
        function fitTo(city) {
            const pts = liveCoords(city);
            if (!pts.length) { errEl.textContent = 'No trucks are sharing their location' + (city ? ' in ' + city : '') + ' right now.'; return; }
            errEl.textContent = '';
            if (pts.length === 1) map.setView(pts[0], 14); else map.fitBounds(pts, { padding: [50, 50], maxZoom: 15 });
        }

        function renderChips() {
            const cities = [...new Set(Object.values(trucks).map(t => t.city).filter(Boolean))].sort();
            const el = $('admin-chips');
            el.innerHTML = '';
            const make = (label, city) => {
                const b = document.createElement('button');
                b.className = 'chip'; b.textContent = label; b.onclick = () => fitTo(city);
                el.appendChild(b);
            };
            make('🌎 All trucks', null);
            cities.forEach(c => make('📍 ' + c, c));
        }

        function renderMarkers() {
            Object.keys(markers).forEach(id => { if (!fleet[id]) { map.removeLayer(markers[id]); delete markers[id]; } });
            Object.keys(fleet).forEach(id => {
                const f = fleet[id];
                if (typeof f.lat !== 'number' || typeof f.lng !== 'number') return;
                const coords = [f.lat, f.lng];
                if (markers[id]) markers[id].setLatLng(coords); else markers[id] = L.marker(coords).addTo(map);
                const pop = document.createElement('div');
                pop.innerHTML = `<b>🚚 ${esc(truckName(id))}</b>${f.driverName ? '<br>' + esc(f.driverName) : ''}<br>${esc(trucks[id] ? (trucks[id].city || '') : 'Not in your truck list')}`
                    + `<br><small>${esc(statusOf(id).label)}</small><br>`;
                const b = document.createElement('button');
                b.className = 'pop-stop'; b.textContent = trucks[id] ? 'Stop sharing' : 'Delete';
                b.onclick = () => { map.closePopup(); trucks[id] ? stopTruck(id) : deleteTruck(id); };
                pop.appendChild(b);
                if (trucks[id]) {
                    const d = document.createElement('button');
                    d.className = 'pop-stop'; d.textContent = 'Delete truck'; d.style.marginLeft = '6px'; d.style.background = '#7f1d1d';
                    d.onclick = () => { map.closePopup(); deleteTruck(id); };
                    pop.appendChild(d);
                }
                const wasOpen = markers[id].isPopupOpen && markers[id].isPopupOpen();
                markers[id].bindPopup(pop);
                if (wasOpen) markers[id].openPopup();
            });
            if (!fitted) { const pts = liveCoords(null); if (pts.length) { fitTo(null); fitted = true; } }
        }

        function renderTrucks() {
            const listEl = $('admin-trucks-list');
            const ids = sortedTruckIds();
            const orphans = orphanIds();
            listEl.innerHTML = (!ids.length && !orphans.length) ? '<em>No trucks yet. Open "Manage trucks" below to add your first one.</em>' : '';

            // Leftover / unregistered live locations, each with a Delete button
            if (orphans.length) {
                const h = document.createElement('div');
                h.className = 'city-head'; h.style.color = '#b91c1c';
                h.textContent = 'Not in your truck list (left over from the old app)';
                listEl.appendChild(h);
                orphans.forEach(id => {
                    const f = fleet[id], st = statusOf(id);
                    const card = document.createElement('div');
                    card.className = 'tcard';
                    card.innerHTML = `<div class="row"><div><strong>🚚 ${esc(truckName(id))}</strong>${f.driverName ? ' — ' + esc(f.driverName) : ''}
                        ${st.age !== null ? `<br><small class="muted">Updated ${fmtAge(st.age)}</small>` : ''}</div>
                        <span class="badge ${st.cls}">${st.label}</span></div>`;
                    const del = document.createElement('button');
                    del.className = 'link-btn stop-link'; del.textContent = 'Delete'; del.style.marginTop = '6px';
                    del.onclick = (ev) => { ev.stopPropagation(); deleteTruck(id); };
                    card.appendChild(del);
                    listEl.appendChild(card);
                });
            }
            let lastCity = null;
            ids.forEach(id => {
                const t = trucks[id], f = fleet[id], st = statusOf(id);
                if ((t.city || '') !== lastCity) {
                    lastCity = t.city || '';
                    const h = document.createElement('div');
                    h.className = 'city-head'; h.textContent = lastCity || 'No city';
                    listEl.appendChild(h);
                }
                const dd = daily[id] || {};
                const amt = dd.sales || 0, its = dd.items || 0;
                const nStops = dd.stopCount || 0, stopMs = (dd.stopSec || 0) * 1000;

                let metrics = '';
                if (st.cls !== 'off' && f && config.stops) {
                    metrics += f.stopSince ? `<span>⏱ At stop ${fmtDur(Date.now() - f.stopSince)}</span>` : '<span>🚚 Moving</span>';
                }
                if (config.sales) metrics += `<span>💵 ${money(amt)}</span>`;
                if (config.sales && config.items) metrics += `<span>🍦 ${its} items</span>`;
                if (config.stops) metrics += `<span>📍 ${nStops} stops${nStops ? ' · avg ' + fmtDur(stopMs / nStops) : ''}</span>`;

                const card = document.createElement('div');
                card.className = 'tcard';
                card.innerHTML = `
                    <div class="row">
                        <div><strong>🚚 ${esc(truckName(id))}</strong>${f && f.driverName ? ' — ' + esc(f.driverName) : ''}
                            ${st.age !== null ? `<br><small class="muted">Updated ${fmtAge(st.age)}</small>` : ''}</div>
                        <span class="badge ${st.cls}">${st.label}</span>
                    </div>
                    <div class="metrics">${metrics}</div>`;
                const actions = document.createElement('div');
                actions.style.cssText = 'margin-top:6px; display:flex; gap:16px;';
                if (f) {
                    const sb = document.createElement('button');
                    sb.className = 'link-btn'; sb.textContent = 'Stop sharing'; sb.style.color = '#c2410c';
                    sb.onclick = (ev) => { ev.stopPropagation(); stopTruck(id); };
                    actions.appendChild(sb);
                }
                const db_ = document.createElement('button');
                db_.className = 'link-btn stop-link'; db_.textContent = 'Delete truck';
                db_.onclick = (ev) => { ev.stopPropagation(); deleteTruck(id); };
                actions.appendChild(db_);
                card.appendChild(actions);
                card.onclick = () => {
                    if (f && typeof f.lat === 'number') { map.setView([f.lat, f.lng], 15); if (markers[id]) markers[id].openPopup(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
                };
                listEl.appendChild(card);
            });
        }

        function renderStops() {
            const el = $('admin-stops-list');
            if (!config.stops) { el.innerHTML = '<em>Stop tracking is turned off.</em>'; return; }
            const todays = recentStops.filter(s => s.day === today);
            if (!todays.length) { el.innerHTML = '<em>No completed stops yet today. A stop is 2+ minutes in one place.</em>'; return; }
            const rows = todays.map(s => `
                <tr><td>${esc(truckName(s.truckId))}</td><td>${fmtDur(s.durationSec * 1000)}</td>
                <td>${fmtTime(s.startedAt)} – ${fmtTime(s.endedAt)}</td></tr>`).join('');
            el.innerHTML = `<table class="tbl"><tr><th>Truck</th><th>Time at stop</th><th>When</th></tr>${rows}</table>`;
        }

        function renderManage() {
            const el = $('admin-manage-list');
            const ids = sortedTruckIds();
            el.innerHTML = ids.length ? '' : '<em>No trucks yet.</em>';
            ids.forEach(id => {
                const row = document.createElement('div');
                row.className = 'card';
                row.innerHTML = `<div><strong>${esc(truckName(id))}</strong> <span class="muted">· ${esc(trucks[id].city || 'no city')}</span></div>`;
                const rm = document.createElement('button');
                rm.className = 'link-btn stop-link'; rm.textContent = 'Delete truck';
                rm.onclick = () => deleteTruck(id);
                row.appendChild(rm);
                el.appendChild(row);
            });
        }

        function renderSettings() {
            $('cfg-stops').checked = !!config.stops;
            $('cfg-sales').checked = !!config.sales;
            $('cfg-items').checked = !!config.items;
            $('cfg-items').disabled = !config.sales;
        }

        function renderAll() { renderStats(); renderChips(); renderMarkers(); renderStopSelect(); renderTrucks(); renderStops(); renderManage(); renderSettings(); }

        // ----- settings controls -----
        async function saveConfig(patch) {
            try { await setDoc(doc(db, 'config', 'metrics'), patch, { merge: true }); }
            catch (e) { errEl.textContent = 'Could not save settings.'; }
        }
        $('cfg-stops').onchange = (e) => saveConfig({ stops: e.target.checked });
        $('cfg-sales').onchange = (e) => saveConfig({ sales: e.target.checked });
        $('cfg-items').onchange = (e) => saveConfig({ items: e.target.checked });

        // ----- stop a truck's location sharing -----
        // Removes it from the map AND tells that driver's phone to stop sending (so it doesn't reappear).
        async function stopTruck(id) {
            if (!confirm(`Stop location sharing for ${truckName(id)}? The driver's phone will stop sending its location until they tap Start Shift again.`)) return;
            try {
                await setDoc(doc(db, 'config', 'metrics'), { stopRequests: { [id]: increment(1) } }, { merge: true });
                await deleteDoc(doc(db, 'active_fleet', id));
                errEl.textContent = '';
            } catch (e) { errEl.textContent = 'Could not stop ' + truckName(id) + '. Check your connection.'; }
        }
        // Delete: takes the truck off the map, tells its phone to stop, and removes it from your truck list.
        async function deleteTruck(id) {
            const registered = !!trucks[id];
            const msg = registered
                ? `Delete ${truckName(id)}? It will disappear from the map and your truck list, and its phone will stop sharing. (Its sales history is kept.)`
                : `Delete ${truckName(id)} from the map?`;
            if (!confirm(msg)) return;
            try {
                await setDoc(doc(db, 'config', 'metrics'), { stopRequests: { [id]: increment(1) } }, { merge: true });
                if (fleet[id]) await deleteDoc(doc(db, 'active_fleet', id));
                if (registered) await deleteDoc(doc(db, 'trucks', id));
                errEl.textContent = '';
            } catch (e) { errEl.textContent = 'Could not delete ' + truckName(id) + '. Check your connection.'; }
        }
        async function clearAll() {
            const ids = Object.keys(fleet);
            if (!ids.length) { errEl.textContent = 'There are no trucks on the map.'; return; }
            if (!confirm(`Take all ${ids.length} truck${ids.length === 1 ? '' : 's'} off the map and stop their location sharing? (Your truck list is kept.)`)) return;
            try {
                const patch = {}; ids.forEach(id => { patch[id] = increment(1); });
                await setDoc(doc(db, 'config', 'metrics'), { stopRequests: patch }, { merge: true });
                await Promise.all(ids.map(id => deleteDoc(doc(db, 'active_fleet', id))));
                errEl.textContent = '';
            } catch (e) { errEl.textContent = 'Could not clear the map. Check your connection.'; }
        }
        const pick = () => { const id = $('stop-select').value; if (!id) errEl.textContent = 'Pick a truck first.'; return id; };
        $('stop-btn').onclick = () => { const id = pick(); if (!id) return; fleet[id] ? stopTruck(id) : (errEl.textContent = truckName(id) + ' isn\'t sharing its location right now.'); };
        $('delete-btn').onclick = () => { const id = pick(); if (id) deleteTruck(id); };
        $('clear-all-btn').onclick = clearAll;

        function renderStopSelect() {
            const sel = $('stop-select');
            const prev = sel.value;
            const ids = [...new Set([...Object.keys(fleet), ...Object.keys(trucks)])].sort(byTruckNum);
            sel.innerHTML = ids.length ? '<option value="">-- Choose a truck --</option>' : '<option value="">No trucks</option>';
            ids.forEach(id => {
                const o = document.createElement('option');
                o.value = id;
                const f = fleet[id] || {};
                o.textContent = truckName(id) + (f.driverName ? ' — ' + f.driverName : '') + (trucks[id]?.city ? ' (' + trucks[id].city + ')' : '') + ' · ' + statusOf(id).label;
                sel.appendChild(o);
            });
            if (ids.includes(prev)) sel.value = prev;
            $('stop-btn').disabled = $('delete-btn').disabled = !ids.length;
            $('clear-all-btn').style.display = Object.keys(fleet).length ? '' : 'none';
        }

        // ----- add truck (uses a second Firebase connection so the admin stays signed in) -----
        $('new-btn').onclick = async () => {
            const msg = $('manage-msg');
            msg.style.color = '#dc2626'; msg.textContent = '';
            const num = parseInt($('new-num').value, 10);
            const city = $('new-city').value.trim().slice(0, 40);
            const pin = $('new-pin').value.trim();
            if (!(num >= 1 && num <= 99)) { msg.textContent = 'Enter a truck number from 1 to 99.'; return; }
            if (!city) { msg.textContent = 'Enter the truck\'s city.'; return; }
            if (pin.length < 6) { msg.textContent = 'The PIN needs at least 6 characters.'; return; }
            const id = 'truck' + num;
            let note = '';
            try {
                const secApp = initializeApp(firebaseConfig, 'secondary-' + Date.now());
                const secAuth = getAuth(secApp);
                try {
                    await createUserWithEmailAndPassword(secAuth, id + '@' + DOMAIN, pin);
                } catch (e) {
                    if (e.code === 'auth/email-already-in-use') note = ' Note: this truck number already had a login, so its PIN was NOT changed — the old PIN still works. To set a new PIN, delete "' + id + '@' + DOMAIN + '" in Firebase console → Authentication → Users, then add the truck again.';
                    else throw e;
                }
                try { await signOut(secAuth); } catch (e) {}
                await setDoc(doc(db, 'trucks', id), { city, createdAt: serverTimestamp() });
                msg.style.color = '#16a34a';
                msg.textContent = `${truckName(id)} added.` + note;
                $('new-num').value = ''; $('new-pin').value = '';
            } catch (e) {
                msg.textContent = e.code === 'permission-denied'
                    ? 'The login was created, but the database rules blocked saving the truck. Publish firestore.rules, then add it again with the same PIN.'
                    : explainAuthError(e, 'that truck');
            }
        };

        // ----- CSV export -----
        // Full detail is only downloaded when you click the button, so it costs nothing the rest of the day.
        $('csv-btn').onclick = async () => {
            const q = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
            let sales = [], stops = [];
            try {
                const [s1, s2] = await Promise.all([
                    getDocs(query(collection(db, 'sales'), where('day', '==', today))),
                    getDocs(query(collection(db, 'stops'), where('day', '==', today)))
                ]);
                sales = s1.docs.map(d => d.data()); stops = s2.docs.map(d => d.data());
            } catch (e) { errEl.textContent = 'Could not download today\'s data.'; return; }
            const rows = [['type', 'truck', 'city', 'start', 'end', 'minutes', 'amount', 'items', 'lat', 'lng']];
            sales.forEach(s => {
                const t = s.createdAt && s.createdAt.toMillis ? s.createdAt.toMillis() : '';
                rows.push(['sale', truckName(s.truckId), trucks[s.truckId]?.city || '', t ? new Date(t).toLocaleString() : '', '', '', s.amount, s.items, '', '']);
            });
            stops.forEach(s => rows.push(['stop', truckName(s.truckId), trucks[s.truckId]?.city || '', new Date(s.startedAt).toLocaleString(), new Date(s.endedAt).toLocaleString(), (s.durationSec / 60).toFixed(1), '', '', s.lat, s.lng]));
            const csv = rows.map(r => r.map(q).join(',')).join('\n');
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
            a.download = `fleet-${today}.csv`;
            a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        };

        // ----- live data -----
        // Listeners only run while this page is on screen. Every live update costs a "read", so a
        // forgotten tab in the background would otherwise burn through the free daily allowance.
        let unsubs = [];
        let hiddenTimer = null;
        function attach() {
            if (unsubs.length) return;
            unsubs.push(onSnapshot(collection(db, 'trucks'), (snap) => {
                trucks = {}; snap.forEach(d => { trucks[d.id] = d.data(); }); renderAll();
            }, denied));
            unsubs.push(onSnapshot(collection(db, 'active_fleet'), (snap) => {
                fleet = {}; snap.forEach(d => { fleet[d.id] = d.data(); }); renderAll();
            }, denied));
            unsubs.push(onSnapshot(query(collection(db, 'daily'), where('day', '==', today)), (snap) => {
                daily = {}; snap.forEach(d => { const v = d.data(); daily[v.truckId] = v; });
                renderStats(); renderTrucks();
            }, denied));
            unsubs.push(onSnapshot(query(collection(db, 'stops'), orderBy('endedAt', 'desc'), limit(12)), (snap) => {
                recentStops = snap.docs.map(d => d.data()); renderStops();
            }, denied));
            unsubs.push(onSnapshot(doc(db, 'config', 'metrics'), (snap) => {
                config = { ...DEFAULT_CONFIG, ...(snap.exists() ? snap.data() : {}) }; renderAll();
            }, denied));
            unsubs.push(onSnapshot(query(collection(db, 'customer_requests'), orderBy('createdAt', 'desc'), limit(10)), (snap) => {
            const listEl = $('admin-pings-list');
            listEl.innerHTML = '';
            if (snap.empty) { listEl.innerHTML = '<em>No active requests at the moment.</em>'; return; }
            snap.forEach(docSnap => {
                const d = docSnap.data();
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <strong>Party of ${esc(d.partySize)}</strong> — Target: ${esc(d.requestedTime)}<br>
                        <small class="muted">Notes: ${esc(d.notes)}</small>
                    </div>
                    <span class="badge">${esc(d.status)}</span>`;
                listEl.appendChild(card);
            });
            }, denied));
        }
        function detach() { unsubs.forEach(u => u()); unsubs = []; }

        // Pause after 1 minute hidden (so quickly switching apps doesn't cost a full reload); resume on return.
        const onVis = () => {
            clearTimeout(hiddenTimer);
            if (document.visibilityState === 'hidden') hiddenTimer = setTimeout(detach, 60000);
            else attach();
        };
        document.addEventListener('visibilitychange', onVis);
        attach();

        // refresh "updated 40s ago" / stale labels, and roll over at midnight
        const timer = setInterval(() => {
            if (dayStr() !== today) { location.reload(); return; }
            renderStats(); renderTrucks();
        }, 30000);

        cleanup = () => {
            detach(); clearTimeout(hiddenTimer); clearInterval(timer);
            document.removeEventListener('visibilitychange', onVis);
            map.remove();
        };
    }
</script>
</body>
</html>
