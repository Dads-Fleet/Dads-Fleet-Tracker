"translate(60 0) scale(1 1) translate(-60 0)\"><path class=\"sl-a\" d=\"M22,70 C20,52 34,44 44,44 C46,32 58,26 68,30 C80,30 90,40 88,48 C98,50 102,62 98,70 Z\"/><path class=\"sl-b\" d=\"M30,64 C40,54 70,52 92,62 M38,52 C50,44 70,44 84,50 M50,40 C56,35 66,35 72,39\" fill=\"none\" stroke-width=\"6\" stroke-linecap=\"round\"/></g><g clip-path=\"url(#cpC)\"><rect x=\"0\" y=\"60\" width=\"120\" height=\"110\" fill=\"#fff\"/><path d=\"M0,74 H120 M0,90 H120 M0,106 H120 M0,122 H120 M0,138 H120 M0,154 H120\" stroke=\"#e03131\" stroke-width=\"8\"/><rect x=\"0\" y=\"60\" width=\"54\" height=\"56\" fill=\"#364fc7\"/><g fill=\"#fff\"><circle cx=\"32\" cy=\"74\" r=\"2.4\"/><circle cx=\"44\" cy=\"74\" r=\"2.4\"/><circle cx=\"38\" cy=\"84\" r=\"2.4\"/><circle cx=\"32\" cy=\"94\" r=\"2.4\"/><circle cx=\"44\" cy=\"94\" r=\"2.4\"/><circle cx=\"38\" cy=\"104\" r=\"2.4\"/></g></g><path d=\"M23,66 L97,66 L89,156 Q60,165 31,156 Z\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3\"/><rect x=\"18\" y=\"62\" width=\"84\" height=\"8\" rx=\"4\" fill=\"#fff\"/><g transform=\"translate(76 120)\"><circle r=\"20\" fill=\"#fff\" opacity=\".92\"/><g transform=\"translate(0 0) scale(0.8)\"><circle cx=\"-14\" cy=\"6\" r=\"4\" fill=\"#ff8fab\" opacity=\".55\"/><circle cx=\"14\" cy=\"6\" r=\"4\" fill=\"#ff8fab\" opacity=\".55\"/><g class=\"eyes\"><circle cx=\"-8\" cy=\"-2\" r=\"3.4\" fill=\"#3a2318\"/><circle cx=\"8\" cy=\"-2\" r=\"3.4\" fill=\"#3a2318\"/><circle cx=\"-6.8\" cy=\"-3.2\" r=\"1.1\" fill=\"#fff\"/><circle cx=\"9.2\" cy=\"-3.2\" r=\"1.1\" fill=\"#fff\"/></g><path d=\"M-6,5 Q0,11 6,5\" stroke=\"#3a2318\" stroke-width=\"2.6\" fill=\"none\" stroke-linecap=\"round\"/></g></g></svg>","cauldron":"<svg class=\"slush\" viewBox=\"0 0 120 170\"><path d=\"M70,66 L90,16\" stroke=\"#ff4d6d\" stroke-width=\"7\" stroke-linecap=\"round\"/><path d=\"M70,66 L90,16\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-dasharray=\"5 8\" stroke-linecap=\"round\"/><path class=\"sl-a\" d=\"M18,80 C16,60 34,50 46,52 C50,38 70,36 78,46 C94,44 106,60 102,80 Z\"/><path class=\"sl-b\" d=\"M26,74 C40,62 78,60 98,72\" fill=\"none\" stroke-width=\"6\" stroke-linecap=\"round\"/><circle class=\"sl-b\" cx=\"40\" cy=\"40\" r=\"5\" fill=\"none\" stroke-width=\"3\"/><circle class=\"sl-b\" cx=\"84\" cy=\"30\" r=\"4\" fill=\"none\" stroke-width=\"3\"/><path d=\"M34,156 l-8,12 M86,156 l8,12\" stroke=\"#2b2140\" stroke-width=\"7\" stroke-linecap=\"round\"/><path d=\"M48,166 q4,-10 8,0 q4,-10 8,0 q4,-10 8,0\" fill=\"#ff922b\"/><path d=\"M12,84 Q4,158 60,160 Q116,158 108,84 Z\" fill=\"#2b2140\"/><ellipse cx=\"60\" cy=\"82\" rx=\"52\" ry=\"11\" fill=\"#3b2a5a\"/><ellipse cx=\"60\" cy=\"81\" rx=\"45\" ry=\"7\" class=\"sl-a\"/><g transform=\"translate(60 120) scale(1)\"><circle cx=\"-14\" cy=\"6\" r=\"4\" fill=\"#ff8fab\" opacity=\".55\"/><circle cx=\"14\" cy=\"6\" r=\"4\" fill=\"#ff8fab\" opacity=\".55\"/><g class=\"eyes\"><circle cx=\"-8\" cy=\"-2\" r=\"3.4\" fill=\"#fff\"/><circle cx=\"8\" cy=\"-2\" r=\"3.4\" fill=\"#fff\"/><circle cx=\"-6.8\" cy=\"-3.2\" r=\"1.1\" fill=\"#fff\"/><circle cx=\"9.2\" cy=\"-3.2\" r=\"1.1\" fill=\"#fff\"/></g><path d=\"M-6,5 Q0,11 6,5\" stroke=\"#fff\" stroke-width=\"2.6\" fill=\"none\" stroke-linecap=\"round\"/></g></svg>"};
        CUPS.pumpkin = PUMPKIN_SLUSH;
        const CUP_SETS = {
            spring: ['flowerpot', 'classic', 'tall', 'cone'],
            memorial: ['starcup', 'classic', 'tall', 'cone'],
            summer: ['pineapple', 'coconut', 'classic', 'tall', 'cone'],
            july4: ['starcup', 'classic', 'tall', 'cone'],
            fall: ['classic', 'tall', 'cone'],
            halloween: ['pumpkin', 'cauldron', 'classic', 'tall']
        };
        const cupList = CUP_SETS[SEASON] || ['classic', 'tall', 'cone'];
        const oldSlush = document.querySelector('.c-art .slush');
        let cupItems = [], cupIdx = 0;
        if (oldSlush) {
            const bar = document.createElement('div');
            bar.className = 'slush-bar';
            bar.setAttribute('aria-hidden', 'true');
            cupList.forEach((k, i) => {
                const d = document.createElement('div');
                d.className = 'sb-item' + (i === 0 ? ' on' : '');
                let svg = CUPS[k];
                if (k === 'classic' && SEASON !== 'halloween' && SLUSH_DECOR[SEASON]) svg = svg.replace(/<\/svg>$/, SLUSH_DECOR[SEASON] + '</svg>');
                d.innerHTML = svg;
                bar.appendChild(d);
            });
            oldSlush.replaceWith(bar);
            slushArt = bar;
            cupItems = [...bar.querySelectorAll('.sb-item')];
        }
        // Called by the flavor timer, so the cup and the flavor change together.
        function nextCup() {
            if (cupItems.length < 2) return;
            cupItems[cupIdx].classList.remove('on');
            cupIdx = (cupIdx + 1) % cupItems.length;
            cupItems[cupIdx].classList.add('on');
        }
        const seasonalExtra = () => {
            let r = Math.random();
            for (const [name, p] of SEASON_ODDS[SEASON] || []) { if (r < p) return SEASON_ART[name]; r -= p; }
            return '';
        };

        // Falling treats behind the form (kept few and slow so phones barely notice)
        const layer = document.createElement('div');
        layer.className = 'treat-layer';
        layer.setAttribute('aria-hidden', 'true');
        wrap.appendChild(layer);
        // soldKeys: drawings for sold-out items. They still fall, faded, with a sad face and a 'Sold out' tag.
        const startFalling = (keys, soldKeys = []) => {
            layer.innerHTML = '';
            const sold = new Set(soldKeys);
            const pool = keys.flatMap(k => isFeatured(k) ? [k, k, k] : [k]).concat(soldKeys).sort(() => Math.random() - 0.5);
            const order = [...new Set(pool)];
            const seasonBag = (SEASON_EXTRAS[SEASON] || []).slice().sort(() => Math.random() - 0.5);
            let seasonBagIdx = 0;
            if (!order.length) return;
            for (let i = 0; i < 10; i++) {
                const el = document.createElement('div');
                if (SEASON_EXTRAS[SEASON] && ((SEASON === 'spring' || SEASON === 'summer') ? i % 2 === 1 : (i % 5 === 1 || i % 5 === 3))) {
                    const s = SPOOKY_ART[seasonBag[seasonBagIdx++ % seasonBag.length]];
                    el.className = 'treat';
                    el.innerHTML = '<span class="treat-inner"><span class="art">' + s.svg + '</span></span>';
                    el.style.width = Math.round(s.w * 1.5 * (0.9 + Math.random() * 0.3)) + 'px';
                    el.style.left = (Math.random() * 92) + '%';
                    el.style.animationDuration = (20 + Math.random() * 12) + 's';
                    el.style.animationDelay = (-Math.random() * 32) + 's';
                    el.querySelector('.treat-inner').style.animationDuration = (4 + Math.random() * 2) + 's';
                    layer.appendChild(el);
                    continue;
                }
                const key = order[i % order.length];
                const t = TREAT_ART[key];
                const isSold = sold.has(key);
                const mood = isSold ? 'sad' : (SEASON === 'halloween' && Math.random() < .3) ? 'fangs' : MOODS[Math.floor(Math.random() * MOODS.length)];
                el.className = 'treat' + (isSold ? ' sold' : '');
                el.dataset.key = key;
                el.dataset.mood = mood;
                el.innerHTML = '<span class="treat-inner">' + (isSold ? '' : seasonalExtra()) + '<span class="art">' + withFace(key, t.svg, mood, isSold ? '' : seasonalGlasses()) + '</span></span>' + (isSold ? '<span class="sold-tag">Sold out</span>' : '');
                el.style.width = Math.round(t.w * 1.5 * (isFeatured(key) ? 1.15 : 0.9) * (0.9 + Math.random() * 0.3)) + 'px';
                el.style.left = (Math.random() * 92) + '%';
                el.style.animationDuration = (20 + Math.random() * 12) + 's';
                el.style.animationDelay = (-Math.random() * 32) + 's';
                el.querySelector('.treat-inner').style.animationDuration = (4 + Math.random() * 2) + 's';
                layer.appendChild(el);
            }
        };

        // After a request is sent, a little truck drives across the screen.
        const TRUCK_SVG = '<svg viewBox="0 0 124 76"><path d="M58,6 L64,20 L52,20 Z" fill="#e8a954"/><circle cx="58" cy="7" r="6" fill="#ff8fb1"/><circle cx="56" cy="5" r="1.6" fill="#fff" opacity=".6"/><rect x="6" y="20" width="84" height="38" rx="7" fill="#fff" stroke="#ffadc9" stroke-width="2"/><path d="M90,30 H104 Q110,30 113,38 L117,46 V58 H90 Z" fill="#fff" stroke="#ffadc9" stroke-width="2"/><path d="M93,33 H103 Q107,33 109,39 L111,44 H93 Z" fill="#9be7ff"/><rect x="6" y="44" width="111" height="6" fill="#ff6fa5"/><rect x="18" y="26" width="44" height="14" rx="2" fill="#9be7ff"/><path d="M16,26 h48 v3 q-3,4 -6,0 q-3,4 -6,0 q-3,4 -6,0 q-3,4 -6,0 q-3,4 -6,0 q-3,4 -6,0 q-3,4 -6,0 q-3,4 -6,0 Z" fill="#ff6fa5"/><rect x="68" y="26" width="16" height="14" rx="2" fill="#ffe3ef"/><circle cx="76" cy="33" r="4" fill="#ffd43b"/><circle cx="76" cy="33" r="1.6" fill="#ff6fa5"/><circle cx="112" cy="51" r="2" fill="#ffd43b"/><g class="wheel"><circle cx="28" cy="60" r="9" fill="#3a3a48"/><circle cx="28" cy="60" r="4" fill="#d0d4e0"/><path d="M28,56 V64 M24,60 H32" stroke="#3a3a48" stroke-width="1.4"/></g><g class="wheel"><circle cx="100" cy="60" r="9" fill="#3a3a48"/><circle cx="100" cy="60" r="4" fill="#d0d4e0"/><path d="M100,56 V64 M96,60 H104" stroke="#3a3a48" stroke-width="1.4"/></g></svg>';
        const truckDriveBy = () => {
            if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            const t = document.createElement('div');
            t.className = 'truck-run';
            t.setAttribute('aria-hidden', 'true');
            t.innerHTML = '<div class="truck-bubble">On our way! \ud83c\udf66</div>' + TRUCK_SVG;
            document.body.appendChild(t);
            t.addEventListener('animationend', (ev) => { if (ev.target === t) t.remove(); });
        };


        // Main image: cycles between the ice cream sandwich and other treats. Each has a happy face that blinks.
        const heroFace = (x, y, s, dark) => {
            const ink = dark ? '#fff7ec' : '#3a2318';
            return '<g transform="translate(' + x + ' ' + y + ') scale(' + s + ')"><circle cx="-5" cy="2" r="1.3" fill="#ff8fab" opacity=".6"/><circle cx="5" cy="2" r="1.3" fill="#ff8fab" opacity=".6"/><g class="eyes"><circle cx="-3" cy="-1.5" r="1.4" fill="' + ink + '"/><circle cx="3" cy="-1.5" r="1.4" fill="' + ink + '"/></g><path d="M-2.6,1.4 Q0,4.4 2.6,1.4" stroke="' + ink + '" stroke-width="1.2" fill="none" stroke-linecap="round"/></g>';
        };
        const heroWithFace = (key, svg) => {
            const a = FACE_ANCHORS[key];
            const glasses = a && HERO_GLASSES ? '<g transform="translate(' + a[0] + ' ' + a[1] + ') scale(' + a[2] + ')">' + FACE_GLASSES[HERO_GLASSES] + '</g>' : '';
            return a ? svg.replace(/<\/svg>$/, heroFace(a[0], a[1], a[2], a[3]) + glasses + '</svg>') : svg;
        };
        const hero = document.querySelector('.c-art .hero-bar');
        let heroTimer = null;
        const startHero = (keys, withSandwich) => {
            if (!hero) return;
            hero.querySelectorAll('.hb-item.extra').forEach(e => e.remove());
            keys.forEach(k => {
                const d = document.createElement('div');
                d.className = 'hb-item extra';
                d.innerHTML = heroWithFace(k, (TREAT_ART[k] || SPOOKY_ART[k]).svg);
                hero.appendChild(d);
            });
            const base = hero.querySelector('.hb-item.base');
            const baseArt = base && base.querySelector('svg > g');
            if (HERO_WINGS[SEASON] && base && !base.querySelector('.hero-wings')) base.insertAdjacentHTML('afterbegin', '<span class="hero-wings" aria-hidden="true">' + HERO_WINGS[SEASON].replace(/^<span class="acc-wings">|<\/span>$/g, '') + '</span>');
            if (baseArt && !base.dataset.face) { baseArt.insertAdjacentHTML('beforeend', heroFace(90, 46, 3.4, 1) + (BASE_DECOR[SEASON] || '')); base.dataset.face = '1'; }
            const items = [...(withSandwich ? [base] : []), ...hero.querySelectorAll('.hb-item.extra')];
            hero.querySelectorAll('.hb-item').forEach(e => e.classList.remove('on'));
            if (!items.length) return;
            let idx = 0;
            items[0].classList.add('on');
            clearInterval(heroTimer);
            heroTimer = setInterval(() => {
                if (!hero.isConnected) { clearInterval(heroTimer); return; }
                if (document.hidden) return;
                items[idx].classList.remove('on');
                idx = (idx + 1) % items.length;
                items[idx].classList.add('on');
            }, 14000);
        };

        startFalling(ALL_TREATS);
        startHero(shuffled(HERO_BY_SEASON[SEASON] || HERO_DEFAULT), true);

        // For the future inventory feature: call with the names of in-stock items,
        // e.g. window.setTreatsFromInventory(['Fudge Bar', { name: 'Cherry Slush', soldOut: true }]).
        // Only matching drawings will fall and rotate. Unknown names are ignored.
        // Pass a list of item names, or objects like { name: 'Fudge Bar', soldOut: true }.
        window.setTreatsFromInventory = (items) => {
            const list = (items || []).map(it => typeof it === 'string' ? { name: it, soldOut: false } : it);
            const inStock = treatKeysFor(list.filter(i => !i.soldOut).map(i => i.name));
            const soldOut = treatKeysFor(list.filter(i => i.soldOut).map(i => i.name)).filter(k => !inStock.includes(k));
            if (!inStock.length && !soldOut.length) return;
            startFalling(inStock, soldOut);
            startHero(inStock.filter(k => !k.startsWith('slush-') && k !== 'ice-cream-sandwich'), inStock.includes('ice-cream-sandwich'));
        };

        document.getElementById('cust-submit').onclick = async () => {
            const party = parseInt(document.getElementById('cust-party').value, 10);
            const time = document.getElementById('cust-time').value;
            const notes = document.getElementById('cust-notes').value.trim().slice(0, 200);
            const statusEl = document.getElementById('cust-status');

            if (!party || party < 1 || party > 100 || !time) {
                statusEl.style.color = '#d6336c';
                statusEl.textContent = 'Please enter your party size and a time 🍦';
                return;
            }
            try {
                await addDoc(collection(db, 'customer_requests'), {
                    partySize: party,
                    requestedTime: time,
                    notes: notes || 'None',
                    status: 'Pending',
                    createdAt: serverTimestamp()
                });
                statusEl.style.color = '#2b8a3e';
                statusEl.textContent = "Request sent! We'll see you soon 🍧";
                truckDriveBy();
                // The one time customers are asked: right after a request goes through, once the truck has driven by.
                const askSeq = routeSeq;
                setTimeout(() => { if (askSeq === routeSeq) openInstall(false, 'customer'); }, 4500);
                document.getElementById('cust-party').value = '';
                document.getElementById('cust-notes').value = '';
            } catch (err) {
                statusEl.style.color = '#d6336c';
                statusEl.textContent = "Hmm, that didn't go through. Check your connection and try again.";
            }
        };
    }

    // ---------- STAFF ----------
    function startStaffFlow() {
        authUnsub = onAuthStateChanged(auth, (user) => {
            cleanup(); cleanup = () => {};
            if (!user) { showLogin(); return; }
            const local = (user.email || '').split('@')[0];
            if (user.email === ADMIN_EMAIL) { openAdminHome(user, { primary: true }); }
            else if (/^truck\d{1,2}$/.test(local) && user.email === local + '@' + DOMAIN) { showDriver(user, local); }
            else if (EXTRA_ADMIN_RE.test(user.email || '')) { routeExtraAdmin(user); }
            else { loginNotice = 'That account is not set up for this app.'; signOut(auth); }
        });
    }

    // Extra admins (added by the main admin): first sign-in goes to "choose your password".
    async function routeExtraAdmin(user) {
        mount('tpl-login'); // shows "Checking setup…" briefly
        let rec;
        try { rec = await getDoc(doc(db, 'admins', user.uid)); }
        catch (e) { loginNotice = 'Couldn\'t check your admin access (no connection?). Try again.'; signOut(auth); return; }
        if (auth.currentUser !== user) return;
        if (!rec.exists()) { loginNotice = 'This admin login has been removed. Ask the main admin to add you again.'; signOut(auth); return; }
        const info = rec.data();
        if (info.pending) showSetPassword(user, info);
        else openAdminHome(user, { primary: false, name: info.name });
    }

    function showSetPassword(user, info) {
        mount('tpl-setpw');
        const $ = (id) => document.getElementById(id);
        $('setpw-title').textContent = 'Welcome, ' + info.name + ' — choose your password';
        $('setpw-cancel').onclick = () => signOut(auth);
        const save = async () => {
            const e1 = $('setpw-err'); e1.textContent = '';
            const a = $('setpw-1').value, b = $('setpw-2').value;
            if (a.length < 6) { e1.textContent = 'Password must be at least 6 characters.'; return; }
            if (a !== b) { e1.textContent = 'The two passwords don\'t match.'; return; }
            $('setpw-btn').disabled = true;
            try {
                await updatePassword(user, a);
                await setDoc(doc(db, 'admins', user.uid), { pending: false }, { merge: true });
                await deleteDoc(doc(db, 'adminCodes', user.uid)).catch(() => {});
                openAdminHome(user, { primary: false, name: info.name });
            } catch (e) {
                $('setpw-btn').disabled = false;
                e1.textContent = e.code === 'auth/requires-recent-login'
                    ? 'Please sign out and sign in again with your setup code, then choose your password right away.'
                    : explainAuthError(e, 'admin');
            }
        };
        $('setpw-btn').onclick = save;
        $('setpw-2').addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
    }

    // Plain-English explanations for the Firebase errors people actually hit.
    function explainAuthError(e, who) {
        const c = (e && e.code) || '';
        if (c === 'auth/operation-not-allowed' || c === 'auth/admin-restricted-operation')
            return 'Logins are switched off in Firebase. In the Firebase console go to Authentication → Sign-in method and turn on "Email/Password", then try again.';
        if (c === 'auth/invalid-credential' || c === 'auth/wrong-password' || c === 'auth/user-not-found' || c === 'auth/invalid-login-credentials')
            return who === 'admin' ? 'Wrong password.'
                : who === 'setup' ? 'That setup code doesn\'t match. Check it with the main admin (they can see it under "Admins").'
                : `Wrong PIN, or ${who} hasn't been added yet. The admin adds trucks in the Dispatch Console under "Manage trucks".`;
        if (c === 'auth/too-many-requests') return 'Too many tries. Wait a few minutes and try again.';
        if (c === 'auth/network-request-failed') return 'No internet connection. Check your signal and try again.';
        if (c === 'auth/weak-password') return 'Password must be at least 6 characters.';
        if (c === 'auth/unauthorized-domain' || c === 'auth/requests-from-referer-are-blocked' || c === 'auth/api-key-not-valid')
            return 'Firebase is blocking this website. In the Firebase console go to Authentication → Settings → Authorized domains and add ' + location.hostname + '.';
        if (c === 'auth/configuration-not-found')
            return 'Firebase Authentication isn\'t set up yet. In the Firebase console open Authentication, click "Get started", then turn on Email/Password.';
        return 'Something went wrong (' + (c || (e && e.message) || 'unknown') + ').';
    }

    async function showLogin() {
        mount('tpl-login');
        const $ = (id) => document.getElementById(id);
        const errEl = $('login-err');
        if (!isStandalone()) { $('install-link').style.display = 'block'; $('install-link').onclick = () => openInstall(true, 'staff'); }
        errEl.textContent = loginNotice; loginNotice = '';

        // Is there an admin yet, and who's on the roster? (small public documents: admin username + truck list)
        let adminName = null, rulesProblem = false, timedOut = false, roster = null, extraAdmins = [];
        try {
            const [snap, trucksSnap, adminsSnap] = await Promise.race([
                Promise.all([getDoc(doc(db, 'setup', 'admin')), getDocs(collection(db, 'trucks')), getDocs(collection(db, 'admins'))]),
                new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), 8000))
            ]);
            adminName = snap.exists() ? String(snap.data().username || '') : null;
            roster = trucksSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => byTruckNum(a.id, b.id));
            extraAdmins = adminsSnap.docs.map(d => ({ uid: d.id, ...d.data() })).sort((a, b) => String(a.name).localeCompare(String(b.name)));
        } catch (e) {
            if (e && (e.code === 'timeout' || e.code === 'unavailable')) timedOut = true; else rulesProblem = true;
        }
        if (!$('login-checking')) return; // page changed while we were checking
        $('login-checking').style.display = 'none';

        if (timedOut) {
            // Never leave people stuck: let them sign in anyway, retry, or open setup by hand.
            $('signin-box').style.display = '';
            errEl.innerHTML = 'Can\'t reach the database from this device right now (weak signal, data saver, or an ad blocker). '
                + 'You can still try to sign in. <br><button class="link-btn" id="retry-btn">Try again</button> · '
                + '<button class="link-btn" id="show-setup">First-time admin setup</button>';
            $('retry-btn').onclick = () => showLogin();
            $('show-setup').onclick = () => { $('signin-box').style.display = 'none'; $('setup-box').style.display = ''; };
        } else if (rulesProblem) {
            $('signin-box').style.display = '';
            errEl.textContent = 'The database rules haven\'t been published yet. In the Firebase console go to Firestore Database → Rules, paste in firestore.rules, and click Publish.';
        } else if (!adminName) {
            $('setup-box').style.display = '';
        } else {
            $('signin-box').style.display = '';
        }

        // ----- first-time admin setup -----
        $('setup-btn').onclick = async () => {
            const sErr = $('setup-err'); sErr.textContent = '';
            const name = $('setup-user').value.trim();
            const p1 = $('setup-pass').value, p2 = $('setup-pass2').value;
            if (!/^[A-Za-z][A-Za-z0-9 ._-]{1,29}$/.test(name)) { sErr.textContent = 'Username: 2–30 characters, starting with a letter.'; return; }
            if (loginIdFrom(name)) { sErr.textContent = 'Pick a username that isn\'t a truck number.'; return; }
            if (p1.length < 6) { sErr.textContent = 'Password must be at least 6 characters.'; return; }
            if (p1 !== p2) { sErr.textContent = 'The two passwords don\'t match.'; return; }
            $('setup-btn').disabled = true;
            try {
                try {
                    await createUserWithEmailAndPassword(auth, ADMIN_EMAIL, p1);
                } catch (e) {
                    // An admin account may already exist from an earlier attempt: if the password matches, carry on.
                    if (e.code === 'auth/email-already-in-use') await signInWithEmailAndPassword(auth, ADMIN_EMAIL, p1);
                    else throw e;
                }
                await setDoc(doc(db, 'setup', 'admin'), { username: name });
                const who = document.getElementById('admin-who');
                if (who) who.textContent = 'Signed in as ' + name + ' (admin)';
            } catch (e) {
                $('setup-btn').disabled = false;
                sErr.textContent = (e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/invalid-login-credentials')
                    ? 'An admin login already exists with a different password. Delete the user "admin@dispatch.local" in Firebase console → Authentication → Users, then try again.'
                    : (e.code === 'permission-denied'
                        ? 'The database rules haven\'t been published yet (Firestore Database → Rules → paste firestore.rules → Publish).'
                        : explainAuthError(e, 'admin'));
            }
        };

        // ----- "Who are you?" dropdown: every truck/driver, then Admin -----
        const whoSel = $('login-who');
        const add = (value, text, disabled) => { const o = document.createElement('option'); o.value = value; o.textContent = text; o.disabled = !!disabled; whoSel.appendChild(o); };
        add('', '— Select your name / truck —');
        if (roster && roster.length) {
            roster.forEach(t => add(t.id, truckName(t.id) + (t.driverName ? ' — ' + t.driverName : '') + (t.city ? ' (' + t.city + ')' : '')));
        } else if (roster) {
            add('-', 'No trucks added yet (admin adds them)', true);
        } else {
            for (let n = 1; n <= 9; n++) add('truck' + n, 'Truck ' + n); // list unavailable (bad signal): plain numbers
        }
        add('admin', '🔑 ' + (adminName ? adminName + ' (admin)' : 'Admin'));
        const extraByKey = {};
        extraAdmins.forEach(a => { extraByKey['adm:' + a.uid] = a; add('adm:' + a.uid, '🔑 ' + a.name + ' (admin)' + (a.pending ? ' — first sign-in' : '')); });
        let remembered = '';
        try { remembered = localStorage.getItem('staffWho') || ''; } catch (e) {}
        if ([...whoSel.options].some(o => o.value === remembered && !o.disabled)) whoSel.value = remembered;
        $('login-panel').value = getPanel();

        // The first box is a 4-digit PIN for drivers, a password for admins, or a setup code on an admin's first sign-in.
        const isAdminPick = () => whoSel.value === 'admin' || whoSel.value.startsWith('adm:');
        const applyWho = () => {
            const admin = isAdminPick();
            $('panel-wrap').style.display = admin ? '' : 'none';
            const extra = extraByKey[whoSel.value];
            const p = $('login-pass');
            p.classList.toggle('pin-input', !admin);
            if (extra && extra.pending) {
                $('login-pass-label').textContent = 'Setup code (from ' + (adminName || 'the main admin') + ')';
                p.inputMode = 'numeric'; p.placeholder = '6-digit setup code';
            } else if (admin) {
                $('login-pass-label').textContent = 'Password';
                p.inputMode = 'text'; p.placeholder = 'Your password';
            } else {
                $('login-pass-label').textContent = 'Your PIN';
                p.inputMode = 'numeric'; p.placeholder = '• • • •'; p.value = p.value.replace(/\D/g, '').slice(0, 4);
            }
        };
        whoSel.onchange = () => { if (!$('retry-btn')) errEl.textContent = ''; applyWho(); };
        applyWho();

        // ----- sign in -----
        const go = async () => {
            errEl.textContent = ''; errEl.style.color = '';
            const who = whoSel.value;
            const secret = $('login-pass').value.trim();
            if (!who || who === '-') { errEl.textContent = 'Pick your name / truck from the list.'; return; }
            let email, password, label;
            if (who === 'admin') {
                if (!secret) { errEl.textContent = 'Enter the admin password.'; return; }
                email = ADMIN_EMAIL; password = secret; label = 'admin';
            } else if (extraByKey[who]) {
                const a = extraByKey[who];
                if (a.pending) {
                    if (!/^\d{6}$/.test(secret)) { errEl.textContent = 'Enter the 6-digit setup code you were given.'; return; }
                    email = a.email; password = setupPassword(secret); label = 'setup';
                } else {
                    if (!secret) { errEl.textContent = 'Enter your password.'; return; }
                    email = a.email; password = secret; label = 'admin';
                }
            } else {
                if (!/^\d{4}$/.test(secret)) { errEl.textContent = 'Enter your 4-digit PIN.'; return; }
                email = who + '@' + DOMAIN; password = pinPassword(secret, who); label = truckName(who);
            }
            if (isAdminPick()) setPanel($('login-panel').value);
            $('login-btn').disabled = true;
            try {
                await signInWithEmailAndPassword(auth, email, password);
                try { localStorage.setItem('staffWho', who); } catch (e) {}
            } catch (e) { errEl.textContent = explainAuthError(e, label); $('login-btn').disabled = false; }
        };
        $('login-pass').addEventListener('input', () => {
            const p = $('login-pass'), extra = extraByKey[whoSel.value];
            if (extra && extra.pending) p.value = p.value.replace(/\D/g, '').slice(0, 6);
            else if (!isAdminPick()) p.value = p.value.replace(/\D/g, '').slice(0, 4);
        });
        $('login-btn').onclick = go;

        // Drivers can't change their own PIN: "Forgot your PIN?" sends a request to the admins.
        $('forgot-pin').onclick = async () => {
            const who = whoSel.value;
            if (isAdminPick()) { errEl.textContent = who === 'admin' ? 'Main admin: if you forgot your password, delete the user "admin@dispatch.local" in Firebase → Authentication → Users, then set up again.' : 'Ask the main admin to remove you under "Admins" and add you again with a new password.'; return; }
            if (!/^truck\d{1,2}$/.test(who)) { errEl.textContent = 'First pick your name / truck in "Who are you?", then tap "Forgot your PIN?" again.'; return; }
            try {
                await setDoc(doc(db, 'pin_requests', who), { at: serverTimestamp(), from: 'login' });
                errEl.style.color = '#16a34a';
                errEl.textContent = 'Request sent. Dispatch will see it and give you a new PIN.';
                setTimeout(() => { errEl.style.color = ''; }, 6000);
            } catch (e) { errEl.textContent = 'Could not send the request. Check your connection and try again.'; }
        };
        $('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
        $('setup-pass2').addEventListener('keydown', e => { if (e.key === 'Enter') $('setup-btn').click(); });
    }

    // ---------- DRIVER ----------
    // adminOpts is set when an admin opens the Driver panel (they pick which truck they're driving).
    function showDriver(user, truckId, adminOpts) {
        mount('tpl-driver');
        const $ = (id) => document.getElementById(id);
        const asAdmin = !!adminOpts;
        const driverState = { isTracking: () => false };
        if (asAdmin) {
            const ps = $('panel-switch');
            ps.style.display = ''; ps.value = 'driver';
            ps.onchange = () => {
                if (driverState.isTracking() && !confirm('Switching to the admin panel ends your shift (location sharing stops). Switch anyway?')) { ps.value = 'driver'; return; }
                switchPanel(user, adminOpts, ps.value);
            };
            $('pin-request-btn').parentElement.style.display = 'none';
            $('drive-pick').style.display = '';
            if (!truckId) { try { truckId = localStorage.getItem('adminDriveTruck') || null; } catch (e) {} }
            const sel = $('drive-truck');
            const addOpt = (value, text) => { const o = document.createElement('option'); o.value = value; o.textContent = text; sel.appendChild(o); };
            addOpt('', '— Pick the truck you are driving —');
            if (truckId) { addOpt(truckId, truckName(truckId)); sel.value = truckId; }
            getDocs(collection(db, 'trucks')).then(snap => {
                if (!$('drive-truck')) return;
                const list = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => byTruckNum(a.id, b.id));
                sel.innerHTML = '';
                addOpt('', list.length ? '— Pick the truck you are driving —' : 'No trucks yet (add them in the Admin panel)');
                list.forEach(t => addOpt(t.id, truckName(t.id) + (t.driverName ? ' — ' + t.driverName : '') + (t.city ? ' (' + t.city + ')' : '')));
                if (truckId && !list.some(t => t.id === truckId)) addOpt(truckId, truckName(truckId) + ' (removed)');
                sel.value = truckId || '';
            }).catch(() => {});
            sel.onchange = () => {
                if (driverState.isTracking() && !confirm('Changing trucks ends your current shift. Continue?')) { sel.value = truckId || ''; return; }
                try { localStorage.setItem('adminDriveTruck', sel.value); } catch (e) {}
                cleanup(); cleanup = () => {};
                showDriver(user, sel.value || null, adminOpts);
            };
            adminDisplayName(adminOpts).then(n => {
                if ($('driver-who')) $('driver-who').textContent = 'Signed in as ' + n + ' (admin)' + (truckId ? ' · driving ' + truckName(truckId) : '');
            });
            if (!truckId) {
                $('driver-title').textContent = 'Driver panel';
                $('driver-who').textContent = 'Signed in as admin';
                $('driver-main').style.display = 'none';
                $('driver-logout').onclick = () => signOut(auth);
                return;
            }
        }
        $('driver-title').textContent = truckName(truckId);
        if (!asAdmin) $('driver-who').textContent = 'Signed in as ' + truckName(truckId);

        // Driver name comes from the admin's truck list (an admin driving a truck goes by their own name).
        let driverName = '';
        if (asAdmin) {
            adminDisplayName(adminOpts).then(n => {
                driverName = n;
                if ($('driver-title')) $('driver-title').textContent = truckName(truckId) + ' — ' + n + ' driving';
            });
        } else getDoc(doc(db, 'trucks', truckId)).then(s => {
            if (!s.exists()) return;
            driverName = String(s.data().driverName || '');
            if (driverName && $('driver-title')) {
                $('driver-title').textContent = truckName(truckId) + ' — ' + driverName;
                $('driver-who').textContent = 'Signed in as ' + driverName;
            }
        }).catch(() => {});

        const STOP_RADIUS_M = 75, STOP_MIN_MS = 120000;
        let config = { ...DEFAULT_CONFIG };
        let tracking = false, watchId = null, lastSend = 0, anchor = null, wakeLock = null;
        let lastSentParked = null, shiftToken = 0, stoppedByDispatch = false;
        const statusEl = $('driver-status'), stopLine = $('stop-line'), btn = $('gps-btn');
        const stopTokenOf = (c) => Number((c.stopRequests || {})[truckId] || 0);

        function applyConfig() {
            $('sales-card').style.display = config.sales ? '' : 'none';
            $('items-wrap').style.display = config.items ? '' : 'none';
            stopLine.style.display = config.stops ? '' : 'none';
        }
        applyConfig();

        // ----- live map: where you are, plus any stops dispatch sent you -----
        driverState.isTracking = () => tracking;
        let alive = true, map = null, meMarker = null, meCircle = null, me = null, follow = true, viewWatch = null, lastCardRender = 0;
        let dispatch = null, doneSet = new Set(), stopLayer = null, routeLayer = null, routeInfo = '', routeNeedsOrigin = false, routeReq = 0, routePending = false;
        let alertEl = null, beepTimer = null, titleTimer = null, titleBase = '';
        const doneKey = (id) => 'dispatchDone_' + truckId + '_' + id;
        const seenKey = 'dispatchSeen_' + truckId;
        document.addEventListener('pointerdown', unlockAudio, { passive: true });

        loadLeaflet().then(() => {
            if (!alive || !$('driver-map')) return;
            map = L.map('driver-map').setView([39.5, -98.35], 4);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
            map.on('dragstart', () => { follow = false; });
            setTimeout(() => { if (map) map.invalidateSize(); }, 300);
            if (me) { const m = me; me = null; showMe(m.lat, m.lng, m.acc); }
            renderDispatchLayers();
            if (routePending || dispatch) updateRoute(true);
        }).catch(() => {
            const m = $('driver-map');
            if (m) m.innerHTML = '<p class="muted" style="padding:14px; margin:0;">The map could not load (no connection?). Your location is still shared and stops are listed above.</p>';
        });

        function showMe(lat, lng, acc) {
            const first = !me;
            me = { lat, lng, acc };
            if (dispatch && Date.now() - lastCardRender > 15000) renderDispatch(); // refresh "x mi away"
            if (!map) return;
            const ll = [lat, lng];
            if (!meMarker) {
                meMarker = L.marker(ll, { icon: L.divIcon({ className: 'me-icon', html: '<div class="me-dot"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }), zIndexOffset: 1000, keyboard: false })
                    .bindPopup('You are here').addTo(map);
                meCircle = L.circle(ll, { radius: acc || 30, color: '#2563eb', weight: 1, fillOpacity: 0.1 }).addTo(map);
            } else {
                meMarker.setLatLng(ll); meCircle.setLatLng(ll); meCircle.setRadius(acc || 30);
            }
            if (first) { if (dispatch) fitDispatch(); else map.setView(ll, 15); }
            else if (follow) map.panTo(ll);
            if (routeNeedsOrigin && dispatch) updateRoute(false);
        }

        // Shows your spot on the map even when you're not on shift (only if the phone already allows location).
        function startViewWatch() {
            if (!alive || tracking || viewWatch !== null || !('geolocation' in navigator)) return;
            viewWatch = navigator.geolocation.watchPosition(
                (p) => { if (!tracking) showMe(p.coords.latitude, p.coords.longitude, Math.round(p.coords.accuracy)); },
                (err) => { if (err && err.code === 1) { stopViewWatch(); if ($('locate-btn')) $('locate-btn').textContent = '📍 Location is blocked for this site'; } },
                { enableHighAccuracy: true, maximumAge: 15000, timeout: 30000 });
        }
        function stopViewWatch() { if (viewWatch !== null) { navigator.geolocation.clearWatch(viewWatch); viewWatch = null; } }
        try {
            if (navigator.permissions && navigator.permissions.query) {
                navigator.permissions.query({ name: 'geolocation' }).then(st => { if (st.state === 'granted') startViewWatch(); }).catch(() => {});
            }
        } catch (e) {}
        $('locate-btn').onclick = () => {
            follow = true;
            if (me && map) map.setView([me.lat, me.lng], Math.max(map.getZoom(), 15));
            if (!tracking) startViewWatch();
        };

        // ----- dispatch alerts -----
        function updateAlertsBtn() {
            const b = $('alerts-btn');
            if (b) b.style.display = ('Notification' in window && Notification.permission === 'default') ? '' : 'none';
        }
        async function askAlertPermission() {
            unlockAudio();
            try { if ('Notification' in window && Notification.permission === 'default') await Notification.requestPermission(); } catch (e) {}
            updateAlertsBtn();
        }
        $('alerts-btn').onclick = askAlertPermission;
        updateAlertsBtn();

        function notifySystem(title, body) {
            try {
                if (!('Notification' in window) || Notification.permission !== 'granted') return;
                const nOpts = { body, tag: 'dispatch-' + truckId, renotify: true, requireInteraction: true, icon: 'icon-192.png', badge: 'icon-192.png', vibrate: [400, 150, 400, 150, 800] };
                const plain = () => { try { new Notification(title, nOpts); } catch (e) {} };
                if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
                    navigator.serviceWorker.getRegistration().then(reg => { if (reg && reg.showNotification) reg.showNotification(title, nOpts).catch(plain); else plain(); }).catch(plain);
                } else plain();
            } catch (e) {}
        }

        const remaining = () => dispatch ? dispatch.stops.map((s, i) => ({ lat: s.lat, lng: s.lng, label: s.label, note: s.note, i })).filter(s => !doneSet.has(s.i)) : [];

        function handleDispatch(d) {
            const stops = d && Array.isArray(d.stops) ? d.stops.filter(s => s && typeof s.lat === 'number' && typeof s.lng === 'number').slice(0, 10) : [];
            if (!d || !d.id || !stops.length) {
                if (dispatch) { dispatch = null; doneSet = new Set(); closeAlert(); renderDispatch(); renderDispatchLayers(); updateRoute(false); }
                return;
            }
            if (dispatch && dispatch.id === String(d.id)) return; // nothing new
            dispatch = { id: String(d.id), stops: stops.map(s => ({ lat: s.lat, lng: s.lng, label: String(s.label || ''), note: String(s.note || '') })), note: String(d.note || ''), by: String(d.by || 'Dispatch'), sentAt: Number(d.sentAt) || Date.now() };
            try { doneSet = new Set(JSON.parse(localStorage.getItem(doneKey(dispatch.id)) || '[]')); } catch (e) { doneSet = new Set(); }
            renderDispatch(); renderDispatchLayers(); updateRoute(true);
            let seen = '';
            try { seen = localStorage.getItem(seenKey) || ''; } catch (e) {}
            if (seen !== dispatch.id) alertDriver();
        }

        function alertDriver() {
            closeAlert();
            const d = dispatch;
            if (!d) return;
            alertEl = document.createElement('div');
            alertEl.className = 'alert-overlay';
            alertEl.innerHTML = '<div class="alert-box" role="alertdialog" aria-labelledby="alert-title">'
                + '<h2 id="alert-title">🚨 New stops from dispatch</h2>'
                + '<p style="margin:0 0 8px;">' + esc(d.by) + ' sent ' + d.stops.length + ' stop' + (d.stops.length === 1 ? '' : 's') + ' for ' + esc(truckName(truckId)) + '.</p>'
                + (d.note ? '<p style="background:#fff7ed; border-radius:8px; padding:8px 10px; margin:0 0 8px;">💬 ' + esc(d.note) + '</p>' : '')
                + '<ol style="margin:0 0 12px; padding-left:20px;">' + d.stops.map(s => '<li>' + esc(s.label || 'Stop') + (s.note ? ' <span class="muted">— ' + esc(s.note) + '</span>' : '') + '</li>').join('') + '</ol>'
                + '<div class="btn-row"><button class="action-btn btn-green" type="button" data-act="ok">Got it — show route</button>'
                + '<button class="action-btn btn-orange" type="button" data-act="nav">🧭 Navigate</button></div></div>';
            document.body.appendChild(alertEl);
            alertEl.querySelector('[data-act="ok"]').onclick = () => { ackDispatch(); closeAlert(); focusRoute(); };
            alertEl.querySelector('[data-act="nav"]').onclick = () => { ackDispatch(); closeAlert(); openNavigation(false); };
            ring();
            let rings = 1;
            beepTimer = setInterval(() => { if (rings >= 4) { clearInterval(beepTimer); beepTimer = null; return; } rings++; ring(); }, 15000);
            try { if (navigator.vibrate) navigator.vibrate([400, 150, 400, 150, 800]); } catch (e) {}
            titleBase = document.title;
            let flip = false;
            titleTimer = setInterval(() => { flip = !flip; document.title = flip ? '🚨 New stops!' : titleBase; }, 1000);
            notifySystem('🚨 New stops from dispatch', d.stops.length + ' stop' + (d.stops.length === 1 ? '' : 's') + ': ' + d.stops.map(s => s.label).filter(Boolean).join(' → ').slice(0, 140));
        }
        function closeAlert() {
            if (alertEl) { alertEl.remove(); alertEl = null; }
            if (beepTimer) { clearInterval(beepTimer); beepTimer = null; }
            if (titleTimer) { clearInterval(titleTimer); titleTimer = null; document.title = titleBase || document.title; }
        }
        // Tells dispatch you've seen the stops (and which ones are done).
        function ackDispatch() {
            if (!dispatch) return;
            try { localStorage.setItem(seenKey, dispatch.id); } catch (e) {}
            setDoc(doc(db, 'dispatch_acks', truckId), { dispatchId: dispatch.id, seenAt: Date.now(), done: [...doneSet].sort((a, b) => a - b), by: String(driverName || truckName(truckId)).slice(0, 40) }).catch(() => {});
        }
        function markDone(i) {
            if (!dispatch) return;
            if (doneSet.has(i)) doneSet.delete(i); else doneSet.add(i);
            try { localStorage.setItem(doneKey(dispatch.id), JSON.stringify([...doneSet])); } catch (e) {}
            ackDispatch();
            renderDispatch(); renderDispatchLayers(); updateRoute(false);
        }

        function renderDispatch() {
            const card = $('dispatch-card');
            if (!card) return;
            lastCardRender = Date.now();
            if (!dispatch) { card.style.display = 'none'; card.innerHTML = ''; return; }
            const left = remaining();
            card.style.display = '';
            card.innerHTML = '<h3>📍 Stops from ' + esc(dispatch.by) + '</h3>'
                + '<div class="muted" style="margin-bottom:6px;">Sent ' + esc(fmtTime(dispatch.sentAt)) + (routeInfo ? ' · ' + esc(routeInfo) : '') + '</div>'
                + (dispatch.note ? '<div style="margin:0 0 6px;">💬 ' + esc(dispatch.note) + '</div>' : '');
            dispatch.stops.forEach((s, i) => {
                const isDone = doneSet.has(i);
                const dist = me && !isDone ? fmtMiles(distMeters(me.lat, me.lng, s.lat, s.lng)) + ' away' : '';
                const row = document.createElement('div');
                row.className = 'stop-row' + (isDone ? ' done' : '');
                row.innerHTML = '<span class="stop-num' + (isDone ? ' done' : '') + '">' + (isDone ? '✓' : (i + 1)) + '</span>'
                    + '<div class="stop-main"><div><strong>' + esc(s.label || ('Stop ' + (i + 1))) + '</strong></div>'
                    + (s.note ? '<small>' + esc(s.note) + '</small>' : '') + (dist ? '<small>' + esc(dist) + '</small>' : '') + '</div>';
                const b = document.createElement('button');
                b.className = 'mini-btn'; b.type = 'button'; b.textContent = isDone ? 'Undo' : 'Done ✓';
                b.onclick = () => markDone(i);
                row.appendChild(b);
                card.appendChild(row);
            });
            const btns = document.createElement('div');
            btns.className = 'btn-row';
            if (left.length) {
                const nav = document.createElement('button');
                nav.className = 'action-btn btn-orange'; nav.type = 'button';
                nav.textContent = left.length > 1 ? '🧭 Navigate all ' + left.length + ' stops' : '🧭 Navigate';
                nav.onclick = () => { ackDispatch(); openNavigation(false); };
                btns.appendChild(nav);
                if (left.length > 1) {
                    const nx = document.createElement('button');
                    nx.className = 'action-btn'; nx.type = 'button'; nx.textContent = 'Next stop only';
                    nx.onclick = () => { ackDispatch(); openNavigation(true); };
                    btns.appendChild(nx);
                }
            } else {
                const ok = document.createElement('div');
                ok.style.cssText = 'font-weight:700; color:#16a34a;';
                ok.textContent = '✅ All stops done!';
                btns.appendChild(ok);
            }
            card.appendChild(btns);
            const tools = document.createElement('div');
            tools.className = 'map-tools'; tools.style.margin = '10px 0 0';
            const show = document.createElement('button');
            show.className = 'link-btn'; show.type = 'button'; show.textContent = 'Show route on map';
            show.onclick = () => { ackDispatch(); focusRoute(); };
            const rr = document.createElement('button');
            rr.className = 'link-btn'; rr.type = 'button'; rr.textContent = '↻ Re-route from here';
            rr.onclick = () => { ackDispatch(); updateRoute(true); };
            tools.append(show, rr);
            card.appendChild(tools);
        }

        function renderDispatchLayers() {
            if (!map) return;
            if (stopLayer) { map.removeLayer(stopLayer); stopLayer = null; }
            if (!dispatch) return;
            stopLayer = L.layerGroup().addTo(map);
            dispatch.stops.forEach((s, i) => {
                const isDone = doneSet.has(i);
                L.marker([s.lat, s.lng], { icon: L.divIcon({ className: 'stop-icon', html: '<div class="stop-pin' + (isDone ? ' done' : '') + '">' + (isDone ? '✓' : (i + 1)) + '</div>', iconSize: [28, 28], iconAnchor: [14, 14] }) })
                    .bindPopup('<b>Stop ' + (i + 1) + '</b><br>' + esc(s.label || '') + (s.note ? '<br><small>' + esc(s.note) + '</small>' : ''))
                    .addTo(stopLayer);
            });
        }

        // Draws the road route from you through the stops that aren't done yet.
        async function updateRoute(fit) {
            if (!map) { routePending = true; return; }
            routePending = false;
            const req = ++routeReq;
            if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
            routeInfo = '';
            const left = remaining();
            if (!dispatch || !left.length) { routeNeedsOrigin = false; if (dispatch) renderDispatch(); return; }
            const pts = (me ? [[me.lat, me.lng]] : []).concat(left.map(s => [s.lat, s.lng]));
            routeNeedsOrigin = !me;
            if (fit) fitDispatch();
            if (pts.length < 2) { renderDispatch(); return; }
            const r = await fetchRoute(pts);
            if (req !== routeReq || !alive || !map) return;
            routeLayer = r
                ? L.polyline(r.coords, { color: '#ea580c', weight: 6, opacity: 0.85 }).addTo(map)
                : L.polyline(pts, { color: '#ea580c', weight: 4, opacity: 0.85, dashArray: '8 10' }).addTo(map);
            routeInfo = r ? fmtMiles(r.distance) + ' · about ' + fmtDur(r.duration * 1000) + ' of driving' : 'straight-line preview (tap Navigate for directions)';
            renderDispatch();
        }
        function fitDispatch() {
            if (!map || !dispatch) return;
            const pts = remaining().map(s => [s.lat, s.lng]);
            if (me) pts.push([me.lat, me.lng]);
            if (!pts.length) return;
            follow = false;
            if (pts.length === 1) map.setView(pts[0], 15); else map.fitBounds(pts, { padding: [40, 40], maxZoom: 16 });
        }
        function focusRoute() {
            fitDispatch();
            const m = $('driver-map');
            if (m) m.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        // Opens Google Maps (app on Android/iPhone) with turn-by-turn directions through the stops.
        function openNavigation(onlyNext) {
            const left = remaining();
            if (!left.length) return;
            const list = onlyNext ? [left[0]] : left.slice(0, 10);
            const dest = list[list.length - 1];
            let url = 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=' + encodeURIComponent(dest.lat + ',' + dest.lng);
            const way = list.slice(0, -1).map(s => s.lat + ',' + s.lng).join('|');
            if (way) url += '&waypoints=' + encodeURIComponent(way);
            if (me) url += '&origin=' + encodeURIComponent(me.lat + ',' + me.lng);
            window.open(url, '_blank', 'noopener');
        }

        const unsubConfig = onSnapshot(doc(db, 'config', 'metrics'), async (snap) => {
            config = { ...DEFAULT_CONFIG, ...(snap.exists() ? snap.data() : {}) };
            applyConfig();
            handleDispatch((config.dispatch || {})[truckId] || null);
            // Dispatch pressed "Stop" for this truck since this shift started -> stop sharing.
            if (tracking && stopTokenOf(config) !== shiftToken) {
                stoppedByDispatch = true;
                await stopTracking();
                statusEl.textContent = 'Dispatch stopped your location sharing. Tap Start Shift to share again.';
            }
        }, () => {});

        // ----- sales -----
        // Each sale is saved as its own record (for the CSV), and also added to ONE small running-total
        // document per truck per day. Screens only ever listen to the running totals, which keeps reads tiny.
        let summary = {};
        let summaryUnsub = () => {};
        let summaryDay = null;
        function watchSummary() {
            const d = dayStr();
            if (d === summaryDay) return;
            summaryUnsub();
            summaryDay = d;
            summaryUnsub = onSnapshot(doc(db, 'daily', d + '_' + truckId), (snap) => {
                summary = snap.exists() ? snap.data() : {};
                renderSales();
            }, () => {});
        }
        watchSummary();

        const recentKey = () => 'recentSales_' + truckId + '_' + dayStr();
        function loadRecent() { try { return JSON.parse(localStorage.getItem(recentKey()) || '[]'); } catch (e) { return []; } }
        function saveRecent(list) { try { localStorage.setItem(recentKey(), JSON.stringify(list.slice(0, 5))); } catch (e) {} }
        let recent = loadRecent();

        function renderSales() {
            const total = summary.sales || 0, items = summary.items || 0;
            $('sales-total').textContent = `Today: ${money(total)}` + (config.items ? ` · ${items} item${items === 1 ? '' : 's'}` : '');
            const listEl = $('sales-list');
            listEl.innerHTML = '';
            recent.forEach(s => {
                const row = document.createElement('div');
                row.className = 'card';
                row.innerHTML = `<div>${money(s.amount)}${config.items ? ' · ' + (s.items || 0) + ' item(s)' : ''}<br><small class="muted">${fmtTime(s.t)}</small></div>`;
                const rm = document.createElement('button');
                rm.className = 'link-btn'; rm.textContent = 'Remove';
                rm.onclick = async () => {
                    if (!confirm('Remove this sale?')) return;
                    try {
                        await deleteDoc(doc(db, 'sales', s.id));
                        await bumpDaily(s.day || dayStr(), { sales: -s.amount, items: -(s.items || 0), saleCount: -1 });
                        recent = recent.filter(x => x.id !== s.id); saveRecent(recent); renderSales();
                    } catch (e) { alert('Could not remove that sale. Check your connection.'); }
                };
                row.appendChild(rm);
                listEl.appendChild(row);
            });
        }

        function bumpDaily(day, delta) {
            const data = { truckId, day };
            Object.keys(delta).forEach(k => { data[k] = increment(delta[k]); });
            return setDoc(doc(db, 'daily', day + '_' + truckId), data, { merge: true });
        }

        $('sale-btn').onclick = async () => {
            const amount = Math.round(parseFloat($('sale-amount').value) * 100) / 100;
            if (!isFinite(amount) || amount < 0 || amount > 100000) { alert('Enter the sale amount.'); return; }
            const items = config.items ? Math.max(0, parseInt($('sale-items').value || '0', 10) || 0) : 0;
            const day = dayStr();
            watchSummary();
            try {
                const ref = await addDoc(collection(db, 'sales'), { truckId, amount, items, day, createdAt: serverTimestamp() });
                await bumpDaily(day, { sales: amount, items, saleCount: 1 });
                recent = loadRecent();
                recent.unshift({ id: ref.id, amount, items, day, t: Date.now() });
                saveRecent(recent); recent = recent.slice(0, 5);
                $('sale-amount').value = ''; $('sale-items').value = '';
                renderSales();
            } catch (e) { alert(e && e.code === 'permission-denied' ? 'The database rules don\'t let this login save sales for ' + truckName(truckId) + ' yet.' : 'Could not save that sale. Check your connection.'); }
        };

        // ----- stop detection -----
        function trackStop(lat, lng, now, acc) {
            if (acc > 100) return;
            if (!anchor) { anchor = { lat, lng, since: now }; return; }
            if (distMeters(anchor.lat, anchor.lng, lat, lng) > STOP_RADIUS_M) {
                finalizeStop(now);
                anchor = { lat, lng, since: now };
            }
        }
        async function finalizeStop(endMs) {
            if (!config.stops || !anchor || endMs - anchor.since < STOP_MIN_MS) return;
            const durationSec = Math.round((endMs - anchor.since) / 1000);
            const day = dayStr(anchor.since);
            try {
                await addDoc(collection(db, 'stops'), {
                    truckId, lat: anchor.lat, lng: anchor.lng,
                    startedAt: anchor.since, endedAt: endMs, durationSec, day
                });
                await bumpDaily(day, { stopCount: 1, stopSec: durationSec });
            } catch (e) {}
        }
        const stopSinceNow = (now) => (config.stops && anchor && now - anchor.since >= STOP_MIN_MS) ? anchor.since : null;

        // ----- keep screen awake while tracking -----
        async function lockScreen() { try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
        const onVis = () => {
            if (document.visibilityState === 'visible' && tracking) {
                lockScreen();
                statusEl.textContent = 'Welcome back — location sharing resumed.';
            }
        };
        document.addEventListener('visibilitychange', onVis);

        async function stopTracking() {
            if (!tracking) return;
            tracking = false;
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            watchId = null;
            try { if (wakeLock) await wakeLock.release(); } catch (e) {}
            wakeLock = null;
            await finalizeStop(Date.now());
            anchor = null;
            btn.textContent = 'Start Shift (share location)';
            btn.style.background = '';
            statusEl.textContent = 'Status: Offline';
            stopLine.textContent = '';
            try { await deleteDoc(doc(db, 'active_fleet', truckId)); } catch (e) {}
            if (alive) startViewWatch();
        }

        // ----- location permission help -----
        const ua = navigator.userAgent || '';
        const isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
        const isAndroid = /Android/i.test(ua);
        // Built-in browsers inside other apps (GitHub, Facebook, Instagram, Gmail, etc.) often can't use location.
        const inApp = /FBAN|FBAV|Instagram|Line\/|GSA\/|Twitter|LinkedInApp|GitHub|Snapchat|; wv\)/i.test(ua);
        const helpEl = $('loc-help');
        function hideHelp() { helpEl.style.display = 'none'; helpEl.innerHTML = ''; }
        function showHelp(kind) {
            const site = location.hostname;
            let title, steps;
            if (kind === 'insecure') {
                title = 'Location only works on the https:// web address';
                steps = [`Open <strong>https://${esc(site)}${esc(location.pathname)}</strong> instead.`];
            } else if (kind === 'inapp') {
                title = 'Open this page in Chrome or Safari';
                steps = ['You opened this inside another app (like GitHub, Facebook or email). Those built-in browsers often block location.',
                    isIOS ? 'Tap the share / compass button and choose <strong>Open in Safari</strong>.' : 'Tap <strong>⋮</strong> (top right) and choose <strong>Open in Chrome</strong>.',
                    'Sign in again there and tap <strong>Start Shift</strong>.',
                    'Tip: in Chrome/Safari use <strong>Add to Home screen</strong> so drivers always open it the right way.'];
            } else if (kind === 'off') {
                title = 'Your phone\'s Location is turned off';
                steps = isIOS
                    ? ['Open <strong>Settings → Privacy &amp; Security → Location Services</strong> and turn it <strong>On</strong>.', 'Come back here and tap <strong>Try again</strong>.']
                    : ['Swipe down from the top of the screen and turn on <strong>Location</strong>.', 'Come back here and tap <strong>Try again</strong>.'];
            } else { // denied
                title = 'Location is blocked for this website';
                steps = isIOS
                    ? ['In Safari, tap <strong>aA</strong> (left of the web address) → <strong>Website Settings</strong> → <strong>Location</strong> → <strong>Allow</strong>.',
                       'Also check <strong>Settings → Privacy &amp; Security → Location Services</strong> is On, and <strong>Safari Websites</strong> is set to <strong>While Using the App</strong>.',
                       'Reload this page, sign in, and tap <strong>Try again</strong>.']
                    : isAndroid
                    ? ['Tap the <strong>lock / settings icon</strong> left of the web address → <strong>Permissions</strong> (or Site settings) → <strong>Location</strong> → <strong>Allow</strong>.',
                       'Also check phone <strong>Settings → Apps → Chrome → Permissions → Location</strong> is <strong>Allowed</strong>, and Location is turned on.',
                       'Come back and tap <strong>Try again</strong>. If it asks, tap <strong>Allow</strong>.']
                    : ['Click the icon left of the web address and set <strong>Location</strong> to <strong>Allow</strong>.', 'Then tap <strong>Try again</strong>.'];
                if (inApp) steps.unshift('You opened this inside another app — that is usually the cause. Open it in Chrome or Safari instead (⋮ or share button → Open in browser).');
            }
            helpEl.innerHTML = `<h4>📍 ${title}</h4><ol>${steps.map(s => `<li>${s}</li>`).join('')}</ol>`;
            if (kind !== 'insecure') {
                const again = document.createElement('button');
                again.className = 'action-btn'; again.textContent = 'Try again'; again.style.margin = '4px 0 0';
                again.onclick = () => { hideHelp(); btn.click(); };
                helpEl.appendChild(again);
            }
            helpEl.style.display = '';
        }

        btn.onclick = async () => {
            if (tracking) { stopTracking(); return; }
            askAlertPermission(); // asked here because the phone only allows it right after a tap
            if (!('geolocation' in navigator)) { alert('Geolocation is not supported by your browser.'); return; }
            if (!window.isSecureContext) { showHelp('insecure'); return; }
            // If location is already blocked for this site, explain how to fix it instead of failing.
            try {
                if (navigator.permissions && navigator.permissions.query) {
                    const st = await navigator.permissions.query({ name: 'geolocation' });
                    if (st.state === 'denied') { showHelp('denied'); return; }
                }
            } catch (e) { /* some browsers (older iPhones) don't support this check; just try */ }
            hideHelp();
            // A truck that dispatch deleted can't start sharing again.
            btn.disabled = true;
            try {
                const reg = await getDoc(doc(db, 'trucks', truckId));
                if (!reg.exists()) { statusEl.textContent = 'This truck has been removed by dispatch. Ask the admin to add it again.'; btn.disabled = false; return; }
            } catch (e) { /* offline: let them start; the location will sync when signal returns */ }
            btn.disabled = false;
            if (tracking) return;
            tracking = true; anchor = null; lastSend = 0; lastSentParked = null;
            shiftToken = stopTokenOf(config); stoppedByDispatch = false;
            btn.textContent = 'End Shift (stop sharing)';
            btn.style.background = '#dc2626';
            statusEl.textContent = 'Connecting to GPS... (tap Allow if your phone asks)';
            lockScreen();
            stopViewWatch();
            startWatch(true);
        };

        // Watches the phone's location. Starts with precise GPS; if that keeps timing out (indoors, weak signal)
        // it falls back to the phone's approximate location instead of failing.
        let timeouts = 0, preciseMode = true;
        function startWatch(precise) {
            preciseMode = precise; timeouts = 0;
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            watchId = navigator.geolocation.watchPosition(onPosition, onGeoError,
                precise ? { enableHighAccuracy: true, timeout: 30000, maximumAge: 5000 }
                        : { enableHighAccuracy: false, timeout: 60000, maximumAge: 60000 });
        }
        function onGeoError(err) {
            if (!tracking) return;
            if (err.code === 1) { // PERMISSION_DENIED ("User denied Geolocation")
                stopTracking().then(() => { statusEl.textContent = 'Location permission is blocked on this phone.'; showHelp(inApp ? 'inapp' : 'denied'); });
                return;
            }
            if (err.code === 2) { // POSITION_UNAVAILABLE: location services off / no fix at all
                statusEl.textContent = 'Your phone can\'t find its location yet.';
                showHelp('off');
                return; // keep watching; it recovers on its own once Location is on
            }
            // TIMEOUT: not fatal. Keep trying, and switch to approximate location after a couple of misses.
            timeouts++;
            statusEl.textContent = 'Still looking for a GPS signal… (try near a window or outside)';
            if (preciseMode && timeouts >= 2) startWatch(false);
        }

        async function onPosition(pos) {
                if (!tracking) return;
                hideHelp();
                const now = Date.now();
                const { latitude: lat, longitude: lng } = pos.coords;
                const acc = Math.round(pos.coords.accuracy);
                // Precise mode waits for a good GPS lock; approximate mode accepts a rougher position so the truck still shows up.
                if (acc > (preciseMode ? 150 : 2000)) { statusEl.textContent = `Getting a better GPS lock... (+/- ${acc}m)`; return; }
                if (!preciseMode && acc <= 100) startWatch(true); // GPS is back: return to precise mode

                showMe(lat, lng, acc);
                trackStop(lat, lng, now, acc);
                const since = stopSinceNow(now);
                statusEl.textContent = `Sharing location (+/- ${acc}m)`;
                stopLine.textContent = since ? `At this stop for ${fmtDur(now - since)}` : 'Moving';

                // Ping timing: 30s while moving, 90s while parked, and right away when arriving/leaving a stop.
                const parked = !!(anchor && now - anchor.since >= STOP_MIN_MS);
                const every = parked ? PARKED_MS : MOVING_MS;
                if (tracking && !stoppedByDispatch && (now - lastSend >= every || parked !== lastSentParked)) {
                    lastSend = now; lastSentParked = parked;
                    try {
                        await setDoc(doc(db, 'active_fleet', truckId), {
                            lat, lng, accuracy: acc, truckId,
                            driverName: driverName.slice(0, 40),
                            stopSince: since,
                            lastUpdated: serverTimestamp()
                        });
                    } catch (e) {
                        statusEl.textContent = (e && e.code === 'permission-denied')
                            ? (asAdmin ? 'The database rules don\'t let admin logins share a truck\'s location yet (see the rules note).' : 'The database refused your location. Ask the admin to check the Firestore rules.')
                            : 'Could not send location. Check your connection.';
                    }
                }
        }

        $('pin-request-btn').onclick = async () => {
            if (!confirm('Ask dispatch for a new PIN? They will set it and tell you the new one.')) return;
            try {
                await setDoc(doc(db, 'pin_requests', truckId), { at: serverTimestamp(), from: 'driver' });
                $('pin-request-msg').textContent = '✅ Request sent. Dispatch will give you a new PIN.';
            } catch (e) { $('pin-request-msg').textContent = 'Could not send the request. Check your connection.'; }
        };

        $('driver-logout').onclick = async () => { await stopTracking(); await signOut(auth); };

        cleanup = () => {
            alive = false;
            closeAlert(); stopViewWatch();
            document.removeEventListener('pointerdown', unlockAudio);
            if (map) { safeRemoveMap(map); map = null; }
            stopTracking();
            unsubConfig(); summaryUnsub();
            document.removeEventListener('visibilitychange', onVis);
        };
    }

    // ---------- ADMIN ----------
    function loadLeaflet() {
        if (window.L) return Promise.resolve();
        return new Promise((resolve, reject) => {
            const css = document.createElement('link');
            css.rel = 'stylesheet';
            css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
            document.head.appendChild(css);
            const js = document.createElement('script');
            js.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
            js.onload = resolve; js.onerror = reject;
            document.head.appendChild(js);
        });
    }

    async function showAdmin(user, opts = { primary: true }) {
        mount('tpl-admin');
        const $ = (id) => document.getElementById(id);
        $('admin-who').textContent = 'Signed in as ' + (opts.name ? opts.name + ' (admin)' : 'admin');
        if (opts.primary) getDoc(doc(db, 'setup', 'admin')).then(s => { if (s.exists() && $('admin-who')) $('admin-who').textContent = 'Signed in as ' + s.data().username + ' (admin)'; }).catch(() => {});
        if (!opts.primary) $('admins-section').style.display = 'none'; // only the main admin manages admins
        $('link-customer').textContent = baseUrl;
        $('link-staff').textContent = baseUrl + '#staff';
        $('admin-logout').onclick = () => signOut(auth);
        const ps = $('panel-switch');
        ps.style.display = ''; ps.value = 'admin';
        ps.onchange = () => switchPanel(user, opts, ps.value);
        const errEl = $('admin-err');

        try { await loadLeaflet(); } catch (e) { errEl.textContent = 'Could not load the map library.'; return; }

        const today = dayStr();
        const map = L.map('admin-map').setView([39.5, -98.35], 4);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
        setTimeout(() => map.invalidateSize(), 300);

        let trucks = {}, pins = {}, fleet = {}, daily = {}, recentStops = [], config = { ...DEFAULT_CONFIG };
        const nameOf = (id) => (trucks[id] && trucks[id].driverName) || (fleet[id] && fleet[id].driverName) || '';
        const sumOf = (key) => Object.values(daily).reduce((a, d) => a + (d[key] || 0), 0);
        const markers = {};
        let fitted = false;

        function denied() {
            errEl.textContent = 'Could not read data. Make sure the Firestore rules are published and you signed in as admin.';
        }

        const sortedTruckIds = () => Object.keys(trucks).sort((a, b) => {
            const ca = (trucks[a].city || '').toLowerCase(), cb = (trucks[b].city || '').toLowerCase();
            return ca === cb ? byTruckNum(a, b) : (ca < cb ? -1 : 1);
        });
        // Live locations that don't belong to any truck in your list (e.g. left over from the original app)
        const orphanIds = () => Object.keys(fleet).filter(id => !trucks[id]).sort(byTruckNum);

        function statusOf(id) {
            const f = fleet[id];
            if (!f) return { label: 'Offline', cls: 'off', age: null };
            const age = f.lastUpdated && f.lastUpdated.toMillis ? Date.now() - f.lastUpdated.toMillis() : 0;
            return age > STALE_MS ? { label: 'Stale', cls: 'stale', age } : { label: 'Online', cls: 'on', age };
        }

        function renderStats() {
            const ids = Object.keys(trucks);
            const online = ids.filter(id => statusOf(id).cls === 'on').length;
            const total = sumOf('sales'), items = sumOf('items');
            const stopCount = sumOf('stopCount'), stopMs = sumOf('stopSec') * 1000;
            let html = `<div class="stat"><b>${online} / ${ids.length}</b><span>Trucks online</span></div>`;

            if (config.sales && config.items) html += `<div class="stat"><b>${items}</b><span>Items sold today</span></div>`;
            if (config.stops) html += `<div class="stat"><b>${stopCount}</b><span>Stops today</span></div>`
                + `<div class="stat"><b>${stopCount ? fmtDur(stopMs / stopCount) : '—'}</b><span>Avg time at stop</span></div>`;
            $('admin-stats').innerHTML = html;
        }

        function liveCoords(filterCity) {
            return Object.keys(fleet)
                .filter(id => !filterCity || (trucks[id] && (trucks[id].city || '') === filterCity))
                .filter(id => typeof fleet[id].lat === 'number' && typeof fleet[id].lng === 'number')
                .map(id => [fleet[id].lat, fleet[id].lng]);
        }
        function fitTo(city) {
            const pts = liveCoords(city);
            if (!pts.length) { errEl.textContent = 'No trucks are sharing their location' + (city ? ' in ' + city : '') + ' right now.'; return; }
            errEl.textContent = '';
            if (pts.length === 1) map.setView(pts[0], 14); else map.fitBounds(pts, { padding: [50, 50], maxZoom: 15 });
        }

        // ----- stop a truck's location sharing -----
        // Removes it from the map AND tells that driver's phone to stop sending (so it doesn't reappear).
        async function stopTruck(id) {
            if (!confirm(`Stop location sharing for ${truckName(id)}? The driver's phone will stop sending its location until they tap Start Shift again.`)) return;
            try {
                await setDoc(doc(db, 'config', 'metrics'), { stopRequests: { [id]: increment(1) } }, { merge: true });
                await deleteDoc(doc(db, 'active_fleet', id));
                errEl.textContent = '';
            } catch (e) { errEl.textContent = 'Could not stop ' + truckName(id) + '. Check your connection.'; }
        }
        // Delete: takes the truck off the map, tells its phone to stop, and removes it from your truck list.
        async function deleteTruck(id) {
            const registered = !!trucks[id];
            const msg = registered
                ? `Delete ${truckName(id)}? It will disappear from the map and your truck list, and its phone will stop sharing. (Its sales history is kept.)`
                : `Delete ${truckName(id)} from the map?`;
            if (!confirm(msg)) return;
            try {
                await setDoc(doc(db, 'config', 'metrics'), { stopRequests: { [id]: increment(1) } }, { merge: true });
                if (fleet[id]) await deleteDoc(doc(db, 'active_fleet', id));
                if (registered) {
                    // Also remove the truck's login, so its PIN stops working and the number can be reused cleanly.
                    if (pins[id] && pins[id].pin) {
                        await withTruckLogin(id, [pins[id].pin], async (u) => { await deleteUser(u); }).catch(() => {});
                    }
                    await deleteDoc(doc(db, 'pins', id)).catch(() => {});
                    await deleteDoc(doc(db, 'trucks', id));
                }
                errEl.textContent = '';
            } catch (e) { errEl.textContent = 'Could not delete ' + truckName(id) + '. Check your connection.'; }
        }

        // Signs in AS a truck on a separate, throw-away Firebase connection (so the admin stays signed in),
        // runs fn(user), then signs that connection out. Tries each known PIN (new 4-digit style, then old style).
        async function withTruckLogin(id, knownPins, fn) {
            const secAuth = getAuth(initializeApp(firebaseConfig, 'sec-' + id + '-' + Date.now()));
            let lastErr;
            for (const p of knownPins.filter(Boolean)) {
                for (const pw of [pinPassword(p, id), p]) {
                    if (pw.length < 6) continue;
                    try {
                        const cred = await signInWithEmailAndPassword(secAuth, id + '@' + DOMAIN, pw);
                        try { return await fn(cred.user, secAuth); } finally { try { await signOut(secAuth); } catch (e) {} }
                    } catch (e) { lastErr = e; if (e.code !== 'auth/invalid-credential' && e.code !== 'auth/wrong-password' && e.code !== 'auth/invalid-login-credentials') throw e; }
                }
            }
            throw lastErr || { code: 'pin-unknown' };
        }
        async function clearAll() {
            const ids = Object.keys(fleet);
            if (!ids.length) { errEl.textContent = 'There are no trucks on the map.'; return; }
            if (!confirm(`Take all ${ids.length} truck${ids.length === 1 ? '' : 's'} off the map and stop their location sharing? (Your truck list is kept.)`)) return;
            try {
                const patch = {}; ids.forEach(id => { patch[id] = increment(1); });
                await setDoc(doc(db, 'config', 'metrics'), { stopRequests: patch }, { merge: true });
                await Promise.all(ids.map(id => deleteDoc(doc(db, 'active_fleet', id))));
                errEl.textContent = '';
            } catch (e) { errEl.textContent = 'Could not clear the map. Check your connection.'; }
        }
        const pick = () => { const id = $('stop-select').value; if (!id) errEl.textContent = 'Pick a truck first.'; return id; };
        $('stop-btn').onclick = () => { const id = pick(); if (!id) return; fleet[id] ? stopTruck(id) : (errEl.textContent = truckName(id) + ' isn\'t sharing its location right now.'); };
        $('delete-btn').onclick = () => { const id = pick(); if (id) deleteTruck(id); };
        $('clear-all-btn').onclick = clearAll;

                sel.appendChild(o);
