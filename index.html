<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet & Dispatch</title>
    <style>
        :root { --primary: #0f172a; --accent: #2563eb; --bg: #f8fafc; --card: #ffffff; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: var(--bg); color: #1e293b; }
        .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
        .panel { background: var(--card); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        input, select, button.action-btn { width: 100%; padding: 12px; margin: 8px 0 16px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; background-color: #fff; }
        button.action-btn { background: var(--accent); color: white; font-weight: bold; border: none; cursor: pointer; }
        button.link-btn { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 14px; padding: 0; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 10px; }
        .topbar small { color: #64748b; word-break: break-all; }
        .err { color: #dc2626; font-weight: 600; text-align: center; min-height: 1.2em; }
        #admin-map { height: 380px; width: 100%; border-radius: 8px; margin-bottom: 20px; }
        .card { background: #f1f5f9; padding: 12px 16px; border-left: 4px solid var(--accent); margin-bottom: 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .badge { background: #dbeafe; color: #1e40af; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; white-space: nowrap; }
        .share-box { background: #e2e8f0; padding: 12px; border-radius: 6px; margin-bottom: 20px; word-break: break-all; }
        .truck-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #fff; border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 6px; cursor: pointer; }
        .truck-item:hover { background: #f8fafc; border-color: var(--accent); }

        /* ---------- CUSTOMER THEME ---------- */
        body.customer-theme {
            background: linear-gradient(180deg, #ffe3ef 0%, #e0f7ff 55%, #fff6dc 100%);
            background-attachment: fixed;
            font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
            min-height: 100vh;
        }
        .c-wrap { max-width: 520px; margin: 0 auto; padding: 24px 16px 48px; position: relative; overflow: hidden; }
        .c-hero { text-align: center; position: relative; padding-top: 8px; }
        .c-hero h1 { margin: 6px 0 4px; font-size: 2rem; color: #d6336c; text-shadow: 2px 2px 0 #fff; letter-spacing: .5px; }
        .c-hero p { margin: 0 auto 8px; color: #5b6b86; max-width: 360px; }
        .c-art { display: flex; justify-content: center; align-items: flex-end; gap: 18px; height: 150px; }
        .c-art svg { height: 140px; width: auto; filter: drop-shadow(0 6px 6px rgba(0,0,0,.12)); }
        .c-art .cone { animation: bob 3.2s ease-in-out infinite; }
        .c-art .slush { animation: bob 3.2s ease-in-out infinite .8s; }
        @keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
        .sprinkle { position: absolute; width: 10px; height: 4px; border-radius: 3px; opacity: .85; animation: fall 7s linear infinite; }
        @keyframes fall { from { transform: translateY(-20px) rotate(0); } to { transform: translateY(520px) rotate(360deg); } }
        .c-card { background: rgba(255,255,255,.92); border: 3px dashed #ffb3cf; border-radius: 22px; padding: 22px 20px 18px; margin-top: 10px; box-shadow: 0 10px 24px rgba(214,51,108,.15); position: relative; }
        .c-card label { font-weight: 700; color: #7a3b57; font-size: 14px; }
        .c-card input { border: 2px solid #ffd0e1; border-radius: 14px; background: #fffafc; }
        .c-card input:focus { outline: none; border-color: #ff6fa5; box-shadow: 0 0 0 3px rgba(255,111,165,.2); }
        .c-card .action-btn { background: linear-gradient(135deg, #ff6fa5, #ff8e53); border-radius: 999px; font-size: 18px; padding: 14px; box-shadow: 0 6px 0 #d6336c; margin-bottom: 14px; transition: transform .08s, box-shadow .08s; }
        .c-card .action-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #d6336c; }
        .c-status { text-align: center; font-weight: 700; min-height: 1.4em; margin: 0; }
        .c-wave { display: block; width: 100%; height: 36px; margin-top: 26px; }

        .staff-link { display: block; text-align: center; font-size: 12px; color: #a78bab; margin-top: 4px; text-decoration: none; }
        .staff-link:hover { text-decoration: underline; }

        @media (prefers-reduced-motion: reduce) { .c-art svg, .sprinkle { animation: none; } }
    </style>
</head>
<body>

<div id="app"></div>

<!-- ============ TEMPLATES (only the one for the visitor's role is ever inserted) ============ -->

<template id="tpl-customer">
    <div class="c-wrap">
        <div class="c-hero">
            <div class="c-art" aria-hidden="true">
                <!-- Ice cream cone -->
                <svg class="cone" viewBox="0 0 120 170" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="28,86 92,86 60,160" fill="#e8a954"/>
                    <path d="M40,92 L74,128 M52,90 L82,118 M64,88 L88,106 M80,92 L46,126 M68,90 L38,114 M56,90 L34,104" stroke="#c98532" stroke-width="2.5" fill="none"/>
                    <circle cx="60" cy="72" r="34" fill="#ff8fb1"/>
                    <path d="M26,76 q4,18 9,6 q4,16 10,2 q5,14 10,0 q5,12 10,0 q5,14 10,-1 q5,12 9,-4 q5,10 8,-3 L94,76 Z" fill="#ff8fb1"/>
                    <circle cx="60" cy="46" r="27" fill="#9be7d0"/>
                    <circle cx="48" cy="40" r="3" fill="#fff" opacity=".6"/>
                    <rect x="52" y="56" width="10" height="4" rx="2" fill="#ffd43b" transform="rotate(25 57 58)"/>
                    <rect x="66" y="42" width="10" height="4" rx="2" fill="#ff6b6b" transform="rotate(-30 71 44)"/>
                    <rect x="44" y="64" width="10" height="4" rx="2" fill="#4dabf7" transform="rotate(-15 49 66)"/>
                    <path d="M60,22 q8,-14 18,-10" stroke="#5c940d" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <circle cx="60" cy="24" r="8" fill="#e03131"/>
                </svg>
                <!-- Slushie cup -->
                <svg class="slush" viewBox="0 0 120 170" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="slushGrad" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0" stop-color="#4dd0ff"/><stop offset="1" stop-color="#b197fc"/>
                        </linearGradient>
                    </defs>
                    <line x1="68" y1="40" x2="88" y2="4" stroke="#ff4d6d" stroke-width="8" stroke-linecap="round"/>
                    <line x1="68" y1="40" x2="88" y2="4" stroke="#fff" stroke-width="2.5" stroke-dasharray="6 9" stroke-linecap="round"/>
                    <path d="M20,66 Q26,26 60,28 Q94,26 100,66 Z" fill="url(#slushGrad)"/>
                    <circle cx="44" cy="42" r="4" fill="#fff" opacity=".55"/>
                    <circle cx="70" cy="38" r="3" fill="#fff" opacity=".55"/>
                    <path d="M22,64 L98,64 L90,156 Q60,166 30,156 Z" fill="#ffffff" fill-opacity=".75" stroke="#ffadc9" stroke-width="3"/>
                    <path d="M26,90 L94,90 L91,126 L29,126 Z" fill="#ff6fa5" opacity=".85"/>
                    <path d="M26,70 L94,70 L92,96 Q60,104 28,96 Z" fill="url(#slushGrad)" opacity=".9"/>
                    <circle cx="60" cy="108" r="12" fill="#fff"/>
                    <path d="M60,100 l2.5,5 5.5,.8 -4,3.9 1,5.5 -5,-2.7 -5,2.7 1,-5.5 -4,-3.9 5.5,-.8 z" fill="#ffd43b"/>
                </svg>
            </div>
            <h1>Treat Stop!</h1>
            <p>Tell us when you'd like us to roll up. Ice cream and slushies on the way 🍦🧊</p>
        </div>

        <div class="c-card">
            <label for="cust-party">How many in your party?</label>
            <input type="number" id="cust-party" placeholder="e.g., 4" min="1" max="100" inputmode="numeric">

            <label for="cust-time">When should we arrive?</label>
            <input type="time" id="cust-time">

            <label for="cust-notes">Where can we find you? (optional)</label>
            <input type="text" id="cust-notes" placeholder="e.g., North entrance near patio" maxlength="200">

            <button class="action-btn" id="cust-submit">Send Request 🍧</button>
            <p class="c-status" id="cust-status" role="status"></p>
        </div>

        <svg class="c-wave" viewBox="0 0 500 36" preserveAspectRatio="none" aria-hidden="true">
            <path d="M0,18 Q31,0 62,18 T125,18 T187,18 T250,18 T312,18 T375,18 T437,18 T500,18 V36 H0 Z" fill="#ffb3cf" opacity=".6"/>
        </svg>
        <a class="staff-link" href="#staff">Staff login</a>
    </div>
</template>

<template id="tpl-login">
    <div class="container">
        <div class="panel" style="max-width:420px; margin:40px auto;">
            <h2 id="login-title">Staff Sign In</h2>
            <label for="login-email">Email</label>
            <input type="email" id="login-email" autocomplete="username">
            <label for="login-pass">Password</label>
            <input type="password" id="login-pass" autocomplete="current-password">
            <button class="action-btn" id="login-btn">Sign In</button>
            <p class="err" id="login-err"></p>
            <a class="link-btn" href="#customer" style="display:block; text-align:center; text-decoration:none;">← Back to customer page</a>
        </div>
    </div>
</template>

<template id="tpl-driver">
    <div class="container">
        <div class="panel">
            <div class="topbar">
                <small id="driver-who"></small>
                <span>
                    <button class="link-btn" id="driver-to-admin" style="display:none; margin-right:12px;">Admin console</button>
                    <button class="link-btn" id="driver-logout">Sign out</button>
                </span>
            </div>
            <h2>Driver GPS Beacon</h2>
            <p style="color:#64748b;">Select your driver slot to broadcast your position to dispatch.</p>

            <label>Select Your Vehicle / Driver Profile</label>
            <select id="driver-id">
                <option value="">-- Choose Driver (1 to 5) --</option>
                <option value="Driver 1">Driver 1 (Truck 101)</option>
                <option value="Driver 2">Driver 2 (Truck 102)</option>
                <option value="Driver 3">Driver 3 (Truck 103)</option>
                <option value="Driver 4">Driver 4 (Truck 104)</option>
                <option value="Driver 5">Driver 5 (Truck 105)</option>
            </select>

            <button class="action-btn" id="gps-btn">Start Transmitting Location</button>
            <p id="driver-status" style="font-weight:600; text-align:center;">Status: Offline</p>
        </div>
    </div>
</template>

<template id="tpl-admin">
    <div class="container">
        <div class="panel">
            <div class="topbar">
                <small id="admin-who"></small>
                <span>
                    <button class="link-btn" id="admin-to-driver" style="margin-right:12px;">Driver mode</button>
                    <button class="link-btn" id="admin-logout">Sign out</button>
                </span>
            </div>
            <h2>Fleet Dispatch Map</h2>

            <div class="share-box">
                <strong>🔗 Shareable Portal Links for Your Team:</strong>
                <p style="margin:6px 0 2px; font-size:13px;"><strong>Customer Link (no login):</strong> <span id="link-customer"></span></p>
                <p style="margin:2px 0 0; font-size:13px;"><strong>Staff Login Link (drivers &amp; admin):</strong> <span id="link-driver"></span></p>
            </div>

            <div id="admin-map"></div>

            <h3>Active Fleet Vehicles (<span id="truck-count">0</span> / 5)</h3>
            <div id="admin-trucks-list" style="margin-bottom:24px;"><em>No active trucks currently transmitting.</em></div>

            <h3>Active Customer Requests</h3>
            <div id="admin-pings-list"><em>Listening for incoming customer pings...</em></div>
            <p class="err" id="admin-err"></p>
        </div>
    </div>
</template>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc, setDoc, deleteDoc, doc, onSnapshot, getDocs, serverTimestamp, query, orderBy, limit }
        from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
        from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDYvkoarsvnosLCvjsTRSgjmxgfyF_d3Uc",
        authDomain: "dads-fleet-tracker.firebaseapp.com",
        projectId: "dads-fleet-tracker",
        storageBucket: "dads-fleet-tracker.firebasestorage.app",
        messagingSenderId: "44787930426",
        appId: "1:44787930426:web:db1b59a767e5ae71aeec03"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const $app = document.getElementById('app');
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    // Mount ONLY one template at a time; the others never enter the page.
    function mount(id) {
        $app.innerHTML = '';
        $app.appendChild(document.getElementById(id).content.cloneNode(true));
    }

    // Teardown hooks so signing out fully clears a panel
    let cleanup = () => {};

    // ---------- ROUTING ----------
    const params = new URLSearchParams(window.location.search);
    const role = params.get('role') || params.get('view') || 'customer';
    const baseUrl = window.location.origin + window.location.pathname;

    let authUnsub = null;

    // Customers see the ice cream page. "#staff" (or the old ?role=driver / ?role=admin links)
    // opens the single staff sign-in. The hash is handled in the browser, so hosts can't strip it.
    function route() {
        cleanup(); cleanup = () => {};
        if (authUnsub) { authUnsub(); authUnsub = null; }
        const wantsStaff = location.hash === '#staff' || role === 'driver' || role === 'admin';
        if (wantsStaff && location.hash !== '#customer') {
            document.body.classList.remove('customer-theme');
            startStaffFlow();
        } else {
            startCustomer();
        }
    }
    window.addEventListener('hashchange', () => {
        if (location.hash === '#customer') history.replaceState(null, '', location.pathname);
        route();
    });
    route();

    // ---------- CUSTOMER (no login) ----------
    function startCustomer() {
        document.body.classList.add('customer-theme');
        mount('tpl-customer');

        // sprinkles
        const wrap = document.querySelector('.c-wrap');
        const colors = ['#ff6b6b', '#ffd43b', '#4dabf7', '#69db7c', '#da77f2', '#ff922b'];
        for (let i = 0; i < 18; i++) {
            const s = document.createElement('span');
            s.className = 'sprinkle';
            s.style.left = Math.random() * 100 + '%';
            s.style.background = colors[i % colors.length];
            s.style.animationDelay = (-Math.random() * 7) + 's';
            s.style.animationDuration = (6 + Math.random() * 5) + 's';
            wrap.appendChild(s);
        }

        document.getElementById('cust-submit').onclick = async () => {
            const party = parseInt(document.getElementById('cust-party').value, 10);
            const time = document.getElementById('cust-time').value;
            const notes = document.getElementById('cust-notes').value.trim().slice(0, 200);
            const statusEl = document.getElementById('cust-status');

            if (!party || party < 1 || party > 100 || !time) {
                statusEl.style.color = '#d6336c';
                statusEl.textContent = 'Please enter your party size and a time 🍦';
                return;
            }
            try {
                await addDoc(collection(db, 'customer_requests'), {
                    partySize: party,
                    requestedTime: time,
                    notes: notes || 'None',
                    status: 'Pending',
                    createdAt: serverTimestamp()
                });
                statusEl.style.color = '#2b8a3e';
                statusEl.textContent = "Request sent! We'll see you soon 🍧";
                document.getElementById('cust-party').value = '';
                document.getElementById('cust-notes').value = '';
            } catch (err) {
                statusEl.style.color = '#d6336c';
                statusEl.textContent = "Hmm, that didn't go through. Check your connection and try again.";
            }
        };
    }

    // ---------- STAFF (driver / admin) ----------
    // The database rules decide who is an admin: only an admin is allowed to read customer requests.
    async function checkAdmin() {
        try { await getDocs(query(collection(db, 'customer_requests'), limit(1))); return true; }
        catch (e) { return false; }
    }

    function startStaffFlow() {
        authUnsub = onAuthStateChanged(auth, async (user) => {
            cleanup(); cleanup = () => {};
            if (!user) { showLogin(); return; }
            const isAdmin = await checkAdmin();
            if (auth.currentUser !== user) return;
            if (isAdmin) showAdmin(user); else showDriver(user, false);
        });
    }

    function showLogin() {
        mount('tpl-login');
        const errEl = document.getElementById('login-err');
        const go = async () => {
            errEl.textContent = '';
            try {
                await signInWithEmailAndPassword(auth,
                    document.getElementById('login-email').value.trim(),
                    document.getElementById('login-pass').value);
            } catch (e) {
                errEl.textContent = 'Sign-in failed. Check your email and password.';
            }
        };
        document.getElementById('login-btn').onclick = go;
        document.getElementById('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    }

    // ---------- DRIVER ----------
    function showDriver(user, canSeeAdmin) {
        mount('tpl-driver');
        document.getElementById('driver-who').textContent = 'Signed in as ' + user.email;
        const toAdmin = document.getElementById('driver-to-admin');
        if (canSeeAdmin) {
            toAdmin.style.display = '';
            toAdmin.onclick = async () => { await stopTracking(); showAdmin(user); };
        }

        let tracking = false, watchId = null, lastGpsSend = 0, activeId = null;
        const vehicleSelect = document.getElementById('driver-id');
        const statusEl = document.getElementById('driver-status');
        const btn = document.getElementById('gps-btn');

        async function stopTracking() {
            if (!tracking) return;
            tracking = false;
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            watchId = null;
            vehicleSelect.disabled = false;
            btn.textContent = 'Start Transmitting Location';
            btn.style.background = '';
            statusEl.textContent = 'Status: Offline';
            if (activeId) { try { await deleteDoc(doc(db, 'active_fleet', activeId)); } catch (e) {} }
            activeId = null;
        }

        btn.onclick = () => {
            const vehicleId = vehicleSelect.value;
            if (!vehicleId) { alert('Please select your Driver slot (Driver 1 through 5).'); return; }

            if (tracking) { stopTracking(); return; }
            if (!('geolocation' in navigator)) { alert('Geolocation is not supported by your browser.'); return; }

            tracking = true;
            activeId = vehicleId;
            lastGpsSend = 0;
            vehicleSelect.disabled = true;
            btn.textContent = 'Stop Transmitting Location';
            btn.style.background = '#dc2626';
            statusEl.textContent = 'Connecting to Satellite GPS...';

            watchId = navigator.geolocation.watchPosition(async (pos) => {
                const now = Date.now();
                const { latitude: lat, longitude: lng } = pos.coords;
                const accuracy = Math.round(pos.coords.accuracy);

                if (accuracy > 150) { statusEl.textContent = `Acquiring Satellite Lock... (+/- ${accuracy}m)`; return; }
                statusEl.textContent = `GPS Active (${vehicleId}): Lat ${lat.toFixed(4)}, Lng ${lng.toFixed(4)} (+/- ${accuracy}m)`;

                if (now - lastGpsSend > 25000) {
                    lastGpsSend = now;
                    try {
                        await setDoc(doc(db, 'active_fleet', vehicleId), {
                            lat, lng, vehicleId, accuracy, lastUpdated: serverTimestamp()
                        });
                    } catch (e) {
                        statusEl.textContent = 'Could not send location: this account may not be approved as a driver.';
                    }
                }
            }, (err) => {
                statusEl.textContent = 'GPS Error: ' + err.message;
            }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
        };

        document.getElementById('driver-logout').onclick = async () => {
            await stopTracking();
            await signOut(auth);
        };

        cleanup = () => { stopTracking(); };
    }

    // ---------- ADMIN ----------
    function loadLeaflet() {
        if (window.L) return Promise.resolve();
        return new Promise((resolve, reject) => {
            const css = document.createElement('link');
            css.rel = 'stylesheet';
            css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
            document.head.appendChild(css);
            const js = document.createElement('script');
            js.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
            js.onload = resolve; js.onerror = reject;
            document.head.appendChild(js);
        });
    }

    async function showAdmin(user) {
        mount('tpl-admin');
        document.getElementById('admin-who').textContent = 'Signed in as ' + user.email;
        document.getElementById('link-customer').textContent = baseUrl;
        document.getElementById('link-driver').textContent = baseUrl + '#staff';
        document.getElementById('admin-logout').onclick = () => signOut(auth);
        document.getElementById('admin-to-driver').onclick = () => { cleanup(); cleanup = () => {}; showDriver(user, true); };

        const errEl = document.getElementById('admin-err');
        try { await loadLeaflet(); } catch (e) { errEl.textContent = 'Could not load the map library.'; return; }

        const map = L.map('admin-map').setView([37.7749, -122.4194], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
        setTimeout(() => map.invalidateSize(), 300);

        const markers = {};
        let fleet = {};
        let firstFit = true;

        function denied() {
            errEl.textContent = 'This account does not have admin access. Signing out…';
            setTimeout(() => signOut(auth), 2500);
        }

        function renderFleet() {
            const listEl = document.getElementById('admin-trucks-list');
            const ids = Object.keys(fleet).sort();
            document.getElementById('truck-count').textContent = ids.length;
            listEl.innerHTML = '';

            // remove markers for trucks that went offline
            Object.keys(markers).forEach(id => {
                if (!fleet[id]) { map.removeLayer(markers[id]); delete markers[id]; }
            });

            if (!ids.length) { listEl.innerHTML = '<em>No active trucks currently transmitting.</em>'; return; }

            const bounds = [];
            ids.forEach(id => {
                const d = fleet[id];
                if (typeof d.lat !== 'number' || typeof d.lng !== 'number') return;
                const coords = [d.lat, d.lng];
                bounds.push(coords);
                const acc = d.accuracy || '?';

                if (markers[id]) markers[id].setLatLng(coords);
                else markers[id] = L.marker(coords).addTo(map);
                markers[id].bindPopup(`<b>🚚 ${esc(id)}</b><br>Accuracy: +/- ${esc(acc)}m`);

                const ageMs = d.lastUpdated ? Date.now() - d.lastUpdated.toMillis() : 0;
                const stale = ageMs > 120000;

                const item = document.createElement('div');
                item.className = 'truck-item';
                item.innerHTML = `
                    <div>
                        <strong>🚚 ${esc(id)}</strong><br>
                        <small style="color:#64748b;">Lat: ${d.lat.toFixed(4)}, Lng: ${d.lng.toFixed(4)} (+/- ${esc(acc)}m)</small>
                    </div>
                    <span class="badge" style="${stale ? 'background:#fef3c7;color:#92400e;' : 'background:#dcfce7;color:#166534;'}">${stale ? 'Stale' : 'Online'}</span>`;
                item.onclick = () => { map.setView(coords, 15); markers[id].openPopup(); };
                listEl.appendChild(item);
            });

            if (firstFit && bounds.length) {
                map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
                firstFit = false;
            }
        }

        const unsubFleet = onSnapshot(collection(db, 'active_fleet'), (snap) => {
            fleet = {};
            snap.forEach(d => { fleet[d.id] = d.data(); });
            renderFleet();
        }, denied);

        const staleTimer = setInterval(renderFleet, 30000);

        const pingsQuery = query(collection(db, 'customer_requests'), orderBy('createdAt', 'desc'), limit(10));
        const unsubPings = onSnapshot(pingsQuery, (snap) => {
            const listEl = document.getElementById('admin-pings-list');
            listEl.innerHTML = '';
            if (snap.empty) { listEl.innerHTML = '<em>No active requests at the moment.</em>'; return; }
            snap.forEach(docSnap => {
                const d = docSnap.data();
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <strong>Party of ${esc(d.partySize)}</strong> — Target: ${esc(d.requestedTime)}<br>
                        <small style="color:#64748b;">Notes: ${esc(d.notes)}</small>
                    </div>
                    <span class="badge">${esc(d.status)}</span>`;
                listEl.appendChild(card);
            });
        }, denied);

        cleanup = () => { unsubFleet(); unsubPings(); clearInterval(staleTimer); map.remove(); };
    }
</script>
</body>
</html>
