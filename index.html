<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet & Dispatch</title>
    <!-- Home-screen app setup -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff6fa5">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Dispatch">
    <script>
        // Android/Chrome announces "this can be installed" very early; keep it for the popup.
        window.__installPrompt = null;
        window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__installPrompt = e; document.dispatchEvent(new Event('install-ready')); });
    </script>
    <style>
        :root { --primary: #0f172a; --accent: #2563eb; --bg: #f8fafc; --card: #ffffff; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: var(--bg); color: #1e293b; }
        .container { max-width: 960px; margin: 20px auto; padding: 0 15px; }
        .panel { background: var(--card); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        input, select, button.action-btn { width: 100%; padding: 12px; margin: 8px 0 16px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; background-color: #fff; }
        input[type=checkbox] { width: auto; margin: 0 8px 0 0; }
        button.action-btn { background: var(--accent); color: white; font-weight: bold; border: none; cursor: pointer; }
        button.link-btn { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 14px; padding: 0; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 10px; }
        .topbar small { color: #64748b; word-break: break-all; }
        .err { color: #dc2626; font-weight: 600; text-align: center; min-height: 1.2em; }
        h3 { margin: 22px 0 8px; }
        #admin-map { height: 400px; width: 100%; border-radius: 8px; margin-bottom: 16px; }
        .card { background: #f1f5f9; padding: 12px 16px; border-left: 4px solid var(--accent); margin-bottom: 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .badge { background: #dbeafe; color: #1e40af; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; white-space: nowrap; }
        .badge.on { background: #dcfce7; color: #166534; }
        .badge.stale { background: #fef3c7; color: #92400e; }
        .badge.off { background: #e2e8f0; color: #475569; }
        .share-box { background: #e2e8f0; padding: 12px; border-radius: 6px; margin-bottom: 16px; word-break: break-all; font-size: 13px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 12px 0; }
        .stat { background: #f1f5f9; border-radius: 10px; padding: 12px; text-align: center; }
        .stat b { display: block; font-size: 22px; }
        .stat span { font-size: 12px; color: #64748b; }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
        .chip { border: 1px solid #cbd5e1; background: #fff; border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
        .chip:hover { border-color: var(--accent); color: var(--accent); }
        .city-head { margin: 14px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: #64748b; }
        .tcard { border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; margin-bottom: 8px; cursor: pointer; background: #fff; }
        .tcard:hover { border-color: var(--accent); }
        .tcard .row { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }
        .metrics { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 6px; font-size: 13px; color: #334155; }
        .muted { color: #64748b; font-size: 13px; }
        .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
        .tbl th, .tbl td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #e2e8f0; }
        .inline-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; align-items: end; }
        .inline-form input, .inline-form select { margin: 4px 0 0; }
        .inline-form button.action-btn { margin: 4px 0 0; }
        .toggle { display: flex; align-items: center; margin: 6px 0; }
        .req-card { background: #eff6ff; border: 1px solid #93c5fd; border-radius: 10px; padding: 10px 12px; margin: 8px 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .install-sheet { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 9999; padding: 12px; }
        .install-card { background: #fff; border-radius: 18px; padding: 16px; width: 100%; max-width: 440px; box-shadow: 0 -6px 30px rgba(0,0,0,.25); margin-bottom: env(safe-area-inset-bottom); }
        .install-card ol { margin: 6px 0 0; padding-left: 20px; }
        .install-card li { margin: 4px 0; }
        .loc-help { background: #fff7ed; border: 1px solid #fdba74; border-radius: 10px; padding: 12px 14px; margin: 4px 0 12px; font-size: 14px; color: #431407; }
        .loc-help h4 { margin: 0 0 6px; font-size: 15px; }
        .loc-help ol { margin: 6px 0 8px; padding-left: 20px; }
        .loc-help li { margin: 3px 0; }
        .pin-input { font-size: 28px; letter-spacing: 12px; text-align: center; }
        .pin-input::placeholder { letter-spacing: 6px; }
        .stopbar { background: #fef2f2; border: 1px solid #fecaca; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
        .pop-stop { margin-top: 6px; background: #dc2626; color: #fff; border: none; border-radius: 6px; padding: 6px 10px; font-weight: 600; cursor: pointer; }
        .link-btn.stop-link { color: #dc2626; }
        details { border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px 14px; margin-top: 14px; }
        summary { cursor: pointer; font-weight: 700; }

        /* ---------- CUSTOMER THEME ---------- */
        body.customer-theme {
            background: linear-gradient(180deg, #ffe3ef 0%, #e0f7ff 55%, #fff6dc 100%);
            background-attachment: fixed;
            font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
            min-height: 100vh;
        }
        .c-wrap { max-width: 520px; margin: 0 auto; padding: 24px 16px 48px; position: relative; overflow: hidden; }
        .c-hero { text-align: center; position: relative; padding-top: 8px; }
        .c-hero h1 { margin: 6px 0 4px; font-size: 2rem; color: #d6336c; text-shadow: 2px 2px 0 #fff; letter-spacing: .5px; }
        .c-hero p { margin: 0 auto 8px; color: #5b6b86; max-width: 360px; }
        .c-art { display: flex; justify-content: center; align-items: flex-end; gap: 18px; height: 150px; }
        .c-art svg { height: 140px; width: auto; filter: drop-shadow(0 6px 6px rgba(0,0,0,.12)); }
        .c-art .cone { animation: bob 3.2s ease-in-out infinite; }
        .c-art .slush { animation: bob 3.2s ease-in-out infinite .8s; }
        @keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
        .sprinkle { position: absolute; width: 10px; height: 4px; border-radius: 3px; opacity: .85; animation: fall 7s linear infinite; }
        @keyframes fall { from { transform: translateY(-20px) rotate(0); } to { transform: translateY(520px) rotate(360deg); } }
        .c-card { background: rgba(255,255,255,.92); border: 3px dashed #ffb3cf; border-radius: 22px; padding: 22px 20px 18px; margin-top: 10px; box-shadow: 0 10px 24px rgba(214,51,108,.15); position: relative; }
        .c-card label { font-weight: 700; color: #7a3b57; font-size: 14px; }
        .c-card input { border: 2px solid #ffd0e1; border-radius: 14px; background: #fffafc; }
        .c-card input:focus { outline: none; border-color: #ff6fa5; box-shadow: 0 0 0 3px rgba(255,111,165,.2); }
        .c-card .action-btn { background: linear-gradient(135deg, #ff6fa5, #ff8e53); border-radius: 999px; font-size: 18px; padding: 14px; box-shadow: 0 6px 0 #d6336c; margin-bottom: 14px; transition: transform .08s, box-shadow .08s; }
        .c-card .action-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #d6336c; }
        .c-status { text-align: center; font-weight: 700; min-height: 1.4em; margin: 0; }
        .c-wave { display: block; width: 100%; height: 36px; margin-top: 26px; }
        .staff-link { display: block; text-align: center; font-size: 12px; color: #a78bab; margin-top: 4px; text-decoration: none; }
        .staff-link:hover { text-decoration: underline; }

        @media (prefers-reduced-motion: reduce) { .c-art svg, .sprinkle { animation: none; } }
    </style>
</head>
<body>

<div id="app"></div>

<!-- "Add to home screen" popup (staff pages only) -->
<div id="install-sheet" class="install-sheet" style="display:none;" role="dialog" aria-labelledby="install-title">
    <div class="install-card">
        <div style="display:flex; gap:12px; align-items:center;">
            <img src="icon-192.png" alt="" width="52" height="52" style="border-radius:12px;">
            <div>
                <strong id="install-title" style="font-size:17px;">Add Dispatch to your home screen?</strong>
                <div class="muted" style="font-size:13px;">Opens like an app, full screen, always the newest version.</div>
            </div>
        </div>
        <div id="install-body" style="margin-top:10px; font-size:14px;"></div>
        <div style="display:flex; gap:10px; margin-top:12px;">
            <button class="action-btn" id="install-later" style="margin:0; background:#e2e8f0; color:#0f172a;">Not now</button>
            <button class="action-btn" id="install-go" style="margin:0;">Add</button>
        </div>
    </div>
</div>

<!-- ============ TEMPLATES (only the one for the visitor is ever inserted) ============ -->

<template id="tpl-customer">
    <div class="c-wrap">
        <div class="c-hero">
            <div class="c-art" aria-hidden="true">
                <svg class="cone" viewBox="0 0 120 170" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="28,86 92,86 60,160" fill="#e8a954"/>
                    <path d="M40,92 L74,128 M52,90 L82,118 M64,88 L88,106 M80,92 L46,126 M68,90 L38,114 M56,90 L34,104" stroke="#c98532" stroke-width="2.5" fill="none"/>
                    <circle cx="60" cy="72" r="34" fill="#ff8fb1"/>
                    <path d="M26,76 q4,18 9,6 q4,16 10,2 q5,14 10,0 q5,12 10,0 q5,14 10,-1 q5,12 9,-4 q5,10 8,-3 L94,76 Z" fill="#ff8fb1"/>
                    <circle cx="60" cy="46" r="27" fill="#9be7d0"/>
                    <circle cx="48" cy="40" r="3" fill="#fff" opacity=".6"/>
                    <rect x="52" y="56" width="10" height="4" rx="2" fill="#ffd43b" transform="rotate(25 57 58)"/>
                    <rect x="66" y="42" width="10" height="4" rx="2" fill="#ff6b6b" transform="rotate(-30 71 44)"/>
                    <rect x="44" y="64" width="10" height="4" rx="2" fill="#4dabf7" transform="rotate(-15 49 66)"/>
                    <path d="M60,22 q8,-14 18,-10" stroke="#5c940d" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <circle cx="60" cy="24" r="8" fill="#e03131"/>
                </svg>
                <svg class="slush" viewBox="0 0 120 170" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="slushGrad" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0" stop-color="#4dd0ff"/><stop offset="1" stop-color="#b197fc"/>
                        </linearGradient>
                    </defs>
                    <line x1="68" y1="40" x2="88" y2="4" stroke="#ff4d6d" stroke-width="8" stroke-linecap="round"/>
                    <line x1="68" y1="40" x2="88" y2="4" stroke="#fff" stroke-width="2.5" stroke-dasharray="6 9" stroke-linecap="round"/>
                    <path d="M20,66 Q26,26 60,28 Q94,26 100,66 Z" fill="url(#slushGrad)"/>
                    <circle cx="44" cy="42" r="4" fill="#fff" opacity=".55"/>
                    <circle cx="70" cy="38" r="3" fill="#fff" opacity=".55"/>
                    <path d="M22,64 L98,64 L90,156 Q60,166 30,156 Z" fill="#ffffff" fill-opacity=".75" stroke="#ffadc9" stroke-width="3"/>
                    <path d="M26,90 L94,90 L91,126 L29,126 Z" fill="#ff6fa5" opacity=".85"/>
                    <path d="M26,70 L94,70 L92,96 Q60,104 28,96 Z" fill="url(#slushGrad)" opacity=".9"/>
                    <circle cx="60" cy="108" r="12" fill="#fff"/>
                    <path d="M60,100 l2.5,5 5.5,.8 -4,3.9 1,5.5 -5,-2.7 -5,2.7 1,-5.5 -4,-3.9 5.5,-.8 z" fill="#ffd43b"/>
                </svg>
            </div>
            <h1>Treat Stop!</h1>
            <p>Tell us when you'd like us to roll up. Ice cream and slushies on the way 🍦🧊</p>
        </div>

        <div class="c-card">
            <label for="cust-party">How many in your party?</label>
            <input type="number" id="cust-party" placeholder="e.g., 4" min="1" max="100" inputmode="numeric">

            <label for="cust-time">When should we arrive?</label>
            <input type="time" id="cust-time">

            <label for="cust-notes">Where can we find you? (optional)</label>
            <input type="text" id="cust-notes" placeholder="e.g., North entrance near patio" maxlength="200">

            <button class="action-btn" id="cust-submit">Send Request 🍧</button>
            <p class="c-status" id="cust-status" role="status"></p>
        </div>

        <svg class="c-wave" viewBox="0 0 500 36" preserveAspectRatio="none" aria-hidden="true">
            <path d="M0,18 Q31,0 62,18 T125,18 T187,18 T250,18 T312,18 T375,18 T437,18 T500,18 V36 H0 Z" fill="#ffb3cf" opacity=".6"/>
        </svg>
        <a class="staff-link" href="#staff">Staff login</a>
    </div>
</template>

<template id="tpl-login">
    <div class="container">
        <div class="panel" style="max-width:420px; margin:40px auto;">
            <p class="muted" id="login-checking">Checking setup…</p>

            <!-- First-time setup: only shown until the admin login has been created -->
            <div id="setup-box" style="display:none;">
                <h2 style="margin-bottom:4px;">Create the admin login</h2>
                <p class="muted" style="margin-top:0;">First-time setup. Choose the username and password you'll use to open the Dispatch Console. You only do this once.</p>
                <label for="setup-user">Admin username</label>
                <input type="text" id="setup-user" placeholder="e.g., brandon" maxlength="30" autocapitalize="none" autocomplete="username">
                <label for="setup-pass">Password (at least 6 characters)</label>
                <input type="password" id="setup-pass" autocomplete="new-password">
                <label for="setup-pass2">Type the password again</label>
                <input type="password" id="setup-pass2" autocomplete="new-password">
                <button class="action-btn" id="setup-btn">Create Admin Login</button>
                <p class="err" id="setup-err"></p>
            </div>

            <div id="signin-box" style="display:none;">
                <h2>Staff Sign In</h2>
                <label for="login-pass" id="login-pass-label">Your PIN</label>
                <input type="password" id="login-pass" class="pin-input" placeholder="• • • •" inputmode="numeric" autocomplete="off">
                <label for="login-who">Who are you?</label>
                <select id="login-who"></select>
                <button class="action-btn" id="login-btn">Sign In</button>
                <p class="err" id="login-err"></p>
                <button class="link-btn" id="forgot-pin" style="display:block; margin:0 auto 10px;">Forgot your PIN?</button>
            </div>
            <button class="link-btn" id="install-link" style="display:none; margin:0 auto 10px;">📲 Add to home screen</button>
            <a class="link-btn" href="#customer" style="display:block; text-align:center; text-decoration:none;">← Back to customer page</a>
            <p class="muted" style="text-align:center; font-size:11px; margin:14px 0 0;">Version home-screen · Oct 11</p>
        </div>
    </div>
</template>

<template id="tpl-setpw">
    <div class="container">
        <div class="panel" style="max-width:420px; margin:40px auto;">
            <h2 id="setpw-title" style="margin-bottom:4px;">Choose your password</h2>
            <p class="muted" style="margin-top:0;">This is your first sign-in. Pick a password (at least 6 characters) that you'll use from now on.</p>
            <label for="setpw-1">New password</label>
            <input type="password" id="setpw-1" autocomplete="new-password">
            <label for="setpw-2">Type it again</label>
            <input type="password" id="setpw-2" autocomplete="new-password">
            <button class="action-btn" id="setpw-btn">Save Password</button>
            <p class="err" id="setpw-err"></p>
            <button class="link-btn" id="setpw-cancel" style="display:block; margin:0 auto;">Cancel and sign out</button>
        </div>
    </div>
</template>

<template id="tpl-driver">
    <div class="container" style="max-width:560px;">
        <div class="panel">
            <div class="topbar">
                <small id="driver-who"></small>
                <button class="link-btn" id="driver-logout">Sign out</button>
            </div>
            <h2 id="driver-title">Truck</h2>

            <button class="action-btn" id="gps-btn">Start Shift (share location)</button>
            <div id="loc-help" class="loc-help" style="display:none;"></div>
            <p id="driver-status" style="font-weight:600; text-align:center;">Status: Offline</p>
            <p id="stop-line" style="text-align:center; color:#475569; min-height:1.2em;"></p>
            <p class="muted" style="text-align:center; font-size:13px; margin:0 0 8px;">📱 Keep this app open on screen while you drive (phone on a charger). Location pauses if the phone locks or you switch apps.</p>

            <div id="sales-card" style="border-top:1px solid #e2e8f0; margin-top:12px; padding-top:12px;">
                <h3 style="margin:0 0 6px;">Log a sale</h3>
                <div class="inline-form">
                    <div><label for="sale-amount">Amount ($)</label>
                        <input type="number" id="sale-amount" inputmode="decimal" min="0" step="0.01" placeholder="0.00"></div>
                    <div id="items-wrap"><label for="sale-items">Items</label>
                        <input type="number" id="sale-items" inputmode="numeric" min="0" step="1" placeholder="1"></div>
                </div>
                <button class="action-btn" id="sale-btn" style="margin-top:12px;">Add Sale</button>
                <p id="sales-total" style="font-weight:600; margin:0 0 8px;"></p>
                <div id="sales-list"></div>
            </div>

            <div style="border-top:1px solid #e2e8f0; margin-top:16px; padding-top:12px; text-align:center;">
                <button class="link-btn" id="pin-request-btn">Need a new PIN? Ask dispatch</button>
                <p class="muted" id="pin-request-msg" style="margin:6px 0 0;"></p>
            </div>
        </div>
    </div>
</template>

<template id="tpl-admin">
    <div class="container">
        <div class="panel">
            <div class="topbar">
                <small id="admin-who"></small>
                <button class="link-btn" id="admin-logout">Sign out</button>
            </div>
            <h2 style="margin:4px 0;">Dispatch Console</h2>
            <p class="err" id="admin-err"></p>
            <div id="pin-requests"></div>

            <div class="stats" id="admin-stats"></div>

            <div class="chips" id="admin-chips"></div>
            <div id="admin-map"></div>

            <div class="stopbar">
                <label for="stop-select" style="font-weight:600;">Stop or delete a truck</label>
                <select id="stop-select" style="margin:4px 0 8px;"></select>
                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                    <button class="action-btn" id="stop-btn" style="width:auto; flex:1; margin:0; background:#f97316; white-space:nowrap;">Stop sharing</button>
                    <button class="action-btn" id="delete-btn" style="width:auto; flex:1; margin:0; background:#dc2626; white-space:nowrap;">Delete truck</button>
                </div>
                <button class="link-btn stop-link" id="clear-all-btn" style="margin-top:10px;">Clear all trucks off the map</button>
            </div>

            <h3 style="margin-top:6px;">Trucks</h3>
            <div id="admin-trucks-list"></div>

            <h3>Stops today</h3>
            <div id="admin-stops-list"></div>

            <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
                <h3>Customer requests</h3>
                <button class="link-btn stop-link" id="clear-requests-btn" style="display:none;">Clear all</button>
            </div>
            <div id="admin-pings-list"><em>Listening for incoming customer pings...</em></div>

            <details>
                <summary>Data &amp; update settings</summary>
                <p class="muted">Choose what drivers record. Turning something off hides it from drivers and from this page.</p>
                <label class="toggle"><input type="checkbox" id="cfg-stops"> Time spent at each stop</label>
                <label class="toggle"><input type="checkbox" id="cfg-sales"> Dollars made (drivers log each sale)</label>
                <label class="toggle"><input type="checkbox" id="cfg-items"> Items sold (with each sale)</label>
                <p class="muted" style="margin-top:12px;"><strong>Location updates:</strong> every 30 seconds while a truck is moving,
                    every 90 seconds while it's parked at a stop, and instantly when it arrives at or leaves a stop.</p>
                <button class="action-btn" id="csv-btn" style="max-width:260px;">Download today's data (CSV)</button>
            </details>

            <details id="manage-section">
                <summary>Manage trucks</summary>
                <div id="admin-manage-list" style="margin-top:8px;"></div>
                <h4 style="margin:14px 0 4px;" id="new-title">Add a truck</h4>
                <div class="inline-form">
                    <div><label for="new-num">Truck number</label><input type="number" id="new-num" min="1" max="99" inputmode="numeric" placeholder="e.g., 3"></div>
                    <div><label for="new-name">Driver name</label><input type="text" id="new-name" maxlength="30" placeholder="e.g., Mike"></div>
                    <div><label for="new-city">City</label><input type="text" id="new-city" maxlength="40" placeholder="e.g., Austin"></div>
                    <div><label for="new-pin">4-digit PIN</label><input type="text" id="new-pin" inputmode="numeric" placeholder="e.g., 4829"></div>
                    <button class="action-btn" id="new-btn">Add Truck</button>
                </div>
                <button class="link-btn" id="new-cancel" style="display:none; margin-top:8px;">Cancel editing</button>
                <p class="err" id="manage-msg"></p>
            </details>

            <details id="admins-section">
                <summary>Admins</summary>
                <p class="muted">Other people who can open this console. Pick their name and a password, then tell them the password. They sign in by choosing their name under "Who are you?". Only you can add or remove admins.</p>
                <div id="admins-list"></div>
                <div class="inline-form" style="margin-top:8px;">
                    <div><label for="new-admin-name">Name</label><input type="text" id="new-admin-name" maxlength="20" placeholder="e.g., Don"></div>
                    <div><label for="new-admin-pass">Password (6+ characters)</label><input type="text" id="new-admin-pass" maxlength="40" autocomplete="off" placeholder="e.g., icecream22"></div>
                    <button class="action-btn" id="new-admin-btn">Add Admin</button>
                </div>
                <p class="err" id="admins-msg"></p>
            </details>

            <details id="mypw-section">
                <summary>My password</summary>
                <p class="muted">Change the password you use to sign in to this console.</p>
                <div class="inline-form">
                    <div><label for="mypw-current">Current password</label><input type="password" id="mypw-current" autocomplete="current-password"></div>
                    <div><label for="mypw-new">New password (6+)</label><input type="password" id="mypw-new" autocomplete="new-password"></div>
                    <div><label for="mypw-new2">New password again</label><input type="password" id="mypw-new2" autocomplete="new-password"></div>
                    <button class="action-btn" id="mypw-btn">Change Password</button>
                </div>
                <p class="err" id="mypw-msg"></p>
            </details>

            <div class="share-box" style="margin-top:18px;">
                <strong>🔗 Links</strong>
                <p style="margin:6px 0 2px;"><strong>Customer page (no login):</strong> <span id="link-customer"></span></p>
                <p style="margin:2px 0 0;"><strong>Staff login (drivers &amp; admin):</strong> <span id="link-staff"></span></p>
            </div>
        </div>
    </div>
</template>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { initializeFirestore, collection, addDoc, setDoc, deleteDoc, doc, onSnapshot, getDoc, getDocs, increment, serverTimestamp, query, orderBy, limit, where }
        from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, updatePassword, deleteUser, EmailAuthProvider, reauthenticateWithCredential }
        from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDYvkoarsvnosLCvjsTRSgjmxgfyF_d3Uc",
        authDomain: "dads-fleet-tracker.firebaseapp.com",
        projectId: "dads-fleet-tracker",
        storageBucket: "dads-fleet-tracker.firebasestorage.app",
        messagingSenderId: "44787930426",
        appId: "1:44787930426:web:db1b59a767e5ae71aeec03"
    };

    const app = initializeApp(firebaseConfig);
    // Long polling: plain web requests instead of a streaming connection. Some phones, in-app browsers,
    // data-saver modes and ad/DNS blockers silently stall the streaming connection; this works everywhere.
    const db = initializeFirestore(app, { experimentalForceLongPolling: true });
    const auth = getAuth(app);

    // Staff type a truck number + PIN. Behind the scenes that becomes an account like truck2@dispatch.local.
    const DOMAIN = 'dispatch.local';
    const ADMIN_EMAIL = 'admin@' + DOMAIN;
    // Firebase requires logins of 6+ characters, so a 4-digit PIN is padded into a longer password.
    // (This keeps typing short for drivers; it doesn't make the PIN any harder to guess.)
    const pinPassword = (pin, truckId) => 'pin-' + pin + '-' + truckId;
    // Extra admins get accounts like admin-don-k3x9@dispatch.local; their one-time setup code is padded the same way.
    const EXTRA_ADMIN_RE = /^admin-[a-z0-9-]+@dispatch\.local$/;
    const setupPassword = (code) => 'setup-' + code;
    const DEFAULT_CONFIG = { stops: true, sales: true, items: true };
    // Location ping timing (fixed): every 30s while moving, every 90s while parked at a stop.
    const MOVING_MS = 30000, PARKED_MS = 90000;
    const STALE_MS = 4 * 60000; // no update for 4 minutes -> shown as "Stale" (phone locked, no signal, etc.)

    const $app = document.getElementById('app');
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const dayStr = (ms = Date.now()) => new Date(ms).toLocaleDateString('en-CA'); // YYYY-MM-DD, local time
    const money = (n) => '$' + Number(n || 0).toFixed(2);
    // "truck2" -> "Truck 2". Anything else (e.g. "Driver 1" left over from the original app) is shown as-is.
    const truckName = (id) => /^truck\d+$/.test(String(id)) ? 'Truck ' + String(id).slice(5) : String(id) + ' (old app)';
    const byTruckNum = (a, b) => {
        const na = /^truck\d+$/.test(a) ? parseInt(a.slice(5), 10) : NaN, nb = /^truck\d+$/.test(b) ? parseInt(b.slice(5), 10) : NaN;
        if (!isNaN(na) && !isNaN(nb)) return na - nb;
        if (!isNaN(na)) return -1; if (!isNaN(nb)) return 1;
        return String(a).localeCompare(String(b));
    };
    const fmtTime = (ms) => new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    const fmtDur = (ms) => {
        const m = Math.max(0, Math.round(ms / 60000));
        return m < 60 ? m + ' min' : Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
    };
    const fmtAge = (ms) => {
        const s = Math.round(ms / 1000);
        return s < 90 ? s + 's ago' : fmtDur(ms) + ' ago';
    };
    function loginIdFrom(input) {
        const s = String(input || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
        if (s === 'admin') return 'admin';
        if (/^\d{1,2}$/.test(s)) return 'truck' + parseInt(s, 10);
        if (/^truck\d{1,2}$/.test(s)) return 'truck' + parseInt(s.slice(5), 10);
        return null;
    }
    function distMeters(aLat, aLng, bLat, bLng) {
        const R = 6371000, rad = Math.PI / 180;
        const dLat = (bLat - aLat) * rad, dLng = (bLng - aLng) * rad;
        const h = Math.sin(dLat / 2) ** 2 + Math.cos(aLat * rad) * Math.cos(bLat * rad) * Math.sin(dLng / 2) ** 2;
        return 2 * R * Math.asin(Math.sqrt(h));
    }

    function mount(id) {
        $app.innerHTML = '';
        $app.appendChild(document.getElementById(id).content.cloneNode(true));
    }

    let cleanup = () => {};
    let authUnsub = null;
    let loginNotice = '';

    // ---------- ROUTING ----------
    const params = new URLSearchParams(window.location.search);
    const role = params.get('role') || params.get('view') || 'customer';
    const baseUrl = window.location.origin + window.location.pathname;

    // ---------- "Add to home screen" ----------
    if ('serviceWorker' in navigator && window.isSecureContext) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
    }
    const isStandalone = () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
    const UA = navigator.userAgent || '';
    const onIOS = /iPhone|iPad|iPod/i.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
    const onAndroid = /Android/i.test(UA);
    const inAppBrowser = /FBAN|FBAV|Instagram|Line\/|GSA\/|Twitter|LinkedInApp|GitHub|Snapchat|; wv\)/i.test(UA);
    let installOffered = false;

    function openInstall(force) {
        if (isStandalone()) return;
        if (!force) {
            if (installOffered) return;
            try { const t = +localStorage.getItem('installLater') || 0; if (Date.now() - t < 7 * 864e5) return; } catch (e) {}
        }
        installOffered = true;
        const sheet = document.getElementById('install-sheet'), body = document.getElementById('install-body'), go = document.getElementById('install-go');
        const prompt = window.__installPrompt;
        go.style.display = '';
        if (inAppBrowser) {
            body.innerHTML = 'You opened this inside another app, which can\'t add it to your home screen. '
                + (onIOS ? 'Tap the share / compass button and choose <strong>Open in Safari</strong>, then you\'ll see this again.'
                         : 'Tap <strong>⋮</strong> (top right) → <strong>Open in Chrome</strong>, then you\'ll see this again.');
            go.style.display = 'none';
        } else if (prompt) {
            body.innerHTML = 'Tap <strong>Add</strong>, then confirm.';
            go.textContent = 'Add';
        } else if (onIOS) {
            body.innerHTML = '<ol><li>Tap the <strong>Share</strong> button <span style="font-size:16px;">⬆️</span> (bottom of Safari, or top right in Chrome).</li>'
                + '<li>Scroll down and tap <strong>Add to Home Screen</strong>.</li><li>Tap <strong>Add</strong>.</li></ol>';
            go.textContent = 'Got it';
        } else if (onAndroid) {
            body.innerHTML = '<ol><li>Tap <strong>⋮</strong> (top right of Chrome).</li><li>Tap <strong>Add to Home screen</strong> (or <strong>Install app</strong>).</li><li>Tap <strong>Add</strong> / <strong>Install</strong>.</li></ol>';
            go.textContent = 'Got it';
        } else {
            body.innerHTML = 'In Chrome or Edge, click the <strong>install</strong> icon at the right end of the address bar, or use the browser menu → <strong>Install</strong>.';
            go.textContent = 'Got it';
        }
        const close = (later) => {
            sheet.style.display = 'none';
            if (later) { try { localStorage.setItem('installLater', String(Date.now())); } catch (e) {} }
        };
        document.getElementById('install-later').onclick = () => close(true);
        sheet.onclick = (e) => { if (e.target === sheet) close(true); };
        go.onclick = async () => {
            const p = window.__installPrompt;
            if (p && !inAppBrowser) {
                try { p.prompt(); const choice = await p.userChoice; window.__installPrompt = null; close(choice && choice.outcome !== 'accepted'); }
                catch (e) { close(false); }
            } else close(true);
        };
        sheet.style.display = '';
    }
    document.addEventListener('install-ready', () => {
        // Chrome said "installable" after the sheet was already showing manual steps: switch to the one-tap button.
        const sheet = document.getElementById('install-sheet');
        if (sheet.style.display !== 'none') { installOffered = false; openInstall(true); }
        const link = document.getElementById('install-link'); if (link && !isStandalone()) link.style.display = 'block';
    });
    window.addEventListener('appinstalled', () => {
        const sheet = document.getElementById('install-sheet'); if (sheet) sheet.style.display = 'none';
        try { localStorage.setItem('installLater', String(Date.now() + 3650 * 864e5)); } catch (e) {}
    });

    function route() {
        cleanup(); cleanup = () => {};
        if (authUnsub) { authUnsub(); authUnsub = null; }
        const wantsStaff = location.hash === '#staff' || role === 'driver' || role === 'admin';
        if (wantsStaff && location.hash !== '#customer') {
            document.body.classList.remove('customer-theme');
            startStaffFlow();
            setTimeout(() => openInstall(false), 1500);
        } else {
            startCustomer();
        }
    }
    window.addEventListener('hashchange', () => {
        if (location.hash === '#customer') history.replaceState(null, '', location.pathname);
        route();
    });
    route();

    // ---------- CUSTOMER (no login) ----------
    function startCustomer() {
        document.body.classList.add('customer-theme');
        mount('tpl-customer');

        const wrap = document.querySelector('.c-wrap');
        const colors = ['#ff6b6b', '#ffd43b', '#4dabf7', '#69db7c', '#da77f2', '#ff922b'];
        for (let i = 0; i < 18; i++) {
            const s = document.createElement('span');
            s.className = 'sprinkle';
            s.style.left = Math.random() * 100 + '%';
            s.style.background = colors[i % colors.length];
            s.style.animationDelay = (-Math.random() * 7) + 's';
            s.style.animationDuration = (6 + Math.random() * 5) + 's';
            wrap.appendChild(s);
        }

        document.getElementById('cust-submit').onclick = async () => {
            const party = parseInt(document.getElementById('cust-party').value, 10);
            const time = document.getElementById('cust-time').value;
            const notes = document.getElementById('cust-notes').value.trim().slice(0, 200);
            const statusEl = document.getElementById('cust-status');

            if (!party || party < 1 || party > 100 || !time) {
                statusEl.style.color = '#d6336c';
                statusEl.textContent = 'Please enter your party size and a time 🍦';
                return;
            }
            try {
                await addDoc(collection(db, 'customer_requests'), {
                    partySize: party,
                    requestedTime: time,
                    notes: notes || 'None',
                    status: 'Pending',
                    createdAt: serverTimestamp()
                });
                statusEl.style.color = '#2b8a3e';
                statusEl.textContent = "Request sent! We'll see you soon 🍧";
                document.getElementById('cust-party').value = '';
                document.getElementById('cust-notes').value = '';
            } catch (err) {
                statusEl.style.color = '#d6336c';
                statusEl.textContent = "Hmm, that didn't go through. Check your connection and try again.";
            }
        };
    }

    // ---------- STAFF ----------
    function startStaffFlow() {
        authUnsub = onAuthStateChanged(auth, (user) => {
            cleanup(); cleanup = () => {};
            if (!user) { showLogin(); return; }
            const local = (user.email || '').split('@')[0];
            if (user.email === ADMIN_EMAIL) { showAdmin(user, { primary: true }); }
            else if (/^truck\d{1,2}$/.test(local) && user.email === local + '@' + DOMAIN) { showDriver(user, local); }
            else if (EXTRA_ADMIN_RE.test(user.email || '')) { routeExtraAdmin(user); }
            else { loginNotice = 'That account is not set up for this app.'; signOut(auth); }
        });
    }

    // Extra admins (added by the main admin): first sign-in goes to "choose your password".
    async function routeExtraAdmin(user) {
        mount('tpl-login'); // shows "Checking setup…" briefly
        let rec;
        try { rec = await getDoc(doc(db, 'admins', user.uid)); }
        catch (e) { loginNotice = 'Couldn\'t check your admin access (no connection?). Try again.'; signOut(auth); return; }
        if (auth.currentUser !== user) return;
        if (!rec.exists()) { loginNotice = 'This admin login has been removed. Ask the main admin to add you again.'; signOut(auth); return; }
        const info = rec.data();
        if (info.pending) showSetPassword(user, info);
        else showAdmin(user, { primary: false, name: info.name });
    }

    function showSetPassword(user, info) {
        mount('tpl-setpw');
        const $ = (id) => document.getElementById(id);
        $('setpw-title').textContent = 'Welcome, ' + info.name + ' — choose your password';
        $('setpw-cancel').onclick = () => signOut(auth);
        const save = async () => {
            const e1 = $('setpw-err'); e1.textContent = '';
            const a = $('setpw-1').value, b = $('setpw-2').value;
            if (a.length < 6) { e1.textContent = 'Password must be at least 6 characters.'; return; }
            if (a !== b) { e1.textContent = 'The two passwords don\'t match.'; return; }
            $('setpw-btn').disabled = true;
            try {
                await updatePassword(user, a);
                await setDoc(doc(db, 'admins', user.uid), { pending: false }, { merge: true });
                await deleteDoc(doc(db, 'adminCodes', user.uid)).catch(() => {});
                showAdmin(user, { primary: false, name: info.name });
            } catch (e) {
                $('setpw-btn').disabled = false;
                e1.textContent = e.code === 'auth/requires-recent-login'
                    ? 'Please sign out and sign in again with your setup code, then choose your password right away.'
                    : explainAuthError(e, 'admin');
            }
        };
        $('setpw-btn').onclick = save;
        $('setpw-2').addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
    }

    // Plain-English explanations for the Firebase errors people actually hit.
    function explainAuthError(e, who) {
        const c = (e && e.code) || '';
        if (c === 'auth/operation-not-allowed' || c === 'auth/admin-restricted-operation')
            return 'Logins are switched off in Firebase. In the Firebase console go to Authentication → Sign-in method and turn on "Email/Password", then try again.';
        if (c === 'auth/invalid-credential' || c === 'auth/wrong-password' || c === 'auth/user-not-found' || c === 'auth/invalid-login-credentials')
            return who === 'admin' ? 'Wrong password.'
                : who === 'setup' ? 'That setup code doesn\'t match. Check it with the main admin (they can see it under "Admins").'
                : `Wrong PIN, or ${who} hasn't been added yet. The admin adds trucks in the Dispatch Console under "Manage trucks".`;
        if (c === 'auth/too-many-requests') return 'Too many tries. Wait a few minutes and try again.';
        if (c === 'auth/network-request-failed') return 'No internet connection. Check your signal and try again.';
        if (c === 'auth/weak-password') return 'Password must be at least 6 characters.';
        if (c === 'auth/unauthorized-domain' || c === 'auth/requests-from-referer-are-blocked' || c === 'auth/api-key-not-valid')
            return 'Firebase is blocking this website. In the Firebase console go to Authentication → Settings → Authorized domains and add ' + location.hostname + '.';
        if (c === 'auth/configuration-not-found')
            return 'Firebase Authentication isn\'t set up yet. In the Firebase console open Authentication, click "Get started", then turn on Email/Password.';
        return 'Something went wrong (' + (c || (e && e.message) || 'unknown') + ').';
    }

    async function showLogin() {
        mount('tpl-login');
        const $ = (id) => document.getElementById(id);
        const errEl = $('login-err');
        if (!isStandalone()) { $('install-link').style.display = 'block'; $('install-link').onclick = () => openInstall(true); }
        errEl.textContent = loginNotice; loginNotice = '';

        // Is there an admin yet, and who's on the roster? (small public documents: admin username + truck list)
        let adminName = null, rulesProblem = false, timedOut = false, roster = null, extraAdmins = [];
        try {
            const [snap, trucksSnap, adminsSnap] = await Promise.race([
                Promise.all([getDoc(doc(db, 'setup', 'admin')), getDocs(collection(db, 'trucks')), getDocs(collection(db, 'admins'))]),
                new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), 8000))
            ]);
            adminName = snap.exists() ? String(snap.data().username || '') : null;
            roster = trucksSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => byTruckNum(a.id, b.id));
            extraAdmins = adminsSnap.docs.map(d => ({ uid: d.id, ...d.data() })).sort((a, b) => String(a.name).localeCompare(String(b.name)));
        } catch (e) {
            if (e && (e.code === 'timeout' || e.code === 'unavailable')) timedOut = true; else rulesProblem = true;
        }
        if (!$('login-checking')) return; // page changed while we were checking
        $('login-checking').style.display = 'none';

        if (timedOut) {
            // Never leave people stuck: let them sign in anyway, retry, or open setup by hand.
            $('signin-box').style.display = '';
            errEl.innerHTML = 'Can\'t reach the database from this device right now (weak signal, data saver, or an ad blocker). '
                + 'You can still try to sign in. <br><button class="link-btn" id="retry-btn">Try again</button> · '
                + '<button class="link-btn" id="show-setup">First-time admin setup</button>';
            $('retry-btn').onclick = () => showLogin();
            $('show-setup').onclick = () => { $('signin-box').style.display = 'none'; $('setup-box').style.display = ''; };
        } else if (rulesProblem) {
            $('signin-box').style.display = '';
            errEl.textContent = 'The database rules haven\'t been published yet. In the Firebase console go to Firestore Database → Rules, paste in firestore.rules, and click Publish.';
        } else if (!adminName) {
            $('setup-box').style.display = '';
        } else {
            $('signin-box').style.display = '';
        }

        // ----- first-time admin setup -----
        $('setup-btn').onclick = async () => {
            const sErr = $('setup-err'); sErr.textContent = '';
            const name = $('setup-user').value.trim();
            const p1 = $('setup-pass').value, p2 = $('setup-pass2').value;
            if (!/^[A-Za-z][A-Za-z0-9 ._-]{1,29}$/.test(name)) { sErr.textContent = 'Username: 2–30 characters, starting with a letter.'; return; }
            if (loginIdFrom(name)) { sErr.textContent = 'Pick a username that isn\'t a truck number.'; return; }
            if (p1.length < 6) { sErr.textContent = 'Password must be at least 6 characters.'; return; }
            if (p1 !== p2) { sErr.textContent = 'The two passwords don\'t match.'; return; }
            $('setup-btn').disabled = true;
            try {
                try {
                    await createUserWithEmailAndPassword(auth, ADMIN_EMAIL, p1);
                } catch (e) {
                    // An admin account may already exist from an earlier attempt: if the password matches, carry on.
                    if (e.code === 'auth/email-already-in-use') await signInWithEmailAndPassword(auth, ADMIN_EMAIL, p1);
                    else throw e;
                }
                await setDoc(doc(db, 'setup', 'admin'), { username: name });
                const who = document.getElementById('admin-who');
                if (who) who.textContent = 'Signed in as ' + name + ' (admin)';
            } catch (e) {
                $('setup-btn').disabled = false;
                sErr.textContent = (e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/invalid-login-credentials')
                    ? 'An admin login already exists with a different password. Delete the user "admin@dispatch.local" in Firebase console → Authentication → Users, then try again.'
                    : (e.code === 'permission-denied'
                        ? 'The database rules haven\'t been published yet (Firestore Database → Rules → paste firestore.rules → Publish).'
                        : explainAuthError(e, 'admin'));
            }
        };

        // ----- "Who are you?" dropdown: every truck/driver, then Admin -----
        const whoSel = $('login-who');
        const add = (value, text, disabled) => { const o = document.createElement('option'); o.value = value; o.textContent = text; o.disabled = !!disabled; whoSel.appendChild(o); };
        add('', '— Select your name / truck —');
        if (roster && roster.length) {
            roster.forEach(t => add(t.id, truckName(t.id) + (t.driverName ? ' — ' + t.driverName : '') + (t.city ? ' (' + t.city + ')' : '')));
        } else if (roster) {
            add('-', 'No trucks added yet (admin adds them)', true);
        } else {
            for (let n = 1; n <= 9; n++) add('truck' + n, 'Truck ' + n); // list unavailable (bad signal): plain numbers
        }
        add('admin', '🔑 ' + (adminName ? adminName + ' (admin)' : 'Admin'));
        const extraByKey = {};
        extraAdmins.forEach(a => { extraByKey['adm:' + a.uid] = a; add('adm:' + a.uid, '🔑 ' + a.name + ' (admin)' + (a.pending ? ' — first sign-in' : '')); });
        let remembered = '';
        try { remembered = localStorage.getItem('staffWho') || ''; } catch (e) {}
        if ([...whoSel.options].some(o => o.value === remembered && !o.disabled)) whoSel.value = remembered;

        // The first box is a 4-digit PIN for drivers, a password for admins, or a setup code on an admin's first sign-in.
        const isAdminPick = () => whoSel.value === 'admin' || whoSel.value.startsWith('adm:');
        const applyWho = () => {
            const admin = isAdminPick();
            const extra = extraByKey[whoSel.value];
            const p = $('login-pass');
            p.classList.toggle('pin-input', !admin);
            if (extra && extra.pending) {
                $('login-pass-label').textContent = 'Setup code (from ' + (adminName || 'the main admin') + ')';
                p.inputMode = 'numeric'; p.placeholder = '6-digit setup code';
            } else if (admin) {
                $('login-pass-label').textContent = 'Password';
                p.inputMode = 'text'; p.placeholder = 'Your password';
            } else {
                $('login-pass-label').textContent = 'Your PIN';
                p.inputMode = 'numeric'; p.placeholder = '• • • •'; p.value = p.value.replace(/\D/g, '').slice(0, 4);
            }
        };
        whoSel.onchange = () => { if (!$('retry-btn')) errEl.textContent = ''; applyWho(); };
        applyWho();

        // ----- sign in -----
        const go = async () => {
            errEl.textContent = ''; errEl.style.color = '';
            const who = whoSel.value;
            const secret = $('login-pass').value.trim();
            if (!who || who === '-') { errEl.textContent = 'Pick your name / truck from the list.'; return; }
            let email, password, label;
            if (who === 'admin') {
                if (!secret) { errEl.textContent = 'Enter the admin password.'; return; }
                email = ADMIN_EMAIL; password = secret; label = 'admin';
            } else if (extraByKey[who]) {
                const a = extraByKey[who];
                if (a.pending) {
                    if (!/^\d{6}$/.test(secret)) { errEl.textContent = 'Enter the 6-digit setup code you were given.'; return; }
                    email = a.email; password = setupPassword(secret); label = 'setup';
                } else {
                    if (!secret) { errEl.textContent = 'Enter your password.'; return; }
                    email = a.email; password = secret; label = 'admin';
                }
            } else {
                if (!/^\d{4}$/.test(secret)) { errEl.textContent = 'Enter your 4-digit PIN.'; return; }
                email = who + '@' + DOMAIN; password = pinPassword(secret, who); label = truckName(who);
            }
            $('login-btn').disabled = true;
            try {
                await signInWithEmailAndPassword(auth, email, password);
                try { localStorage.setItem('staffWho', who); } catch (e) {}
            } catch (e) { errEl.textContent = explainAuthError(e, label); $('login-btn').disabled = false; }
        };
        $('login-pass').addEventListener('input', () => {
            const p = $('login-pass'), extra = extraByKey[whoSel.value];
            if (extra && extra.pending) p.value = p.value.replace(/\D/g, '').slice(0, 6);
            else if (!isAdminPick()) p.value = p.value.replace(/\D/g, '').slice(0, 4);
        });
        $('login-btn').onclick = go;

        // Drivers can't change their own PIN: "Forgot your PIN?" sends a request to the admins.
        $('forgot-pin').onclick = async () => {
            const who = whoSel.value;
            if (isAdminPick()) { errEl.textContent = who === 'admin' ? 'Main admin: if you forgot your password, delete the user "admin@dispatch.local" in Firebase → Authentication → Users, then set up again.' : 'Ask the main admin to remove you under "Admins" and add you again with a new password.'; return; }
            if (!/^truck\d{1,2}$/.test(who)) { errEl.textContent = 'First pick your name / truck in "Who are you?", then tap "Forgot your PIN?" again.'; return; }
            try {
                await setDoc(doc(db, 'pin_requests', who), { at: serverTimestamp(), from: 'login' });
                errEl.style.color = '#16a34a';
                errEl.textContent = 'Request sent. Dispatch will see it and give you a new PIN.';
                setTimeout(() => { errEl.style.color = ''; }, 6000);
            } catch (e) { errEl.textContent = 'Could not send the request. Check your connection and try again.'; }
        };
        $('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
        $('setup-pass2').addEventListener('keydown', e => { if (e.key === 'Enter') $('setup-btn').click(); });
    }

    // ---------- DRIVER ----------
    function showDriver(user, truckId) {
        mount('tpl-driver');
        const $ = (id) => document.getElementById(id);
        $('driver-title').textContent = truckName(truckId);
        $('driver-who').textContent = 'Signed in as ' + truckName(truckId);

        // Driver name comes from the admin's truck list.
        let driverName = '';
        getDoc(doc(db, 'trucks', truckId)).then(s => {
            if (!s.exists()) return;
            driverName = String(s.data().driverName || '');
            if (driverName && $('driver-title')) {
                $('driver-title').textContent = truckName(truckId) + ' — ' + driverName;
                $('driver-who').textContent = 'Signed in as ' + driverName;
            }
        }).catch(() => {});

        const STOP_RADIUS_M = 75, STOP_MIN_MS = 120000;
        let config = { ...DEFAULT_CONFIG };
        let tracking = false, watchId = null, lastSend = 0, anchor = null, wakeLock = null;
        let lastSentParked = null, shiftToken = 0, stoppedByDispatch = false;
        const statusEl = $('driver-status'), stopLine = $('stop-line'), btn = $('gps-btn');
        const stopTokenOf = (c) => Number((c.stopRequests || {})[truckId] || 0);

        function applyConfig() {
            $('sales-card').style.display = config.sales ? '' : 'none';
            $('items-wrap').style.display = config.items ? '' : 'none';
            stopLine.style.display = config.stops ? '' : 'none';
        }
        applyConfig();
        const unsubConfig = onSnapshot(doc(db, 'config', 'metrics'), async (snap) => {
            config = { ...DEFAULT_CONFIG, ...(snap.exists() ? snap.data() : {}) };
            applyConfig();
            // Dispatch pressed "Stop" for this truck since this shift started -> stop sharing.
            if (tracking && stopTokenOf(config) !== shiftToken) {
                stoppedByDispatch = true;
                await stopTracking();
                statusEl.textContent = 'Dispatch stopped your location sharing. Tap Start Shift to share again.';
            }
        }, () => {});

        // ----- sales -----
        // Each sale is saved as its own record (for the CSV), and also added to ONE small running-total
        // document per truck per day. Screens only ever listen to the running totals, which keeps reads tiny.
        let summary = {};
        let summaryUnsub = () => {};
        let summaryDay = null;
        function watchSummary() {
            const d = dayStr();
            if (d === summaryDay) return;
            summaryUnsub();
            summaryDay = d;
            summaryUnsub = onSnapshot(doc(db, 'daily', d + '_' + truckId), (snap) => {
                summary = snap.exists() ? snap.data() : {};
                renderSales();
            }, () => {});
        }
        watchSummary();

        const recentKey = () => 'recentSales_' + truckId + '_' + dayStr();
        function loadRecent() { try { return JSON.parse(localStorage.getItem(recentKey()) || '[]'); } catch (e) { return []; } }
        function saveRecent(list) { try { localStorage.setItem(recentKey(), JSON.stringify(list.slice(0, 5))); } catch (e) {} }
        let recent = loadRecent();

        function renderSales() {
            const total = summary.sales || 0, items = summary.items || 0;
            $('sales-total').textContent = `Today: ${money(total)}` + (config.items ? ` · ${items} item${items === 1 ? '' : 's'}` : '');
            const listEl = $('sales-list');
            listEl.innerHTML = '';
            recent.forEach(s => {
                const row = document.createElement('div');
                row.className = 'card';
                row.innerHTML = `<div>${money(s.amount)}${config.items ? ' · ' + (s.items || 0) + ' item(s)' : ''}<br><small class="muted">${fmtTime(s.t)}</small></div>`;
                const rm = document.createElement('button');
                rm.className = 'link-btn'; rm.textContent = 'Remove';
                rm.onclick = async () => {
                    if (!confirm('Remove this sale?')) return;
                    try {
                        await deleteDoc(doc(db, 'sales', s.id));
                        await bumpDaily(s.day || dayStr(), { sales: -s.amount, items: -(s.items || 0), saleCount: -1 });
                        recent = recent.filter(x => x.id !== s.id); saveRecent(recent); renderSales();
                    } catch (e) { alert('Could not remove that sale. Check your connection.'); }
                };
                row.appendChild(rm);
                listEl.appendChild(row);
            });
        }

        function bumpDaily(day, delta) {
            const data = { truckId, day };
            Object.keys(delta).forEach(k => { data[k] = increment(delta[k]); });
            return setDoc(doc(db, 'daily', day + '_' + truckId), data, { merge: true });
        }

        $('sale-btn').onclick = async () => {
            const amount = Math.round(parseFloat($('sale-amount').value) * 100) / 100;
            if (!isFinite(amount) || amount < 0 || amount > 100000) { alert('Enter the sale amount.'); return; }
            const items = config.items ? Math.max(0, parseInt($('sale-items').value || '0', 10) || 0) : 0;
            const day = dayStr();
            watchSummary();
            try {
                const ref = await addDoc(collection(db, 'sales'), { truckId, amount, items, day, createdAt: serverTimestamp() });
                await bumpDaily(day, { sales: amount, items, saleCount: 1 });
                recent = loadRecent();
                recent.unshift({ id: ref.id, amount, items, day, t: Date.now() });
                saveRecent(recent); recent = recent.slice(0, 5);
                $('sale-amount').value = ''; $('sale-items').value = '';
                renderSales();
            } catch (e) { alert('Could not save that sale. Check your connection.'); }
        };

        // ----- stop detection -----
        function trackStop(lat, lng, now, acc) {
            if (acc > 100) return;
            if (!anchor) { anchor = { lat, lng, since: now }; return; }
            if (distMeters(anchor.lat, anchor.lng, lat, lng) > STOP_RADIUS_M) {
                finalizeStop(now);
                anchor = { lat, lng, since: now };
            }
        }
        async function finalizeStop(endMs) {
            if (!config.stops || !anchor || endMs - anchor.since < STOP_MIN_MS) return;
            const durationSec = Math.round((endMs - anchor.since) / 1000);
            const day = dayStr(anchor.since);
            try {
                await addDoc(collection(db, 'stops'), {
                    truckId, lat: anchor.lat, lng: anchor.lng,
                    startedAt: anchor.since, endedAt: endMs, durationSec, day
                });
                await bumpDaily(day, { stopCount: 1, stopSec: durationSec });
            } catch (e) {}
        }
        const stopSinceNow = (now) => (config.stops && anchor && now - anchor.since >= STOP_MIN_MS) ? anchor.since : null;

        // ----- keep screen awake while tracking -----
        async function lockScreen() { try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
        const onVis = () => {
            if (document.visibilityState === 'visible' && tracking) {
                lockScreen();
                statusEl.textContent = 'Welcome back — location sharing resumed.';
            }
        };
        document.addEventListener('visibilitychange', onVis);

        async function stopTracking() {
            if (!tracking) return;
            tracking = false;
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            watchId = null;
            try { if (wakeLock) await wakeLock.release(); } catch (e) {}
            wakeLock = null;
            await finalizeStop(Date.now());
            anchor = null;
            btn.textContent = 'Start Shift (share location)';
            btn.style.background = '';
            statusEl.textContent = 'Status: Offline';
            stopLine.textContent = '';
            try { await deleteDoc(doc(db, 'active_fleet', truckId)); } catch (e) {}
        }

        // ----- location permission help -----
        const ua = navigator.userAgent || '';
        const isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
        const isAndroid = /Android/i.test(ua);
        // Built-in browsers inside other apps (GitHub, Facebook, Instagram, Gmail, etc.) often can't use location.
        const inApp = /FBAN|FBAV|Instagram|Line\/|GSA\/|Twitter|LinkedInApp|GitHub|Snapchat|; wv\)/i.test(ua);
        const helpEl = $('loc-help');
        function hideHelp() { helpEl.style.display = 'none'; helpEl.innerHTML = ''; }
        function showHelp(kind) {
            const site = location.hostname;
            let title, steps;
            if (kind === 'insecure') {
                title = 'Location only works on the https:// web address';
                steps = [`Open <strong>https://${esc(site)}${esc(location.pathname)}</strong> instead.`];
            } else if (kind === 'inapp') {
                title = 'Open this page in Chrome or Safari';
                steps = ['You opened this inside another app (like GitHub, Facebook or email). Those built-in browsers often block location.',
                    isIOS ? 'Tap the share / compass button and choose <strong>Open in Safari</strong>.' : 'Tap <strong>⋮</strong> (top right) and choose <strong>Open in Chrome</strong>.',
                    'Sign in again there and tap <strong>Start Shift</strong>.',
                    'Tip: in Chrome/Safari use <strong>Add to Home screen</strong> so drivers always open it the right way.'];
            } else if (kind === 'off') {
                title = 'Your phone\'s Location is turned off';
                steps = isIOS
                    ? ['Open <strong>Settings → Privacy &amp; Security → Location Services</strong> and turn it <strong>On</strong>.', 'Come back here and tap <strong>Try again</strong>.']
                    : ['Swipe down from the top of the screen and turn on <strong>Location</strong>.', 'Come back here and tap <strong>Try again</strong>.'];
            } else { // denied
                title = 'Location is blocked for this website';
                steps = isIOS
                    ? ['In Safari, tap <strong>aA</strong> (left of the web address) → <strong>Website Settings</strong> → <strong>Location</strong> → <strong>Allow</strong>.',
                       'Also check <strong>Settings → Privacy &amp; Security → Location Services</strong> is On, and <strong>Safari Websites</strong> is set to <strong>While Using the App</strong>.',
                       'Reload this page, sign in, and tap <strong>Try again</strong>.']
                    : isAndroid
                    ? ['Tap the <strong>lock / settings icon</strong> left of the web address → <strong>Permissions</strong> (or Site settings) → <strong>Location</strong> → <strong>Allow</strong>.',
                       'Also check phone <strong>Settings → Apps → Chrome → Permissions → Location</strong> is <strong>Allowed</strong>, and Location is turned on.',
                       'Come back and tap <strong>Try again</strong>. If it asks, tap <strong>Allow</strong>.']
                    : ['Click the icon left of the web address and set <strong>Location</strong> to <strong>Allow</strong>.', 'Then tap <strong>Try again</strong>.'];
                if (inApp) steps.unshift('You opened this inside another app — that is usually the cause. Open it in Chrome or Safari instead (⋮ or share button → Open in browser).');
            }
            helpEl.innerHTML = `<h4>📍 ${title}</h4><ol>${steps.map(s => `<li>${s}</li>`).join('')}</ol>`;
            if (kind !== 'insecure') {
                const again = document.createElement('button');
                again.className = 'action-btn'; again.textContent = 'Try again'; again.style.margin = '4px 0 0';
                again.onclick = () => { hideHelp(); btn.click(); };
                helpEl.appendChild(again);
            }
            helpEl.style.display = '';
        }

        btn.onclick = async () => {
            if (tracking) { stopTracking(); return; }
            if (!('geolocation' in navigator)) { alert('Geolocation is not supported by your browser.'); return; }
            if (!window.isSecureContext) { showHelp('insecure'); return; }
            // If location is already blocked for this site, explain how to fix it instead of failing.
            try {
                if (navigator.permissions && navigator.permissions.query) {
                    const st = await navigator.permissions.query({ name: 'geolocation' });
                    if (st.state === 'denied') { showHelp('denied'); return; }
                }
            } catch (e) { /* some browsers (older iPhones) don't support this check; just try */ }
            hideHelp();
            // A truck that dispatch deleted can't start sharing again.
            btn.disabled = true;
            try {
                const reg = await getDoc(doc(db, 'trucks', truckId));
                if (!reg.exists()) { statusEl.textContent = 'This truck has been removed by dispatch. Ask the admin to add it again.'; btn.disabled = false; return; }
            } catch (e) { /* offline: let them start; the location will sync when signal returns */ }
            btn.disabled = false;
            if (tracking) return;
            tracking = true; anchor = null; lastSend = 0; lastSentParked = null;
            shiftToken = stopTokenOf(config); stoppedByDispatch = false;
            btn.textContent = 'End Shift (stop sharing)';
            btn.style.background = '#dc2626';
            statusEl.textContent = 'Connecting to GPS... (tap Allow if your phone asks)';
            lockScreen();
            startWatch(true);
        };

        // Watches the phone's location. Starts with precise GPS; if that keeps timing out (indoors, weak signal)
        // it falls back to the phone's approximate location instead of failing.
        let timeouts = 0, preciseMode = true;
        function startWatch(precise) {
            preciseMode = precise; timeouts = 0;
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            watchId = navigator.geolocation.watchPosition(onPosition, onGeoError,
                precise ? { enableHighAccuracy: true, timeout: 30000, maximumAge: 5000 }
                        : { enableHighAccuracy: false, timeout: 60000, maximumAge: 60000 });
        }
        function onGeoError(err) {
            if (!tracking) return;
            if (err.code === 1) { // PERMISSION_DENIED ("User denied Geolocation")
                stopTracking().then(() => { statusEl.textContent = 'Location permission is blocked on this phone.'; showHelp(inApp ? 'inapp' : 'denied'); });
                return;
            }
            if (err.code === 2) { // POSITION_UNAVAILABLE: location services off / no fix at all
                statusEl.textContent = 'Your phone can\'t find its location yet.';
                showHelp('off');
                return; // keep watching; it recovers on its own once Location is on
            }
            // TIMEOUT: not fatal. Keep trying, and switch to approximate location after a couple of misses.
            timeouts++;
            statusEl.textContent = 'Still looking for a GPS signal… (try near a window or outside)';
            if (preciseMode && timeouts >= 2) startWatch(false);
        }

        async function onPosition(pos) {
                if (!tracking) return;
                hideHelp();
                const now = Date.now();
                const { latitude: lat, longitude: lng } = pos.coords;
                const acc = Math.round(pos.coords.accuracy);
                // Precise mode waits for a good GPS lock; approximate mode accepts a rougher position so the truck still shows up.
                if (acc > (preciseMode ? 150 : 2000)) { statusEl.textContent = `Getting a better GPS lock... (+/- ${acc}m)`; return; }
                if (!preciseMode && acc <= 100) startWatch(true); // GPS is back: return to precise mode

                trackStop(lat, lng, now, acc);
                const since = stopSinceNow(now);
                statusEl.textContent = `Sharing location (+/- ${acc}m)`;
                stopLine.textContent = since ? `At this stop for ${fmtDur(now - since)}` : 'Moving';

                // Ping timing: 30s while moving, 90s while parked, and right away when arriving/leaving a stop.
                const parked = !!(anchor && now - anchor.since >= STOP_MIN_MS);
                const every = parked ? PARKED_MS : MOVING_MS;
                if (tracking && !stoppedByDispatch && (now - lastSend >= every || parked !== lastSentParked)) {
                    lastSend = now; lastSentParked = parked;
                    try {
                        await setDoc(doc(db, 'active_fleet', truckId), {
                            lat, lng, accuracy: acc, truckId,
                            driverName: driverName.slice(0, 40),
                            stopSince: since,
                            lastUpdated: serverTimestamp()
                        });
                    } catch (e) { statusEl.textContent = 'Could not send location. Check your connection.'; }
                }
        }

        $('pin-request-btn').onclick = async () => {
            if (!confirm('Ask dispatch for a new PIN? They will set it and tell you the new one.')) return;
            try {
                await setDoc(doc(db, 'pin_requests', truckId), { at: serverTimestamp(), from: 'driver' });
                $('pin-request-msg').textContent = '✅ Request sent. Dispatch will give you a new PIN.';
            } catch (e) { $('pin-request-msg').textContent = 'Could not send the request. Check your connection.'; }
        };

        $('driver-logout').onclick = async () => { await stopTracking(); await signOut(auth); };

        cleanup = () => {
            stopTracking();
            unsubConfig(); summaryUnsub();
            document.removeEventListener('visibilitychange', onVis);
        };
    }

    // ---------- ADMIN ----------
    function loadLeaflet() {
        if (window.L) return Promise.resolve();
        return new Promise((resolve, reject) => {
            const css = document.createElement('link');
            css.rel = 'stylesheet';
            css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
            document.head.appendChild(css);
            const js = document.createElement('script');
            js.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
            js.onload = resolve; js.onerror = reject;
            document.head.appendChild(js);
        });
    }

    async function showAdmin(user, opts = { primary: true }) {
        mount('tpl-admin');
        const $ = (id) => document.getElementById(id);
        $('admin-who').textContent = 'Signed in as ' + (opts.name ? opts.name + ' (admin)' : 'admin');
        if (opts.primary) getDoc(doc(db, 'setup', 'admin')).then(s => { if (s.exists() && $('admin-who')) $('admin-who').textContent = 'Signed in as ' + s.data().username + ' (admin)'; }).catch(() => {});
        if (!opts.primary) $('admins-section').style.display = 'none'; // only the main admin manages admins
        $('link-customer').textContent = baseUrl;
        $('link-staff').textContent = baseUrl + '#staff';
        $('admin-logout').onclick = () => signOut(auth);
        const errEl = $('admin-err');

        try { await loadLeaflet(); } catch (e) { errEl.textContent = 'Could not load the map library.'; return; }

        const today = dayStr();
        const map = L.map('admin-map').setView([39.5, -98.35], 4);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
        setTimeout(() => map.invalidateSize(), 300);

        let trucks = {}, pins = {}, fleet = {}, daily = {}, recentStops = [], config = { ...DEFAULT_CONFIG };
        const nameOf = (id) => (trucks[id] && trucks[id].driverName) || (fleet[id] && fleet[id].driverName) || '';
        const sumOf = (key) => Object.values(daily).reduce((a, d) => a + (d[key] || 0), 0);
        const markers = {};
        let fitted = false;

        function denied() {
            errEl.textContent = 'Could not read data. Make sure the Firestore rules are published and you signed in as admin.';
        }

        const sortedTruckIds = () => Object.keys(trucks).sort((a, b) => {
            const ca = (trucks[a].city || '').toLowerCase(), cb = (trucks[b].city || '').toLowerCase();
            return ca === cb ? byTruckNum(a, b) : (ca < cb ? -1 : 1);
        });
        // Live locations that don't belong to any truck in your list (e.g. left over from the original app)
        const orphanIds = () => Object.keys(fleet).filter(id => !trucks[id]).sort(byTruckNum);

        function statusOf(id) {
            const f = fleet[id];
            if (!f) return { label: 'Offline', cls: 'off', age: null };
            const age = f.lastUpdated && f.lastUpdated.toMillis ? Date.now() - f.lastUpdated.toMillis() : 0;
            return age > STALE_MS ? { label: 'Stale', cls: 'stale', age } : { label: 'Online', cls: 'on', age };
        }

        function renderStats() {
            const ids = Object.keys(trucks);
            const online = ids.filter(id => statusOf(id).cls === 'on').length;
            const total = sumOf('sales'), items = sumOf('items');
            const stopCount = sumOf('stopCount'), stopMs = sumOf('stopSec') * 1000;
            let html = `<div class="stat"><b>${online} / ${ids.length}</b><span>Trucks online</span></div>`;
            if (config.sales) html += `<div class="stat"><b>${money(total)}</b><span>Sales today</span></div>`;
            if (config.sales && config.items) html += `<div class="stat"><b>${items}</b><span>Items sold today</span></div>`;
            if (config.stops) html += `<div class="stat"><b>${stopCount}</b><span>Stops today</span></div>`
                + `<div class="stat"><b>${stopCount ? fmtDur(stopMs / stopCount) : '—'}</b><span>Avg time at stop</span></div>`;
            $('admin-stats').innerHTML = html;
        }

        function liveCoords(filterCity) {
            return Object.keys(fleet)
                .filter(id => !filterCity || (trucks[id] && (trucks[id].city || '') === filterCity))
                .filter(id => typeof fleet[id].lat === 'number' && typeof fleet[id].lng === 'number')
                .map(id => [fleet[id].lat, fleet[id].lng]);
        }
        function fitTo(city) {
            const pts = liveCoords(city);
            if (!pts.length) { errEl.textContent = 'No trucks are sharing their location' + (city ? ' in ' + city : '') + ' right now.'; return; }
            errEl.textContent = '';
            if (pts.length === 1) map.setView(pts[0], 14); else map.fitBounds(pts, { padding: [50, 50], maxZoom: 15 });
        }

        function renderChips() {
            const cities = [...new Set(Object.values(trucks).map(t => t.city).filter(Boolean))].sort();
            const el = $('admin-chips');
            el.innerHTML = '';
            const make = (label, city) => {
                const b = document.createElement('button');
                b.className = 'chip'; b.textContent = label; b.onclick = () => fitTo(city);
                el.appendChild(b);
            };
            make('🌎 All trucks', null);
            cities.forEach(c => make('📍 ' + c, c));
        }

        function renderMarkers() {
            Object.keys(markers).forEach(id => { if (!fleet[id]) { map.removeLayer(markers[id]); delete markers[id]; } });
            Object.keys(fleet).forEach(id => {
                const f = fleet[id];
                if (typeof f.lat !== 'number' || typeof f.lng !== 'number') return;
                const coords = [f.lat, f.lng];
                if (markers[id]) markers[id].setLatLng(coords); else markers[id] = L.marker(coords).addTo(map);
                const pop = document.createElement('div');
                pop.innerHTML = `<b>🚚 ${esc(truckName(id))}</b>${nameOf(id) ? '<br>' + esc(nameOf(id)) : ''}<br>${esc(trucks[id] ? (trucks[id].city || '') : 'Not in your truck list')}`
                    + `<br><small>${esc(statusOf(id).label)}</small><br>`;
                const b = document.createElement('button');
                b.className = 'pop-stop'; b.textContent = trucks[id] ? 'Stop sharing' : 'Delete';
                b.onclick = () => { map.closePopup(); trucks[id] ? stopTruck(id) : deleteTruck(id); };
                pop.appendChild(b);
                if (trucks[id]) {
                    const d = document.createElement('button');
                    d.className = 'pop-stop'; d.textContent = 'Delete truck'; d.style.marginLeft = '6px'; d.style.background = '#7f1d1d';
                    d.onclick = () => { map.closePopup(); deleteTruck(id); };
                    pop.appendChild(d);
                }
                const wasOpen = markers[id].isPopupOpen && markers[id].isPopupOpen();
                markers[id].bindPopup(pop);
                if (wasOpen) markers[id].openPopup();
            });
            if (!fitted) { const pts = liveCoords(null); if (pts.length) { fitTo(null); fitted = true; } }
        }

        function renderTrucks() {
            const listEl = $('admin-trucks-list');
            const ids = sortedTruckIds();
