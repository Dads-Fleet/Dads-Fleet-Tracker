<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet & Dispatch</title>
    <!-- Home-screen app setup -->
    <link rel="manifest" href="manifest.json" id="manifest-link">
    <meta name="theme-color" content="#ff6fa5">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Dad's Treats" id="apple-title">
    <script>
        // Two home-screen apps from one page: customers get "Dad's Frozen Lemonade & Ice Cream"
        // (icon label "Dad's Treats", opens the request page); staff get "Dispatch" (opens Staff Sign In).
        (function () {
            var staff = location.hash === '#staff' || /[?&](role|view)=(driver|admin)/.test(location.search);
            document.getElementById('manifest-link').href = staff ? 'manifest-staff.json' : 'manifest.json';
            document.getElementById('apple-title').content = staff ? 'Dispatch' : "Dad's Treats";
            document.title = staff ? 'Fleet & Dispatch' : "Dad's Frozen Lemonade & Ice Cream";
        })();
    </script>
    <script>
        // Android/Chrome announces "this can be installed" very early; keep it for the popup.
        window.__installPrompt = null;
        window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__installPrompt = e; document.dispatchEvent(new Event('install-ready')); });
    </script>
    <style>
        :root { --primary: #0f172a; --accent: #2563eb; --bg: #f8fafc; --card: #ffffff; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: var(--bg); color: #1e293b; }
        .container { max-width: 960px; margin: 20px auto; padding: 0 15px; }
        .panel { background: var(--card); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        input, select, button.action-btn { width: 100%; padding: 12px; margin: 8px 0 16px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; background-color: #fff; }
        input[type=checkbox] { width: auto; margin: 0 8px 0 0; }
        button.action-btn { background: var(--accent); color: white; font-weight: bold; border: none; cursor: pointer; }
        button.link-btn { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 14px; padding: 0; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 10px; }
        .topbar small { color: #64748b; word-break: break-all; }
        .err { color: #dc2626; font-weight: 600; text-align: center; min-height: 1.2em; }
        h3 { margin: 22px 0 8px; }
        #admin-map { height: 400px; width: 100%; border-radius: 8px; margin-bottom: 16px; }
        .card { background: #f1f5f9; padding: 12px 16px; border-left: 4px solid var(--accent); margin-bottom: 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .badge { background: #dbeafe; color: #1e40af; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; white-space: nowrap; }
        .badge.on { background: #dcfce7; color: #166534; }
        .badge.stale { background: #fef3c7; color: #92400e; }
        .badge.off { background: #e2e8f0; color: #475569; }
        .share-box { background: #e2e8f0; padding: 12px; border-radius: 6px; margin-bottom: 16px; word-break: break-all; font-size: 13px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 12px 0; }
        .stat { background: #f1f5f9; border-radius: 10px; padding: 12px; text-align: center; }
        .stat b { display: block; font-size: 22px; }
        .stat span { font-size: 12px; color: #64748b; }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
        .chip { border: 1px solid #cbd5e1; background: #fff; border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
        .chip:hover { border-color: var(--accent); color: var(--accent); }
        .city-head { margin: 14px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: #64748b; }
        .tcard { border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; margin-bottom: 8px; cursor: pointer; background: #fff; }
        .tcard:hover { border-color: var(--accent); }
        .tcard .row { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }
        .metrics { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 6px; font-size: 13px; color: #334155; }
        .muted { color: #64748b; font-size: 13px; }
        .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
        .tbl th, .tbl td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #e2e8f0; }
        .inline-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; align-items: end; }
        .inline-form input, .inline-form select { margin: 4px 0 0; }
        .inline-form button.action-btn { margin: 4px 0 0; }
        .toggle { display: flex; align-items: center; margin: 6px 0; }
        .req-card { background: #eff6ff; border: 1px solid #93c5fd; border-radius: 10px; padding: 10px 12px; margin: 8px 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .install-sheet { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 9999; padding: 12px; }
        .install-card { background: #fff; border-radius: 18px; padding: 16px; width: 100%; max-width: 440px; box-shadow: 0 -6px 30px rgba(0,0,0,.25); margin-bottom: env(safe-area-inset-bottom); }
        .install-card ol { margin: 6px 0 0; padding-left: 20px; }
        .install-card li { margin: 4px 0; }
        .loc-help { background: #fff7ed; border: 1px solid #fdba74; border-radius: 10px; padding: 12px 14px; margin: 4px 0 12px; font-size: 14px; color: #431407; }
        .loc-help h4 { margin: 0 0 6px; font-size: 15px; }
        .loc-help ol { margin: 6px 0 8px; padding-left: 20px; }
        .loc-help li { margin: 3px 0; }
        .pin-input { font-size: 28px; letter-spacing: 12px; text-align: center; }
        .pin-input::placeholder { letter-spacing: 6px; }
        .stopbar { background: #fef2f2; border: 1px solid #fecaca; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
        .pop-stop { margin-top: 6px; background: #dc2626; color: #fff; border: none; border-radius: 6px; padding: 6px 10px; font-weight: 600; cursor: pointer; }
        .link-btn.stop-link { color: #dc2626; }
        /* ---------- staff panels, driver map & dispatch ---------- */
        .topbar { flex-wrap: wrap; }
        .topbar-right { display: flex; align-items: center; gap: 12px; margin-left: auto; }
        .panel-switch { width: auto; margin: 0; padding: 6px 8px; font-size: 14px; border-radius: 8px; }
        .driver-map { height: 300px; width: 100%; border-radius: 10px; margin: 10px 0 4px; background: #e2e8f0; }
        .map-tools { display: flex; gap: 16px; justify-content: flex-end; flex-wrap: wrap; margin-bottom: 8px; }
        .dispatch-card { background: #fff7ed; border: 2px solid #fb923c; border-radius: 12px; padding: 12px 14px; margin: 10px 0; }
        .dispatch-card h3 { margin: 0 0 2px; }
        .stop-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid #fed7aa; }
        .stop-row.done .stop-main { opacity: .55; text-decoration: line-through; }
        .stop-num { flex: 0 0 26px; height: 26px; border-radius: 50%; background: #ea580c; color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 13px; }
        .stop-num.done { background: #16a34a; }
        .stop-main { flex: 1; min-width: 0; overflow-wrap: anywhere; }
        .stop-main small { color: #64748b; display: block; }
        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .btn-row .action-btn { flex: 1; margin: 0; width: auto; min-width: 140px; }
        .btn-green { background: #16a34a !important; }
        .btn-orange { background: #ea580c !important; }
        .mini-btn { background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 14px; white-space: nowrap; }
        .mini-btn:disabled { opacity: .4; cursor: default; }
        .alert-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.6); z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .alert-box { background: #fff; border-radius: 16px; max-width: 440px; width: 100%; max-height: 90vh; overflow: auto; padding: 18px; box-shadow: 0 10px 40px rgba(0,0,0,.35); animation: alertPop .35s ease-out; }
        .alert-box h2 { margin: 0 0 6px; color: #c2410c; }
        @keyframes alertPop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
        .stop-pin { background: #ea580c; color: #fff; border: 2px solid #fff; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
        .stop-pin.draft { background: #7c3aed; }
        .stop-pin.done { background: #16a34a; }
        .me-dot { width: 18px; height: 18px; border-radius: 50%; background: #2563eb; border: 3px solid #fff; box-shadow: 0 0 0 3px rgba(37,99,235,.3), 0 2px 6px rgba(0,0,0,.3); }
        details.dispatch-box { background: #f5f3ff; border-color: #c4b5fd; }
        .draft-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #e9d5ff; }
        .search-results { border: 1px solid #c4b5fd; border-radius: 8px; background: #fff; margin: -4px 0 10px; overflow: hidden; }
        .search-results button { display: block; width: 100%; text-align: left; background: none; border: none; border-bottom: 1px solid #ede9fe; padding: 10px; font-size: 14px; cursor: pointer; }
        .search-results button:last-child { border-bottom: none; }
        body.map-tap-on #admin-map { cursor: crosshair; outline: 3px solid #7c3aed; }
        .disp-card { background: #fff; border: 1px solid #ddd6fe; border-radius: 10px; padding: 10px 12px; margin: 8px 0; }
        button.action-btn:disabled { opacity: .55; cursor: default; }
        details { border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px 14px; margin-top: 14px; }
        summary { cursor: pointer; font-weight: 700; }

        /* ---------- CUSTOMER THEME ---------- */
        body.customer-theme {
            background: linear-gradient(180deg, #ffe3ef 0%, #e0f7ff 55%, #fff6dc 100%);
            background-attachment: fixed;
            font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
            min-height: 100vh;
        }
        .c-wrap { max-width: 520px; margin: 0 auto; padding: 24px 16px 48px; position: relative; z-index: 1; overflow: hidden; }
        .c-hero { text-align: center; position: relative; padding-top: 8px; }
        .c-hero h1 { margin: 6px 0 4px; font-size: clamp(1.4rem, 7vw, 2rem); line-height: 1.12; color: #d6336c; text-shadow: 2px 2px 0 #fff; letter-spacing: .3px; }
        .c-hero h1 .nw { white-space: nowrap; }
        .c-hero p { margin: 0 auto 8px; color: #5b6b86; max-width: 360px; }
        .c-art { display: flex; justify-content: center; align-items: flex-end; gap: 18px; height: 150px; }
        .c-art svg { height: 140px; width: auto; filter: drop-shadow(0 6px 6px rgba(0,0,0,.12)); }
        .c-art .cone { animation: bob 3.2s ease-in-out infinite; }
        .c-art .slush { animation: bob 3.2s ease-in-out infinite .8s; }
        @keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
        .c-art .hero-bar { position: relative; width: 150px; height: 120px; }
        .hero-bar .hb-item { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; opacity: 0; transform: scale(.85) rotate(-6deg); transition: opacity .9s ease, transform .9s ease; }
        .hero-bar .hb-item.on { opacity: 1; transform: none; }
        .c-art .hero-bar svg { height: 100%; width: auto; max-width: 100%; }
        .slush .sl-a { fill: var(--sl-a, #d62839); transition: fill 2s ease; }
        .slush .sl-b { stroke: var(--sl-b, #ff8a95); transition: stroke 2s ease; }
        .treat-layer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: -1; }
        .treat { position: absolute; top: -130px; opacity: .8; animation: treatFall 24s linear infinite; will-change: transform; }
        .treat-inner svg { width: 100%; height: auto; display: block; }
        @keyframes treatFall { from { transform: translateY(-130px); } to { transform: translateY(calc(100vh + 170px)); } }
        .treat-inner { position: relative; display: block; isolation: isolate; animation: treatSway 4.5s ease-in-out infinite alternate; }
        .treat-inner > .art { position: relative; z-index: 1; display: block; }
        .acc-wings { position: absolute; left: -55%; width: 210%; top: 12%; z-index: 0; }
        .acc-hat { position: absolute; left: 12%; width: 76%; top: -24%; z-index: 2; transform: rotate(-12deg); }
        .acc-floatie { position: absolute; left: -18%; width: 136%; top: 44%; z-index: 2; }
        .acc-lei { position: absolute; left: -4%; width: 108%; top: 48%; z-index: 2; }
        .acc-bunny { position: absolute; left: 5%; width: 90%; top: -38%; z-index: 2; }
        .c-art svg { overflow: visible; }
        .acc-ears { position: absolute; left: 5%; width: 90%; top: -14%; z-index: 2; }
        .acc-pumpkin { position: absolute; left: 15%; width: 70%; top: -30%; z-index: 2; transform: rotate(-8deg); }
        .acc-ghost { position: absolute; left: -14%; width: 128%; top: -16%; z-index: 2; opacity: .96; }
        .acc-spider { position: absolute; left: 30%; width: 40%; top: -55%; z-index: 2; animation: spiderBob 2.4s ease-in-out infinite alternate; }
        @keyframes spiderBob { from { transform: translateY(-4px); } to { transform: translateY(4px); } }
        .hero-wings { position: absolute; left: -15%; width: 130%; top: 20%; z-index: 0; pointer-events: none; }
        .hero-bar .hb-item { z-index: 1; }
        .c-art .slush-bar { position: relative; width: 100px; height: 140px; }
        .slush-bar .sb-item { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; opacity: 0; transform: scale(.85) rotate(6deg); transition: opacity .9s ease, transform .9s ease; }
        .slush-bar .sb-item.on { opacity: 1; transform: none; }
        .c-art .slush-bar svg { height: 100%; width: auto; max-width: 100%; }
        .slush-bar .eyes { transform-box: fill-box; transform-origin: center; }
        .slush-bar .sb-item.on .eyes { animation: heroBlink 4s ease-in-out 2.2s infinite; }
        .hero-bar .hb-item > svg { position: relative; z-index: 1; }
        .acc-wings .wl, .acc-wings .wr, .hero-wings .wl, .hero-wings .wr { transform-box: fill-box; animation: flapL .45s ease-in-out infinite alternate; }
        .acc-wings .wl, .hero-wings .wl { transform-origin: right center; }
        .acc-wings .wr, .hero-wings .wr { transform-origin: left center; animation-name: flapR; }
        .hero-wings .wl, .hero-wings .wr { animation-duration: .8s; }
        @keyframes flapL { from { transform: rotate(0); } to { transform: rotate(18deg) scaleY(.8); } }
        @keyframes flapR { from { transform: rotate(0); } to { transform: rotate(-18deg) scaleY(.8); } }
        .treat.sold { opacity: .45; }
        .treat.sold svg { filter: grayscale(.5); }
        .sold-tag { display: block; margin: 2px auto 0; width: max-content; font: 700 8px/1.4 system-ui, sans-serif; color: #fff; background: #868e96; border-radius: 6px; padding: 0 4px; }
        .truck-run { position: fixed; left: 0; top: 38%; width: 150px; z-index: 50; pointer-events: none; animation: truckDrive 4.2s ease-in-out forwards; }
        .truck-run svg { width: 100%; display: block; animation: truckBob .35s ease-in-out infinite alternate; }
        .truck-run .wheel { transform-box: fill-box; transform-origin: center; animation: wheelSpin .5s linear infinite; }
        .truck-bubble { position: absolute; left: 50%; top: -26px; transform: translateX(-50%); background: #fff; color: #d6336c; font: 700 13px/1 system-ui, sans-serif; padding: 6px 10px; border-radius: 12px; box-shadow: 0 3px 10px rgba(0,0,0,.12); white-space: nowrap; }
        @keyframes truckDrive { from { transform: translateX(-170px); } to { transform: translateX(calc(100vw + 20px)); } }
        @keyframes truckBob { from { transform: translateY(0); } to { transform: translateY(-2px); } }
        @keyframes wheelSpin { to { transform: rotate(360deg); } }
        .hero-bar .eyes { transform-box: fill-box; transform-origin: center; }
        .hero-bar .hb-item.on .eyes { animation: heroBlink 4s ease-in-out .8s infinite; }
        @keyframes heroBlink { 0%, 5%, 100% { transform: scaleY(1); } 2.5% { transform: scaleY(.1); } }
        @keyframes treatSway { from { transform: rotate(-12deg) translateX(-5px); } to { transform: rotate(12deg) translateX(5px); } }

        .c-card { background: rgba(255,255,255,.92); border: 3px dashed #ffb3cf; border-radius: 22px; padding: 22px 20px 18px; margin-top: 10px; box-shadow: 0 10px 24px rgba(214,51,108,.15); position: relative; }
        .c-card label { font-weight: 700; color: #7a3b57; font-size: 14px; }
        .c-card input { border: 2px solid #ffd0e1; border-radius: 14px; background: #fffafc; }
        .c-card input:focus { outline: none; border-color: #ff6fa5; box-shadow: 0 0 0 3px rgba(255,111,165,.2); }
        .c-card .action-btn { background: linear-gradient(135deg, #ff6fa5, #ff8e53); border-radius: 999px; font-size: 18px; padding: 14px; box-shadow: 0 6px 0 #d6336c; margin-bottom: 14px; transition: transform .08s, box-shadow .08s; }
        .c-card .action-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #d6336c; }
        .c-status { text-align: center; font-weight: 700; min-height: 1.4em; margin: 0; }
        .c-wave { display: block; width: 100%; height: 36px; margin-top: 26px; }
        .staff-link { display: block; text-align: center; font-size: 12px; color: #a78bab; margin-top: 4px; text-decoration: none; }
        .staff-link:hover { text-decoration: underline; }

        @media (prefers-reduced-motion: reduce) { .c-art svg, .c-art .hero-bar, .treat, .treat-inner, .acc-wings g, .hero-wings g, .acc-spider { animation: none; } .treat-layer, .truck-run { display: none; } .hero-bar .eyes, .slush-bar .eyes { animation: none; } }
    </style>
</head>
<body>

<div id="app"></div>

<!-- "Add to home screen" popup (staff pages only) -->
<div id="install-sheet" class="install-sheet" style="display:none;" role="dialog" aria-labelledby="install-title">
    <div class="install-card">
        <div style="display:flex; gap:12px; align-items:center;">
            <img src="icon-192.png" id="install-icon" alt="" width="52" height="52" style="border-radius:12px;">
            <div>
                <strong id="install-title" style="font-size:17px;">Add to your home screen?</strong>
                <div class="muted" style="font-size:13px;" id="install-sub"></div>
            </div>
        </div>
        <div id="install-body" style="margin-top:10px; font-size:14px;"></div>
        <div style="display:flex; gap:10px; margin-top:12px;">
            <button class="action-btn" id="install-later" style="margin:0; background:#e2e8f0; color:#0f172a;">Not now</button>
            <button class="action-btn" id="install-go" style="margin:0;">Add</button>
        </div>
    </div>
</div>

<!-- ============ TEMPLATES (only the one for the visitor is ever inserted) ============ -->

<template id="tpl-customer">
    <div class="c-wrap">
        <div class="c-hero">
            <div class="c-art" aria-hidden="true">
                <div class="cone hero-bar">
                    <div class="hb-item base on">
                        <svg viewBox="0 0 180 130" xmlns="http://www.w3.org/2000/svg">
                        <g transform="rotate(-8 90 65)">
                        <rect x="18" y="58" width="144" height="52" rx="12" fill="#2f190f"/>
                        <path d="M19,60 H161 V93 Q150,100 140,95 Q128,101 116,96 Q102,102 90,96 Q76,101 64,96 Q50,102 40,95 Q28,99 19,92 Z" fill="#fbf4e6"/>
                        <path d="M19,88 Q28,95 40,91 Q50,98 64,92 Q76,97 90,92 Q102,98 116,92 Q128,97 140,91 Q150,95 161,88 V93 Q150,100 140,95 Q128,101 116,96 Q102,102 90,96 Q76,101 64,96 Q50,102 40,95 Q28,99 19,92 Z" fill="#eadcc0"/>
                        <rect x="18" y="56" width="144" height="31" rx="12" fill="#2b170d"/>

    const routeCache = new Map();
    async function fetchRoute(pts) {
        const key = pts.map(p => p[0].toFixed(5) + ',' + p[1].toFixed(5)).join(';');
        if (routeCache.has(key)) return routeCache.get(key);
        const coords = pts.map(p => p[1].toFixed(6) + ',' + p[0].toFixed(6)).join(';');
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 9000);
        try {
            const res = await fetch('https://router.project-osrm.org/route/v1/driving/' + coords + '?overview=full&geometries=geojson', { signal: ctrl.signal });
            if (!res.ok) return null;
            const j = await res.json();
            const r0 = j && j.code === 'Ok' && Array.isArray(j.routes) ? j.routes[0] : null;
            if (!r0 || !r0.geometry || !Array.isArray(r0.geometry.coordinates) || r0.geometry.coordinates.length < 2) return null;

        const ALL_TREATS = Object.keys(TREAT_ART);
        const HERO_DEFAULT = ['rocket-pop', 'cookie-dough-cone', 'fudge-bar', 'strawberry-crunch-bar', 'vanilla-cone', 'watermelon-pop', 'orange-cream-bar', 'cotton-candy-cone', 'twin-pop', 'chocolate-dipped-bar', 'chocolate-cone', 'gumball-cone-cup', 'cookies-cream-bar'];
        // Slushies and pops are featured: they show up about 3x as often in the falling treats and a bit bigger.
        const isFeatured = (k) => k.startsWith('slush-') || /pop|bar/.test(k);
        // Find the best drawing for each item name: tags found in the name score by length,
        // words from the drawing's own name break ties (so 'Watermelon Pop' beats the watermelon slushie).
        const treatKeysFor = (names) => {
            const out = new Set();
            names.forEach(raw => {
                const x = String(raw).toLowerCase();
                if (TREAT_ART[x]) { out.add(x); return; }
                let best = 0, keys = [];
                ALL_TREATS.forEach(k => {
                    let score = TREAT_ART[k].tags.reduce((s, t) => s + (x.includes(t) ? t.length : 0), 0);
                    if (!score) return;
                    score += k.split('-').filter(w => x.includes(w)).length * 2;
                    if (score > best) { best = score; keys = [k]; } else if (score === best) keys.push(k);
                });
                keys.forEach(k => out.add(k));
            });
            return [...out];
        };

        // Slushie flavor rotation: [base color, swirl color]. Singles get a lighter swirl; mixes swirl two flavors.
        const CHERRY = '#d62839', LEMON = '#f7c815', MELON = '#ff4f74', BLUE = '#3b5bdb';
        const FLAVORS = [
            [CHERRY, '#ff8a95'], [LEMON, CHERRY], [MELON, LEMON], [BLUE, CHERRY], [LEMON, '#fff3a3'],
            [BLUE, LEMON], [MELON, '#9be3a1'], [CHERRY, BLUE], [BLUE, '#91a7ff'], [MELON, BLUE]
        ];
        let slushArt = document.querySelector('.c-art .slush');
        let flavorIdx = 0;
        const flavorTimer = setInterval(() => {
            if (!slushArt || !slushArt.isConnected) { clearInterval(flavorTimer); return; }
            if (document.hidden) return;
            flavorIdx = (flavorIdx + 1) % FLAVORS.length;
            slushArt.style.setProperty('--sl-a', FLAVORS[flavorIdx][0]);
            slushArt.style.setProperty('--sl-b', FLAVORS[flavorIdx][1]);
